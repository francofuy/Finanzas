    <style>

        .text-blue-300 { color: #93c5fd; }
        .text-blue-400 { color: #60a5fa; }
        .text-amber-300 { color: #fcd34d; }
        .text-amber-400 { color: #fbbf24; }

        .bg-slate-800 { background-color: #1e293b; }

        .bg-cyan-500 { background-color: #06b6d4; }
        
        .border-slate-700 { border-color: #334155; }
        .border-cyan-500 { border-color: #06b6d4; }
        
        /* Custom components */
        .card {
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(71, 85, 105, 0.5);
            border-radius: 0.75rem;

        }
        
        .btn {
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            border: none;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
            display: inline-flex;

        .btn-primary {
            background: #06b6d4;

        }

        }
        
        .btn-secondary {
            background: #334155;

        }
        
        .btn-secondary:hover {
            background: #475569;
        }
        
        .input {
            width: 100%;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid #334155;
            color: #f1f5f9;
            font-size: 0.875rem;
        }
        
        .input:focus {
            outline: none;
            border-color: #06b6d4;
        }
        
        .header {
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(24px);
            border-bottom: 1px solid rgba(6, 182, 212, 0.2);
        }
        
        .nav-btn {
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            border: none;
            background: transparent;
            color: #94a3b8;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .nav-btn:hover {
            color: #cbd5e1;
            background: rgba(30, 41, 59, 0.5);
        }
        
        .nav-btn.active {
            background: rgba(6, 182, 212, 0.2);
            color: #22d3ee;
            border: 1px solid rgba(6, 182, 212, 0.3);
        }
        
        .hero-card {
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.1), rgba(59, 130, 246, 0.1), rgba(139, 92, 246, 0.1));
            border: 1px solid rgba(6, 182, 212, 0.2);
            border-radius: 1rem;
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }
        
        .hero-card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 16rem;
            height: 16rem;
            background: rgba(6, 182, 212, 0.1);
            border-radius: 50%;
            filter: blur(64px);
        }
        
        .gradient-text {
            background: linear-gradient(to right, #22d3ee, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .progress-bar {
            height: 0.5rem;
            background: #0f172a;
            border-radius: 9999px;
            overflow: hidden;
            margin-top: 1rem;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(to right, #06b6d4, #3b82f6);
            border-radius: 9999px;
            transition: width 0.3s;
        }
        
        .progress-fill.danger { background: #ef4444; }
        .progress-fill.warning { background: #f59e0b; }
        
        .alert {
            padding: 0.75rem;
            border-radius: 0.5rem;
            border: 1px solid;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .alert-info {
            background: rgba(59, 130, 246, 0.1);
            border-color: rgba(59, 130, 246, 0.3);
            color: #93c5fd;
        }
        
        .alert-warning {
            background: rgba(245, 158, 11, 0.1);
            border-color: rgba(245, 158, 11, 0.3);
            color: #fcd34d;
        }
        
        .alert-danger {
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        thead {
            border-bottom: 1px solid #334155;
        }
        
        th {
            padding: 0.75rem 1rem;
            text-align: left;
            font-size: 0.75rem;
            font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
        }
        
        td {
            padding: 1rem;
            border-bottom: 1px solid rgba(51, 65, 85, 0.5);
        }
        
        tbody tr:hover {
            background: rgba(51, 65, 85, 0.3);
        }
        
        @media (min-width: 768px) {
            .md-grid-cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .md-grid-cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // Storage Layer
        const storage = {
            get(key) {
                try {
                    const value = localStorage.getItem(key);
                    return value ? JSON.parse(value) : null;
                } catch (error) {
                    console.error('Error getting', key, error);
                    return null;
                }
            },
            
            set(key, value) {
                try {
                    localStorage.setItem(key, JSON.stringify(value));
                    return true;
                } catch (error) {
                    console.error('Error setting', key, error);
                    return false;
                }
            },
            
            list(prefix) {
                try {
                    const keys = [];
                    for (let i = 0; i < localStorage.length; i++) {
                        const key = localStorage.key(i);
                        if (key.startsWith(prefix)) {
                            keys.push(key);
                        }
                    }
                    return keys;
                } catch (error) {
                    console.error('Error listing', prefix, error);
                    return [];
                }
            }
        };

        // ML Categorizer
        class MLCategorizer {
            constructor() {
                this.patterns = {};
                this.history = [];
            }
            
            train(transaction, category) {
                const key = this.extractFeatures(transaction);
                if (!this.patterns[key]) {
                    this.patterns[key] = {};
                }
                this.patterns[key][category] = (this.patterns[key][category] || 0) + 1;
                this.history.push({ transaction, category, timestamp: Date.now() });
                
                if (this.history.length > 1000) {
                    this.history = this.history.slice(-1000);
                }
                
                storage.set('ml-model', {
                    patterns: this.patterns,
                    history: this.history.slice(-100)
                });
            }
            
            extractFeatures(transaction) {
                const desc = transaction.description.toLowerCase();
                const words = desc.split(/\s+/).filter(w => w.length > 3);
                const amount = Math.round(transaction.amount / 10) * 10;
                const day = new Date(transaction.date).getDay();
                return `${words.slice(0, 2).join('_')}_${amount}_${day}`;
            }
            
            predict(transaction) {
                const key = this.extractFeatures(transaction);
                const matches = this.patterns[key];
                
                if (!matches) {
                    const desc = transaction.description.toLowerCase();
                    for (const hist of this.history.slice(-50)) {
                        if (hist.transaction.description.toLowerCase().includes(desc.slice(0, 5))) {
                            return { category: hist.category, confidence: 0.6 };
                        }
                    }
                    return { category: 'other', confidence: 0.0 };
                }
                
                const total = Object.values(matches).reduce((a, b) => a + b, 0);
                const best = Object.entries(matches).sort((a, b) => b[1] - a[1])[0];
                
                return {
                    category: best[0],
                    confidence: best[1] / total
                };
            }
            
            load() {
                const model = storage.get('ml-model');
                if (model) {
                    this.patterns = model.patterns || {};
                    this.history = model.history || [];
                }
            }
        }

        // Prediction Engine
        class PredictionEngine {
            constructor(transactions) {
                this.transactions = transactions;
            }
            
            generateAlerts(budgets, currentMonth) {
                const alerts = [];
                const now = new Date();
                const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
                const dayOfMonth = now.getDate();
                const progressPct = dayOfMonth / daysInMonth;
                
                Object.entries(budgets).forEach(([category, limit]) => {
                    const spent = this.transactions
                        .filter(t => t.category === category && t.date.startsWith(currentMonth))
                        .reduce((sum, t) => sum + t.amount, 0);
                    
                    const spentPct = spent / limit;
                    
                    if (spentPct > 0.9 && spentPct <= 1.0) {
                        alerts.push({
                            type: 'warning',
                            category,
                            message: `Estás al ${Math.round(spentPct * 100)}% del presupuesto de ${category}`,
                            severity: 'medium'
                        });
                    } else if (spentPct > 1.0) {
                        alerts.push({
                            type: 'danger',
                            category,
                            message: `Has excedido el presupuesto de ${category} en $${Math.round(spent - limit)}`,
                            severity: 'high'
                        });
                    } else if (spentPct > progressPct + 0.15) {
                        alerts.push({
                            type: 'info',
                            category,
                            message: `Vas ${Math.round((spentPct - progressPct) * 100)}% por encima del ritmo esperado en ${category}`,
                            severity: 'low'
                        });
                    }
                });
                
                return alerts.sort((a, b) => {
                    const severity = { high: 3, medium: 2, low: 1 };
                    return severity[b.severity] - severity[a.severity];
                });
            }
        }

        // Main App
        function FinanceApp() {
            const [view, setView] = useState('dashboard');
            const [transactions, setTransactions] = useState([]);
            const [categories, setCategories] = useState([]);
            const [budgets, setBudgets] = useState({});
            const [goals, setGoals] = useState([]);
            const [mlCategorizer] = useState(() => new MLCategorizer());
            const [loading, setLoading] = useState(true);
            
            const currentMonth = useMemo(() => {
                const now = new Date();
                return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
            }, []);
            
            useEffect(() => {
                const init = () => {
                    setLoading(true);
                    
                    let cats = storage.get('categories');
                    if (!cats) {
                        cats = [
                            { id: 'food', name: 'Alimentación', icon: '🍔', color: '#10b981' },
                            { id: 'transport', name: 'Transporte', icon: '🚗', color: '#3b82f6' },
                            { id: 'housing', name: 'Vivienda', icon: '🏠', color: '#8b5cf6' },
                            { id: 'entertainment', name: 'Entretenimiento', icon: '🎬', color: '#f59e0b' },
                            { id: 'shopping', name: 'Compras', icon: '🛍️', color: '#ec4899' },
                            { id: 'health', name: 'Salud', icon: '⚕️', color: '#06b6d4' },
                            { id: 'utilities', name: 'Servicios', icon: '⚡', color: '#6366f1' },
                            { id: 'income', name: 'Ingresos', icon: '💰', color: '#22c55e' },
                            { id: 'savings', name: 'Ahorros', icon: '🏦', color: '#14b8a6' },
                            { id: 'other', name: 'Otros', icon: '📦', color: '#64748b' }
                        ];
                        storage.set('categories', cats);
                    }
                    setCategories(cats);
                    
                    const txKeys = storage.list('transactions:');
                    const allTx = [];
                    for (const key of txKeys) {
                        const monthTx = storage.get(key);
                        if (monthTx) allTx.push(...monthTx);
                    }
                    setTransactions(allTx.sort((a, b) => new Date(b.date) - new Date(a.date)));
                    
                    const budgetData = storage.get(`budgets:${currentMonth}`) || {};
                    setBudgets(budgetData);
                    
                    const goalsData = storage.get('goals') || [];
                    setGoals(goalsData);
                    
                    mlCategorizer.load();
                    
                    setLoading(false);
                };
                
                init();
            }, [currentMonth, mlCategorizer]);
            
            const addTransaction = (transaction) => {
                const newTx = {
                    id: Date.now().toString(),
                    date: new Date().toISOString().split('T')[0],
                    ...transaction
                };
                
                if (!newTx.category || newTx.category === 'Sin categorizar') {
                    const prediction = mlCategorizer.predict(newTx);
                    if (prediction.confidence > 0.5) {
                        newTx.category = prediction.category;
                        newTx.autoCategorizied = true;
                    } else {
                        newTx.category = 'other';
                    }
                }
                
                const updated = [newTx, ...transactions];
                setTransactions(updated);
                
                const month = newTx.date.substring(0, 7);
                const monthTx = updated.filter(t => t.date.startsWith(month));
                storage.set(`transactions:${month}`, monthTx);
                
                if (newTx.category !== 'Sin categorizar') {
                    mlCategorizer.train(newTx, newTx.category);
                }
            };
            
            const deleteTransaction = (txId) => {
                const txToDelete = transactions.find(t => t.id === txId);
                if (!txToDelete) return;
                
                const updated = transactions.filter(t => t.id !== txId);
                setTransactions(updated);
                
                const month = txToDelete.date.substring(0, 7);
                const monthTx = updated.filter(t => t.date.startsWith(month));
                storage.set(`transactions:${month}`, monthTx);
            };
            
            const updateBudget = (category, amount) => {
                const updated = { ...budgets, [category]: amount };
                setBudgets(updated);
                storage.set(`budgets:${currentMonth}`, updated);
            };
            
            const addGoal = (goal) => {
                const newGoal = { id: Date.now().toString(), ...goal, progress: 0 };
                const updated = [...goals, newGoal];
                setGoals(updated);
                storage.set('goals', updated);
            };
            
            const updateGoal = (goalId, amount) => {
                const updated = goals.map(goal => {
                    if (goal.id === goalId) {
                        return { ...goal, progress: goal.progress + amount };
                    }
                    return goal;
                });
                setGoals(updated);
                storage.set('goals', updated);
            };
            
            const exportData = () => {
                const data = {
                    transactions,
                    categories,
                    budgets,
                    goals,
                    exportDate: new Date().toISOString()
                };
                
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `finanzas-${currentMonth}.json`;
                a.click();
            };
            
            if (loading) {
                return (
                    <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                        <div className="text-2xl font-serif text-cyan-400">Cargando finanzas...</div>
                    </div>
                );
            }
            
            return (
                <div>
                    <Header view={view} setView={setView} onExport={exportData} />
                    
                    <main className="container py-8">
                        {view === 'dashboard' && (
                            <Dashboard 
                                transactions={transactions}
                                categories={categories}
                                budgets={budgets}
                                currentMonth={currentMonth}
                            />
                        )}
                        
                        {view === 'transactions' && (
                            <TransactionsView
                                transactions={transactions}
                                categories={categories}
                                onAdd={addTransaction}
                                onDelete={deleteTransaction}
                            />
                        )}
                        
                        {view === 'budget' && (
                            <BudgetView
                                budgets={budgets}
                                categories={categories}
                                transactions={transactions}
                                currentMonth={currentMonth}
                                onUpdate={updateBudget}
                            />
                        )}
                        
                        {view === 'goals' && (
                            <GoalsView
                                goals={goals}
                                onAdd={addGoal}
                                onUpdateGoal={updateGoal}
                            />
                        )}
                    </main>
                </div>
            );
        }

        // Header Component
        function Header({ view, setView, onExport }) {
            return (
                <header className="header">
                    <div className="container py-4">
                        <div className="flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 rounded-xl" style={{ background: 'linear-gradient(135deg, #22d3ee, #3b82f6)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                                    <span style={{ fontSize: '1.5rem' }}>💰</span>
                                </div>
                                <div>
                                    <h1 className="text-2xl font-serif font-bold gradient-text">
                                        Finanzas Pro
                                    </h1>
                                    <p className="text-xs text-slate-400">Tu asistente financiero inteligente</p>
                                </div>
                            </div>
                            
                            <nav className="flex gap-2">
                                <button onClick={() => setView('dashboard')} className={view === 'dashboard' ? 'nav-btn active' : 'nav-btn'}>
                                    📊 Dashboard
                                </button>
                                <button onClick={() => setView('transactions')} className={view === 'transactions' ? 'nav-btn active' : 'nav-btn'}>
                                    💵 Transacciones
                                </button>
                                <button onClick={() => setView('budget')} className={view === 'budget' ? 'nav-btn active' : 'nav-btn'}>
                                    🏷️ Presupuesto
                                </button>
                                <button onClick={() => setView('goals')} className={view === 'goals' ? 'nav-btn active' : 'nav-btn'}>
                                    🎯 Metas
                                </button>
                            </nav>
                            
                            <button onClick={onExport} className="btn-secondary" title="Exportar datos">
                                ⬇️ Exportar
                            </button>
                        </div>
                    </div>
                </header>
            );
        }

        // Dashboard Component
        function Dashboard({ transactions, categories, budgets, currentMonth }) {
            const predictor = useMemo(() => new PredictionEngine(transactions), [transactions]);
            
            const thisMonthTx = transactions.filter(t => t.date.startsWith(currentMonth));
            const totalSpent = thisMonthTx
                .filter(t => t.amount > 0 && !['income', 'savings'].includes(t.category))
                .reduce((sum, t) => sum + t.amount, 0);
            
            const totalIncome = thisMonthTx
                .filter(t => t.category === 'income')
                .reduce((sum, t) => sum + t.amount, 0);
            
            const totalBudget = Object.values(budgets).reduce((sum, b) => sum + b, 0);
            
            const now = new Date();
            const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
            const daysRemaining = daysInMonth - now.getDate();
            const budgetRemaining = totalBudget - totalSpent;
            const canSpendToday = daysRemaining > 0 ? Math.round(budgetRemaining / daysRemaining) : 0;
            
            const alerts = predictor.generateAlerts(budgets, currentMonth);
            
            return (
                <div className="space-y-6">
                    <div className="hero-card">
                        <div style={{ position: 'relative', zIndex: 1 }}>
                            <div className="flex items-center gap-2 mb-2">
                                <span style={{ fontSize: '1.25rem' }}>⚡</span>
                                <span className="text-sm text-cyan-400 font-medium">Puedes gastar hoy</span>
                            </div>
                            <div className="text-6xl font-serif font-bold gradient-text">
                                ${canSpendToday.toLocaleString()}
                            </div>
                            <div className="mt-4 flex gap-6 text-sm" style={{ flexWrap: 'wrap' }}>
                                <div>
                                    <span className="text-slate-400">Gastado este mes:</span>
                                    <span className="ml-2 text-slate-200 font-semibold">${totalSpent.toLocaleString()}</span>
                                </div>
                                <div>
                                    <span className="text-slate-400">Presupuesto total:</span>
                                    <span className="ml-2 text-slate-200 font-semibold">${totalBudget.toLocaleString()}</span>
                                </div>
                                <div>
                                    <span className="text-slate-400">Días restantes:</span>
                                    <span className="ml-2 text-slate-200 font-semibold">{daysRemaining}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    {alerts.length > 0 && (
                        <div className="card">
                            <div className="flex items-center gap-2 mb-4">
                                <span style={{ fontSize: '1.25rem' }}>🔔</span>
                                <h2 className="text-lg font-semibold">Alertas Inteligentes</h2>
                            </div>
                            <div className="space-y-3">
                                {alerts.slice(0, 3).map((alert, idx) => (
                                    <div key={idx} className={`alert alert-${alert.type}`}>
                                        <span>⚠️</span>
                                        <span className="text-sm">{alert.message}</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                    
                    <div className="card">
                        <h2 className="text-lg font-semibold mb-4">🚀 Primeros pasos</h2>
                        <div className="space-y-3">
                            <div style={{ padding: '1rem', background: 'rgba(6, 182, 212, 0.1)', border: '1px solid rgba(6, 182, 212, 0.2)', borderRadius: '0.5rem' }}>
                                <div className="flex items-center gap-2 mb-2">
                                    <span>📈</span>
                                    <span className="font-semibold text-cyan-400">1. Establece tu presupuesto</span>
                                </div>
                                <p className="text-sm text-slate-300">Ve a "Presupuesto" y define límites mensuales para cada categoría.</p>
                            </div>
                            <div style={{ padding: '1rem', background: 'rgba(59, 130, 246, 0.1)', border: '1px solid rgba(59, 130, 246, 0.2)', borderRadius: '0.5rem' }}>
                                <div className="flex items-center gap-2 mb-2">
                                    <span>💵</span>
                                    <span className="font-semibold text-blue-400">2. Agrega transacciones</span>
                                </div>
                                <p className="text-sm text-slate-300">En "Transacciones", registra tus gastos e ingresos.</p>
                            </div>
                            <div style={{ padding: '1rem', background: 'rgba(139, 92, 246, 0.1)', border: '1px solid rgba(139, 92, 246, 0.2)', borderRadius: '0.5rem' }}>
                                <div className="flex items-center gap-2 mb-2">
                                    <span>🎯</span>
                                    <span className="font-semibold text-purple-400">3. Crea metas de ahorro</span>
                                </div>
                                <p className="text-sm text-slate-300">Define metas en la sección "Metas".</p>
                            </div>
                        </div>
                    </div>
                    
                    <div className="grid grid-cols-1 md-grid-cols-3 gap-4">
                        <div className="card">
                            <div className="text-sm text-slate-400 mb-2">Balance Neto</div>
                            <div className="text-3xl font-serif font-bold text-cyan-400">
                                ${(totalIncome - totalSpent).toLocaleString()}
                            </div>
                            <div className="text-sm text-green-300 mt-2">
                                {totalIncome > totalSpent ? '📈 Positivo' : '📉 Negativo'}
                            </div>
                        </div>
                        <div className="card">
                            <div className="text-sm text-slate-400 mb-2">Total Ingresos</div>
                            <div className="text-3xl font-serif font-bold text-cyan-400">
                                ${totalIncome.toLocaleString()}
                            </div>
                        </div>
                        <div className="card">
                            <div className="text-sm text-slate-400 mb-2">Total Gastos</div>
                            <div className="text-3xl font-serif font-bold text-cyan-400">
                                ${totalSpent.toLocaleString()}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // Transactions View
        function TransactionsView({ transactions, categories, onAdd, onDelete }) {
            const [showForm, setShowForm] = useState(false);
            const [formData, setFormData] = useState({
                description: '',
                amount: '',
                category: '',
                date: new Date().toISOString().split('T')[0]
            });
            
            const handleSubmit = (e) => {
                e.preventDefault();
                onAdd({
                    ...formData,
                    amount: parseFloat(formData.amount)
                });
                setFormData({
                    description: '',
                    amount: '',
                    category: '',
                    date: new Date().toISOString().split('T')[0]
                });
                setShowForm(false);
            };
            
            const handleDelete = (txId) => {
                if (window.confirm('¿Estás seguro de que quieres eliminar esta transacción?')) {
                    onDelete(txId);
                }
            };
            
            return (
                <div className="space-y-6">
                    <div className="flex items-center justify-between">
                        <h1 className="text-3xl font-serif font-bold">Transacciones</h1>
                        <button onClick={() => setShowForm(!showForm)} className="btn btn-primary">
                            ➕ Nueva Transacción
                        </button>
                    </div>
                    
                    {showForm && (
                        <div className="card">
                            <form onSubmit={handleSubmit} className="space-y-4">
                                <div className="grid grid-cols-1 md-grid-cols-2 gap-4">
                                    <div>
                                        <label className="text-sm text-slate-400 mb-2" style={{ display: 'block' }}>Descripción</label>
                                        <input
                                            type="text"
                                            value={formData.description}
                                            onChange={e => setFormData({ ...formData, description: e.target.value })}
                                            className="input"
                                            required
                                        />
                                    </div>
                                    <div>
                                        <label className="text-sm text-slate-400 mb-2" style={{ display: 'block' }}>Monto</label>
                                        <input
                                            type="number"
                                            step="0.01"
                                            value={formData.amount}
                                            onChange={e => setFormData({ ...formData, amount: e.target.value })}
                                            className="input"
                                            required
                                        />
                                    </div>
                                    <div>
                                        <label className="text-sm text-slate-400 mb-2" style={{ display: 'block' }}>Categoría</label>
                                        <select
                                            value={formData.category}
                                            onChange={e => setFormData({ ...formData, category: e.target.value })}
                                            className="input"
                                        >
                                            <option value="">Auto-categorizar</option>
                                            {categories.map(cat => (
                                                <option key={cat.id} value={cat.id}>
                                                    {cat.icon} {cat.name}
                                                </option>
                                            ))}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="text-sm text-slate-400 mb-2" style={{ display: 'block' }}>Fecha</label>
                                        <input
                                            type="date"
                                            value={formData.date}
                                            onChange={e => setFormData({ ...formData, date: e.target.value })}
                                            className="input"
                                            required
                                        />
                                    </div>
                                </div>
                                <div className="flex gap-3">
                                    <button type="submit" className="btn btn-primary">Agregar</button>
                                    <button type="button" onClick={() => setShowForm(false)} className="btn btn-secondary">Cancelar</button>
                                </div>
                            </form>
                        </div>
                    )}

                    <div className="card">
                        {transactions.length === 0 ? (
                            <div style={{ textAlign: 'center', padding: '3rem' }}>
                                <div style={{ fontSize: '3rem', marginBottom: '1rem' }}>📭</div>
                                <p className="text-slate-400 mb-4">No hay transacciones todavía</p>
                                <p className="text-sm text-slate-500">Agrega tu primera transacción para comenzar</p>
                            </div>
                        ) : (
                            <div style={{ overflowX: 'auto' }}>
                                <table>
                                    <thead>
                                        <tr>
                                            <th>FECHA</th>
                                            <th>DESCRIPCIÓN</th>
                                            <th>CATEGORÍA</th>
                                            <th style={{ textAlign: 'right' }}>MONTO</th>
                                            <th style={{ textAlign: 'center', width: '100px' }}>ACCIONES</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {transactions.slice(0, 50).map(tx => {
                                            const cat = categories.find(c => c.id === tx.category) || { name: tx.category, icon: '📦' };
                                            return (
                                                <tr key={tx.id}>
                                                    <td className="text-sm text-slate-300">
                                                        {new Date(tx.date).toLocaleDateString('es')}
                                                    </td>
                                                    <td className="text-sm">{tx.description}</td>
                                                    <td className="text-sm">{cat.icon} {cat.name}</td>
                                                    <td style={{ textAlign: 'right' }}>
                                                        <span className="text-xl font-serif font-semibold text-cyan-400">
                                                            ${tx.amount.toLocaleString()}
                                                        </span>
                                                    </td>
                                                    <td style={{ textAlign: 'center' }}>
                                                        <button 
                                                            onClick={() => handleDelete(tx.id)}
                                                            className="btn-secondary"
                                                            style={{ padding: '0.25rem 0.5rem', fontSize: '0.875rem' }}
                                                            title="Eliminar transacción"
                                                        >
                                                            🗑️
                                                        </button>
                                                    </td>
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // Budget View
        function BudgetView({ budgets, categories, transactions, currentMonth, onUpdate }) {
            const [editCategory, setEditCategory] = useState(null);
            const [editAmount, setEditAmount] = useState('');
            
            const thisMonthTx = transactions.filter(t => t.date.startsWith(currentMonth));
            
            const categoryStats = categories
                .filter(c => !['income', 'savings'].includes(c.id))
                .map(cat => {
                    const spent = thisMonthTx
                        .filter(t => t.category === cat.id)
                        .reduce((sum, t) => sum + t.amount, 0);
                    const budget = budgets[cat.id] || 0;
                    const percentage = budget > 0 ? (spent / budget) * 100 : 0;
                    
                    return {
                        ...cat,
                        spent: Math.round(spent),
                        budget,
                        percentage: Math.round(percentage)
                    };
                })
                .sort((a, b) => b.spent - a.spent);
            
            const handleSave = () => {
                onUpdate(editCategory, parseFloat(editAmount));
                setEditCategory(null);
                setEditAmount('');
            };
            
            return (
                <div className="space-y-6">
                    <h1 className="text-3xl font-serif font-bold">Presupuesto Mensual</h1>
                    
                    <div className="grid gap-4">
                        {categoryStats.map(cat => (
                            <div key={cat.id} className="card">
                                <div className="flex items-center justify-between mb-4" style={{ flexWrap: 'wrap', gap: '1rem' }}>
                                    <div className="flex items-center gap-3">
                                        <div style={{ fontSize: '2rem' }}>{cat.icon}</div>
                                        <div>
                                            <div className="font-semibold text-lg">{cat.name}</div>
                                            <div className="text-sm text-slate-400">
                                                {cat.budget > 0 ? `${cat.percentage}% usado` : 'Sin presupuesto'}
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <div style={{ display: 'flex', alignItems: 'center', gap: '1rem' }}>
                                        <div style={{ textAlign: 'right' }}>
                                            <div className="text-2xl font-serif font-bold text-cyan-400">
                                                ${cat.spent.toLocaleString()}
                                            </div>
                                            <div className="text-sm text-slate-400">
                                                de ${cat.budget.toLocaleString()}
                                            </div>
                                        </div>
                                        
                                        {editCategory === cat.id ? (
                                            <div className="flex gap-2">
                                                <input
                                                    type="number"
                                                    value={editAmount}
                                                    onChange={e => setEditAmount(e.target.value)}
                                                    className="input"
                                                    style={{ width: '8rem' }}
                                                    autoFocus
                                                />
                                                <button onClick={handleSave} className="btn btn-primary">✓</button>
                                            </div>
                                        ) : (
                                            <button
                                                onClick={() => {
                                                    setEditCategory(cat.id);
                                                    setEditAmount(cat.budget.toString());
                                                }}
                                                className="btn btn-secondary"
                                            >
                                                Editar
                                            </button>
                                        )}
                                    </div>
                                </div>
                                
                                {cat.budget > 0 && (
                                    <div className="progress-bar">
                                        <div
                                            className={`progress-fill ${cat.percentage > 100 ? 'danger' : cat.percentage > 80 ? 'warning' : ''}`}
                                            style={{ width: `${Math.min(cat.percentage, 100)}%` }}
                                        />
                                    </div>
                                )}
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        // Goals View
        function GoalsView({ goals, onAdd, onUpdateGoal }) {
            const [showForm, setShowForm] = useState(false);
            const [formData, setFormData] = useState({ name: '', target: '', deadline: '' });
            const [addingTo, setAddingTo] = useState(null);
            const [addAmount, setAddAmount] = useState('');
            
            const handleSubmit = (e) => {
                e.preventDefault();
                onAdd({ ...formData, target: parseFloat(formData.target) });
                setFormData({ name: '', target: '', deadline: '' });
                setShowForm(false);
            };
            
            const handleAddMoney = (goalId) => {
                if (!addAmount || parseFloat(addAmount) <= 0) return;
                onUpdateGoal(goalId, parseFloat(addAmount));
                setAddingTo(null);
                setAddAmount('');
            };
            
            return (
                <div className="space-y-6">
                    <div className="flex items-center justify-between">
                        <h1 className="text-3xl font-serif font-bold">Metas de Ahorro</h1>
                        <button onClick={() => setShowForm(!showForm)} className="btn btn-primary">
                            ➕ Nueva Meta
                        </button>
                    </div>
                    
                    {showForm && (
                        <div className="card">
                            <form onSubmit={handleSubmit} className="space-y-4">
                                <div className="grid grid-cols-1 md-grid-cols-3 gap-4">
                                    <div>
                                        <label className="text-sm text-slate-400 mb-2" style={{ display: 'block' }}>Nombre</label>
                                        <input
                                            type="text"
                                            value={formData.name}
                                            onChange={e => setFormData({ ...formData, name: e.target.value })}
                                            className="input"
                                            required
                                        />
                                    </div>
                                    <div>
                                        <label className="text-sm text-slate-400 mb-2" style={{ display: 'block' }}>Monto</label>
                                        <input
                                            type="number"
                                            value={formData.target}
                                            onChange={e => setFormData({ ...formData, target: e.target.value })}
                                            className="input"
                                            required
                                        />
                                    </div>
                                    <div>
                                        <label className="text-sm text-slate-400 mb-2" style={{ display: 'block' }}>Fecha límite</label>
                                        <input
                                            type="date"
                                            value={formData.deadline}
                                            onChange={e => setFormData({ ...formData, deadline: e.target.value })}
                                            className="input"
                                            required
                                        />
                                    </div>
                                </div>
                                <button type="submit" className="btn btn-primary">Crear Meta</button>
                            </form>
                        </div>
                    )}
                    
                    <div className="grid grid-cols-1 md-grid-cols-2 gap-6">
                        {goals.length === 0 ? (
                            <div className="card" style={{ gridColumn: '1 / -1', textAlign: 'center', padding: '3rem' }}>
                                <div style={{ fontSize: '3rem', marginBottom: '1rem' }}>🎯</div>
                                <p className="text-slate-400">No tienes metas de ahorro. ¡Crea tu primera meta!</p>
                            </div>
                        ) : (
                            goals.map(goal => {
                                const progress = (goal.progress / goal.target) * 100;
                                const isCompleted = progress >= 100;
                                return (
                                    <div key={goal.id} className="card">
                                        <div className="flex items-start justify-between mb-2">
                                            <h3 className="text-xl font-semibold">{goal.name}</h3>
                                            {isCompleted && (
                                                <span style={{ 
                                                    padding: '0.25rem 0.5rem', 
                                                    background: 'rgba(34, 197, 94, 0.2)', 
                                                    color: '#86efac',
                                                    borderRadius: '0.5rem',
                                                    fontSize: '0.75rem',
                                                    fontWeight: 600
                                                }}>
                                                    ✓ Completada
                                                </span>
                                            )}
                                        </div>
                                        <div className="mb-4">
                                            <div className="flex justify-between text-sm mb-2">
                                                <span className="text-slate-400">Progreso</span>
                                                <span className="text-cyan-400 font-semibold">{Math.round(progress)}%</span>
                                            </div>
                                            <div className="progress-bar">
                                                <div className="progress-fill" style={{ width: `${Math.min(progress, 100)}%` }} />
                                            </div>
                                        </div>
                                        <div className="flex justify-between items-end mb-4">
                                            <div>
                                                <div className="text-sm text-slate-400">Ahorrado</div>
                                                <div className="text-2xl font-serif font-bold text-cyan-400">
                                                    ${goal.progress.toLocaleString()}
                                                </div>
                                            </div>
                                            <div style={{ textAlign: 'right' }}>
                                                <div className="text-sm text-slate-400">Objetivo</div>
                                                <div className="text-lg font-semibold text-slate-300">
                                                    ${goal.target.toLocaleString()}
                                                </div>
                                            </div>
                                        </div>
                                        
                                        {addingTo === goal.id ? (
                                            <div className="flex gap-2">
                                                <input
                                                    type="number"
                                                    placeholder="Cantidad a agregar"
                                                    value={addAmount}
                                                    onChange={e => setAddAmount(e.target.value)}
                                                    className="input"
                                                    style={{ flex: 1 }}
                                                    autoFocus
                                                />
                                                <button 
                                                    onClick={() => handleAddMoney(goal.id)}
                                                    className="btn btn-primary"
                                                >
                                                    ✓
                                                </button>
                                                <button 
                                                    onClick={() => {
                                                        setAddingTo(null);
                                                        setAddAmount('');
                                                    }}
                                                    className="btn btn-secondary"
                                                >
                                                    ✕
                                                </button>
                                            </div>
                                        ) : (
                                            <button 
                                                onClick={() => setAddingTo(goal.id)}
                                                className="btn btn-primary"
                                                style={{ width: '100%' }}
                                            >
                                                💰 Agregar Dinero
                                            </button>
                                        )}
                                    </div>
                                );
                            })
                        )}
                    </div>
                </div>
            );
        }

        // Render
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<FinanceApp />);
    </script>
</body>
</html>
