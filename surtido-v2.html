<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Surtido · Compras del Hogar</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
<style>
/* ══════════════════════════════════════════
   SURTIDO v2 — Cotton Cloud
   Plus Jakarta Sans · Periwinkle & Blush
   Light/Dark · Mobile-first · Animado
══════════════════════════════════════════ */

:root {
  --bg:          #F0F2FF;
  --bg-2:        #E8ECFF;
  --surface:     #FFFFFF;
  --surface-2:   #F6F8FF;
  --surface-3:   #EEF1FF;
  --border:      #E4E8F5;
  --border-2:    #CDD3EB;
  --primary:     #7C9EFF;
  --primary-d:   #5B82FF;
  --primary-bg:  rgba(124,158,255,0.12);
  --primary-glow:rgba(124,158,255,0.28);
  --accent:      #A78BFA;
  --accent-bg:   rgba(167,139,250,0.10);
  --success:     #3DAA6B;
  --success-bg:  rgba(61,170,107,0.10);
  --danger:      #FF6B7A;
  --danger-bg:   rgba(255,107,122,0.10);
  --warn:        #FF9F43;
  --warn-bg:     rgba(255,159,67,0.10);
  --text:        #1E2235;
  --muted:       #6B7490;
  --faint:       #A8B2CC;
  --shadow:      0 2px 16px rgba(100,120,200,0.08);
  --shadow-md:   0 6px 30px rgba(100,120,200,0.14);
  --shadow-lg:   0 12px 40px rgba(100,120,200,0.18);
  --radius:      18px;
  --radius-sm:   12px;
  --radius-xs:   8px;
  --sans:        'Plus Jakarta Sans', system-ui, sans-serif;
  --ease:        cubic-bezier(0.16,1,0.3,1);
  --ease-back:   cubic-bezier(0.34,1.56,0.64,1);
  --hero-a:      #C8D8FF;
  --hero-b:      #F4C2D5;
  --hero-c:      #D4C5F8;
  --nav-h:       68px;
  color-scheme: light;
}
[data-theme="dark"] {
  --bg:          #0F1120;
  --bg-2:        #161828;
  --surface:     #1C1F35;
  --surface-2:   #232640;
  --surface-3:   #2A2E4A;
  --border:      #2E3355;
  --border-2:    #3D4370;
  --primary:     #7C9EFF;
  --primary-d:   #9DB5FF;
  --primary-bg:  rgba(124,158,255,0.15);
  --primary-glow:rgba(124,158,255,0.22);
  --accent:      #B99EFF;
  --accent-bg:   rgba(185,158,255,0.12);
  --success:     #4CC87E;
  --success-bg:  rgba(76,200,126,0.12);
  --danger:      #FF7B88;
  --danger-bg:   rgba(255,123,136,0.12);
  --warn:        #FFB347;
  --warn-bg:     rgba(255,179,71,0.12);
  --text:        #E8EAF5;
  --muted:       #8890B0;
  --faint:       #525A7A;
  --shadow:      0 2px 16px rgba(0,0,0,0.28);
  --shadow-md:   0 6px 30px rgba(0,0,0,0.38);
  --shadow-lg:   0 12px 40px rgba(0,0,0,0.45);
  --hero-a:      #1E2650;
  --hero-b:      #2D1E3A;
  --hero-c:      #1A2545;
  color-scheme: dark;
}

*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html { font-size:16px; }
body {
  font-family:var(--sans); background:var(--bg); color:var(--text);
  min-height:100svh; -webkit-font-smoothing:antialiased;
  transition:background .35s var(--ease), color .35s var(--ease);
  overflow-x:hidden;
}

/* ── HERO ── */
.hero { position:relative; overflow:hidden; padding:28px 20px 28px; }
.hero-gradient { position:absolute; inset:0; background:linear-gradient(135deg, var(--hero-a) 0%, var(--hero-b) 50%, var(--hero-c) 100%); z-index:0; }
.hero-orb { position:absolute; border-radius:50%; filter:blur(40px); pointer-events:none; z-index:1; }
.hero-orb-1 { width:180px; height:180px; background:var(--primary); top:-50px; right:-40px; opacity:.5; }
.hero-orb-2 { width:110px; height:110px; background:var(--danger); bottom:-20px; left:20px; opacity:.3; }
.hero-content { position:relative; z-index:2; }
.hero-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
.hero-brand { display:flex; align-items:center; gap:10px; }
.hero-icon {
  width:38px; height:38px; border-radius:12px;
  background:linear-gradient(135deg, var(--primary), var(--accent));
  box-shadow:0 4px 16px var(--primary-glow);
  display:flex; align-items:center; justify-content:center; font-size:18px;
  animation:iconPop .6s var(--ease-back) both;
}
.hero-name { font-size:1.3rem; font-weight:800; letter-spacing:-.5px; animation:fadeUp .5s var(--ease) .1s both; }
[data-theme="light"] .hero-name { color:#1E2235; }
[data-theme="dark"]  .hero-name { color:#E8EAF5; }
.theme-btn {
  width:36px; height:36px; border-radius:50%;
  background:rgba(255,255,255,.35); border:1.5px solid rgba(255,255,255,.5);
  cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:16px;
  transition:all .22s var(--ease-back); backdrop-filter:blur(6px);
  animation:fadeUp .5s var(--ease) .2s both;
}
[data-theme="dark"] .theme-btn { background:rgba(255,255,255,.08); border-color:rgba(255,255,255,.15); }
.theme-btn:hover { transform:scale(1.12); }
.theme-btn:active { transform:scale(0.9); }

.hero-stats { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.hero-stat {
  background:rgba(255,255,255,.55); backdrop-filter:blur(12px);
  border:1.5px solid rgba(255,255,255,.65); border-radius:var(--radius-sm);
  padding:14px 16px; animation:fadeUp .5s var(--ease) both;
}
[data-theme="dark"] .hero-stat { background:rgba(255,255,255,.07); border-color:rgba(255,255,255,.10); }
.hero-stat:nth-child(1){animation-delay:.15s}
.hero-stat:nth-child(2){animation-delay:.20s}
.hero-stat:nth-child(3){animation-delay:.25s; grid-column:span 2;}
.hero-stat-label { font-size:.67rem; font-weight:700; text-transform:uppercase; letter-spacing:.08em; margin-bottom:5px; }
[data-theme="light"] .hero-stat-label { color:rgba(30,34,53,.55); }
[data-theme="dark"]  .hero-stat-label { color:rgba(232,234,245,.55); }
.hero-stat-value { font-size:1.4rem; font-weight:800; letter-spacing:-.5px; }
[data-theme="light"] .hero-stat-value { color:#1E2235; }
[data-theme="dark"]  .hero-stat-value { color:#E8EAF5; }
.hero-stat-value.xl { font-size:1.8rem; }
.hero-stat-sub { font-size:.74rem; font-weight:600; margin-top:3px; }
.hero-stat-sub.up   { color:var(--danger); }
.hero-stat-sub.down { color:var(--success); }
.hero-stat-sub.neu  { color:var(--muted); }

/* Budget bar */
.budget-bar-wrap { margin-top:10px; }
.budget-bar-track { height:6px; border-radius:99px; background:rgba(255,255,255,.3); overflow:hidden; }
.budget-bar-fill { height:100%; border-radius:99px; transition:width .6s var(--ease); }
.budget-bar-labels { display:flex; justify-content:space-between; align-items:center; margin-top:5px; }
.budget-bar-used { font-size:.72rem; font-weight:700; }
.budget-bar-total { font-size:.7rem; font-weight:600; }
[data-theme="light"] .budget-bar-total { color:rgba(30,34,53,.55); }
[data-theme="dark"]  .budget-bar-total { color:rgba(232,234,245,.5); }

/* ── LAYOUT ── */
.container { max-width:480px; margin:0 auto; padding:18px 16px 90px; }

/* ── BOTTOM NAV ── */
.bottom-nav {
  position:fixed; bottom:0; left:0; right:0; z-index:100;
  height:var(--nav-h);
  background:var(--surface);
  border-top:1.5px solid var(--border);
  display:flex; align-items:center; justify-content:space-around;
  padding-bottom:env(safe-area-inset-bottom, 0px);
  backdrop-filter:blur(16px);
  box-shadow:0 -4px 20px rgba(100,120,200,0.08);
}
.nav-btn {
  flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;
  background:none; border:none; cursor:pointer;
  padding:8px 4px; border-radius:var(--radius-xs);
  transition:all .18s var(--ease-back);
  color:var(--faint);
}
.nav-btn.active { color:var(--primary); }
.nav-btn:active { transform:scale(0.88); }
.nav-icon { font-size:1.2rem; line-height:1; transition:transform .22s var(--ease-back); }
.nav-btn.active .nav-icon { transform:scale(1.15); }
.nav-label { font-size:.62rem; font-weight:700; text-transform:uppercase; letter-spacing:.05em; }

/* ── MONTH NAV ── */
.month-nav {
  display:flex; align-items:center;
  background:var(--surface); border:1.5px solid var(--border);
  border-radius:50px; padding:5px; box-shadow:var(--shadow);
  margin-bottom:16px; animation:fadeUp .5s var(--ease) .3s both;
}
.month-nav-btn {
  width:38px; height:38px; border-radius:50%;
  background:none; border:none; cursor:pointer; color:var(--muted); font-size:1rem;
  display:flex; align-items:center; justify-content:center;
  transition:all .18s var(--ease-back);
}
.month-nav-btn:hover { background:var(--primary-bg); color:var(--primary); transform:scale(1.1); }
.month-nav-btn:active { transform:scale(0.88); }
.month-nav-label { flex:1; text-align:center; font-size:.95rem; font-weight:700; color:var(--text); text-transform:capitalize; }

/* ── SECTION HEADER ── */
.section-hdr { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
.section-title { font-size:.82rem; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.07em; display:flex; align-items:center; gap:6px; }
.pill { display:inline-flex; align-items:center; justify-content:center; background:var(--primary-bg); color:var(--primary); font-size:.68rem; font-weight:700; padding:2px 9px; border-radius:20px; border:1px solid rgba(124,158,255,.25); }

/* ── BUTTONS ── */
.btn {
  font-family:var(--sans); font-size:.87rem; font-weight:700;
  padding:10px 20px; border-radius:50px; border:none; cursor:pointer;
  transition:all .18s var(--ease-back);
  display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
}
.btn:active { transform:scale(0.92); }
.btn-primary { background:linear-gradient(135deg, var(--primary), var(--accent)); color:#fff; box-shadow:0 4px 16px var(--primary-glow); }
.btn-primary:hover { transform:translateY(-2px); box-shadow:0 6px 22px var(--primary-glow); }
.btn-secondary { background:var(--surface); border:1.5px solid var(--border); color:var(--muted); }
.btn-secondary:hover { border-color:var(--primary); color:var(--primary); }
.btn-outline { background:var(--primary-bg); color:var(--primary); border:1.5px solid rgba(124,158,255,.3); }
.btn-soft { background:var(--danger-bg); color:var(--danger); border:1.5px solid rgba(255,107,122,.2); }
.btn-danger { background:var(--danger); color:#fff; }
.btn-success { background:var(--success); color:#fff; box-shadow:0 4px 14px rgba(61,170,107,.3); }
.btn-success:hover { transform:translateY(-2px); }
.btn-sm { font-size:.8rem; padding:7px 15px; }
.btn-xs { font-size:.75rem; padding:5px 11px; }
.btn-block { width:100%; justify-content:center; }
.btn-icon {
  width:32px; height:32px; border-radius:50%; background:none; border:none;
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  font-size:.9rem; color:var(--muted); transition:all .18s var(--ease-back);
}
.btn-icon:hover { background:var(--surface-3); color:var(--text); transform:scale(1.1); }
.btn-icon:active { transform:scale(0.88); }

/* ── CARDS ── */
.card {
  background:var(--surface); border:1.5px solid var(--border);
  border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden;
  transition:box-shadow .22s var(--ease), transform .22s var(--ease);
}
.card:hover { box-shadow:var(--shadow-md); }
.card-pad { padding:18px; }

/* ── SALIDA CARD ── */
.salida-list { display:flex; flex-direction:column; gap:10px; }
.salida-card { animation:cardIn .45s var(--ease) both; }
.salida-card:nth-child(1){animation-delay:.04s}
.salida-card:nth-child(2){animation-delay:.09s}
.salida-card:nth-child(3){animation-delay:.14s}
.salida-card:nth-child(4){animation-delay:.19s}
.salida-card:nth-child(5){animation-delay:.24s}
.salida-card:nth-child(6){animation-delay:.29s}
.salida-header { display:flex; align-items:center; justify-content:space-between; padding:16px 18px; cursor:pointer; user-select:none; }
.salida-card.open .salida-header { border-bottom:1.5px solid var(--border); }
.salida-left { display:flex; align-items:center; gap:12px; }
.salida-dot { width:10px; height:10px; border-radius:50%; background:linear-gradient(135deg,var(--primary),var(--accent)); flex-shrink:0; box-shadow:0 0 0 3px var(--primary-bg); }
.salida-meta { display:flex; flex-direction:column; gap:1px; }
.salida-store { font-size:.97rem; font-weight:700; color:var(--text); }
.salida-date { font-size:.71rem; font-weight:500; color:var(--muted); }
.salida-notes-preview { font-size:.71rem; color:var(--faint); font-style:italic; }
.salida-right { display:flex; align-items:center; gap:10px; flex-shrink:0; }
.salida-total { font-size:1.05rem; font-weight:800; color:var(--primary); }
.salida-cats { display:flex; gap:3px; }
.salida-cat-dot { font-size:.75rem; }
.chevron { color:var(--faint); font-size:.72rem; transition:transform .25s var(--ease); }
.salida-card.open .chevron { transform:rotate(180deg); }

.items-section { padding:14px 18px; animation:expandIn .25s var(--ease) both; }
.items-table { width:100%; border-collapse:collapse; margin-bottom:12px; }
.items-table th { font-size:.63rem; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--faint); text-align:left; padding:5px 6px; border-bottom:1px solid var(--border); }
.items-table th.r { text-align:right; }
.items-table td { padding:9px 6px; font-size:.88rem; font-weight:500; color:var(--muted); border-bottom:1px solid var(--border); }
.items-table tr:last-child td { border-bottom:none; }
.items-table td.num { text-align:right; font-weight:700; color:var(--text); }
.items-table td.sub-num { text-align:right; font-weight:800; color:var(--primary); }
.items-footer { display:flex; justify-content:space-between; align-items:center; padding-top:10px; border-top:1.5px solid var(--border); margin-bottom:12px; }
.items-footer-label { font-size:.7rem; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--faint); }
.items-footer-total { font-size:1.1rem; font-weight:800; color:var(--primary); }
.salida-actions-row { display:flex; gap:8px; }

/* ── ANALYSIS ── */
.analysis-section { margin-bottom:20px; animation:fadeUp .4s var(--ease) both; }
.analysis-section:nth-child(1){animation-delay:.05s}
.analysis-section:nth-child(2){animation-delay:.10s}
.analysis-section:nth-child(3){animation-delay:.15s}
.analysis-section:nth-child(4){animation-delay:.20s}
.a-title { font-size:.78rem; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin-bottom:10px; }

/* Bar chart */
.chart-svg { width:100%; display:block; }
.chart-bar-label { font-family:var(--sans); }
.chart-amount { font-family:var(--sans); }

/* Category breakdown */
.cat-row { display:flex; align-items:center; gap:10px; margin-bottom:11px; }
.cat-row:last-child { margin-bottom:0; }
.cat-emoji { font-size:1.1rem; width:26px; text-align:center; flex-shrink:0; }
.cat-info { flex:1; }
.cat-name-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:5px; }
.cat-name { font-size:.87rem; font-weight:600; color:var(--text); }
.cat-amt { font-size:.85rem; font-weight:800; }
.cat-track { height:5px; border-radius:99px; background:var(--surface-3); overflow:hidden; }
.cat-fill { height:100%; border-radius:99px; transition:width .6s var(--ease); }

/* Store comparison */
.store-row { display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--border); }
.store-row:last-child { border-bottom:none; }
.store-left { display:flex; flex-direction:column; gap:2px; }
.store-name { font-size:.92rem; font-weight:700; color:var(--text); }
.store-visits { font-size:.72rem; font-weight:500; color:var(--muted); }
.store-right { display:flex; flex-direction:column; align-items:flex-end; gap:2px; }
.store-total { font-size:.98rem; font-weight:800; color:var(--primary); }
.store-avg { font-size:.72rem; font-weight:500; color:var(--muted); }

/* Price history */
.price-search-wrap { position:relative; margin-bottom:12px; }
.price-history-list { display:flex; flex-direction:column; gap:8px; }
.price-entry { display:flex; align-items:center; justify-content:space-between; padding:10px 14px; background:var(--surface-2); border-radius:var(--radius-xs); border:1px solid var(--border); }
.price-entry-left { display:flex; flex-direction:column; gap:2px; }
.price-entry-date { font-size:.7rem; font-weight:600; color:var(--muted); }
.price-entry-store { font-size:.78rem; font-weight:500; color:var(--faint); }
.price-entry-right { display:flex; align-items:center; gap:8px; }
.price-val { font-size:.95rem; font-weight:800; color:var(--text); }
.price-trend { font-size:.75rem; font-weight:700; }
.price-trend.up   { color:var(--danger); }
.price-trend.down { color:var(--success); }
.price-search-title { font-size:.88rem; font-weight:600; color:var(--text); margin-bottom:10px; }

/* ── SHOPPING MODE ── */
.shop-add { display:flex; flex-direction:column; gap:10px; margin-bottom:20px; }
.shop-list { display:flex; flex-direction:column; gap:8px; }
.shop-item {
  display:flex; align-items:center; gap:10px;
  padding:12px 16px;
  background:var(--surface); border:1.5px solid var(--border);
  border-radius:var(--radius-sm); box-shadow:var(--shadow);
  transition:all .2s var(--ease); animation:cardIn .35s var(--ease) both;
}
.shop-item.done { opacity:.5; }
.shop-item.done .shop-name { text-decoration:line-through; color:var(--faint); }
.shop-check {
  width:24px; height:24px; border-radius:50%; flex-shrink:0;
  border:2px solid var(--border-2); background:none; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition:all .2s var(--ease-back); font-size:.7rem; color:transparent;
}
.shop-item.done .shop-check { background:var(--success); border-color:var(--success); color:#fff; }
.shop-check:active { transform:scale(0.85); }
.shop-meta { flex:1; display:flex; flex-direction:column; gap:1px; }
.shop-name { font-size:.92rem; font-weight:600; color:var(--text); }
.shop-cat  { font-size:.7rem; color:var(--muted); }
.shop-price-input {
  width:80px; padding:6px 8px; border:1.5px solid var(--border);
  border-radius:var(--radius-xs); background:var(--surface-2); color:var(--text);
  font-family:var(--sans); font-size:.85rem; font-weight:700; text-align:right; outline:none;
  transition:border-color .15s;
}
.shop-price-input:focus { border-color:var(--primary); }
.shop-price-input::placeholder { color:var(--faint); font-weight:400; }
.shop-bottom { margin-top:20px; display:flex; flex-direction:column; gap:10px; }
.shop-total-bar { display:flex; justify-content:space-between; align-items:center; padding:14px 18px; background:var(--surface); border:1.5px solid var(--border); border-radius:var(--radius-sm); }
.shop-total-label { font-size:.75rem; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); }
.shop-total-val { font-size:1.2rem; font-weight:800; color:var(--primary); }

/* ── SETTINGS ── */
.settings-section { margin-bottom:20px; animation:fadeUp .4s var(--ease) both; }
.settings-section:nth-child(1){animation-delay:.05s}
.settings-section:nth-child(2){animation-delay:.10s}
.settings-section:nth-child(3){animation-delay:.15s}
.settings-label { font-size:.78rem; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin-bottom:10px; }
.settings-row { display:flex; align-items:center; justify-content:space-between; padding:14px 0; border-bottom:1px solid var(--border); }
.settings-row:last-child { border-bottom:none; }
.settings-row-label { font-size:.92rem; font-weight:600; color:var(--text); }
.settings-row-sub { font-size:.75rem; color:var(--muted); margin-top:2px; }
.settings-budget-input { width:130px; padding:8px 12px; border:1.5px solid var(--border); border-radius:var(--radius-xs); background:var(--surface-2); color:var(--text); font-family:var(--sans); font-size:.93rem; font-weight:700; text-align:right; outline:none; transition:border-color .15s; }
.settings-budget-input:focus { border-color:var(--primary); }

/* ── FORM ── */
.form-group { margin-bottom:13px; }
.form-label { display:block; font-size:.68rem; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin-bottom:6px; }
.form-input { width:100%; padding:11px 14px; border:1.5px solid var(--border); border-radius:var(--radius-sm); background:var(--surface-2); color:var(--text); font-family:var(--sans); font-size:.93rem; font-weight:500; outline:none; transition:border-color .18s, box-shadow .18s; }
.form-input:focus { border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-bg); }
textarea.form-input { resize:vertical; min-height:64px; }
.form-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.form-divider { border:none; border-top:1.5px solid var(--border); margin:8px 0 16px; }

/* Category picker */
.cat-picker { display:flex; gap:6px; flex-wrap:wrap; }
.cat-chip {
  padding:5px 10px; border-radius:50px; border:1.5px solid var(--border);
  background:var(--surface-2); cursor:pointer; font-size:.8rem; font-weight:700;
  color:var(--muted); transition:all .18s var(--ease-back); display:flex; align-items:center; gap:4px;
}
.cat-chip:active { transform:scale(0.9); }
.cat-chip.active { border-color:currentColor; }

/* Autocomplete */
.ac-wrap { position:relative; }
.ac-dropdown {
  position:absolute; top:calc(100% + 4px); left:0; right:0; z-index:50;
  background:var(--surface); border:1.5px solid var(--border);
  border-radius:var(--radius-sm); box-shadow:var(--shadow-md);
  overflow:hidden; animation:expandIn .15s var(--ease) both;
}
.ac-item { padding:10px 14px; font-size:.87rem; font-weight:500; cursor:pointer; color:var(--text); transition:background .12s; display:flex; align-items:center; gap:8px; }
.ac-item:hover { background:var(--surface-2); }
.ac-item-freq { font-size:.68rem; color:var(--faint); margin-left:auto; }

/* Items en modal */
.items-hrow { display:grid; grid-template-columns:1fr 50px 86px 24px; gap:6px; margin-bottom:5px; }
.item-row { display:grid; grid-template-columns:1fr 50px 86px 24px; gap:6px; align-items:start; margin-bottom:8px; }
.item-row .form-input { padding:8px 10px; font-size:.85rem; }
.item-row .form-input.center { text-align:center; }
.items-add-btn { display:inline-flex; align-items:center; gap:5px; font-family:var(--sans); font-size:.83rem; font-weight:700; color:var(--primary); background:none; border:none; cursor:pointer; padding:6px 0; transition:opacity .15s; }
.items-add-btn:hover { opacity:.7; }
.modal-items-total { display:flex; justify-content:space-between; align-items:center; padding:12px 0 0; margin-top:10px; border-top:1.5px solid var(--border); }
.modal-items-total-label { font-size:.7rem; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--faint); }
.modal-items-total-val { font-size:1.1rem; font-weight:800; color:var(--primary); }

/* ── MODAL ── */
.modal-overlay { position:fixed; inset:0; background:rgba(15,17,32,.55); display:flex; align-items:flex-end; justify-content:center; z-index:200; backdrop-filter:blur(4px); animation:overlayIn .2s ease both; }
.modal-overlay.center { align-items:center; }
.modal { background:var(--surface); border-radius:var(--radius) var(--radius) 0 0; box-shadow:var(--shadow-lg); width:100%; max-width:480px; max-height:92svh; overflow-y:auto; animation:sheetIn .32s var(--ease-back) both; }
.modal.modal-sm { border-radius:var(--radius); max-height:unset; max-width:340px; margin:auto; animation:modalPopIn .3s var(--ease-back) both; }
.modal-handle { width:36px; height:4px; background:var(--border-2); border-radius:99px; margin:12px auto 4px; }
.modal-header { display:flex; align-items:center; justify-content:space-between; padding:14px 20px 12px; border-bottom:1.5px solid var(--border); }
.modal-title { font-size:1.05rem; font-weight:800; color:var(--text); }
.modal-body { padding:18px 20px; }
.modal-footer { display:flex; justify-content:flex-end; gap:10px; padding:12px 20px; border-top:1.5px solid var(--border); }

/* ── EMPTY ── */
.empty { text-align:center; padding:48px 20px; animation:fadeUp .45s var(--ease) .2s both; }
.empty-icon { font-size:2.8rem; display:block; margin-bottom:12px; animation:iconPop .6s var(--ease-back) .3s both; }
.empty-title { font-size:1.05rem; font-weight:800; color:var(--text); margin-bottom:7px; }
.empty-sub { font-size:.87rem; font-weight:500; color:var(--muted); margin-bottom:20px; line-height:1.5; }

/* ── FAB ── */
.fab { position:fixed; bottom:calc(var(--nav-h) + 14px); right:20px; z-index:50; width:54px; height:54px; border-radius:50%; background:linear-gradient(135deg, var(--primary), var(--accent)); color:#fff; font-size:1.5rem; border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; box-shadow:0 6px 24px var(--primary-glow); transition:all .22s var(--ease-back); animation:fabIn .5s var(--ease-back) .5s both; }
.fab:hover { transform:scale(1.1) translateY(-3px); }
.fab:active { transform:scale(0.92); }

/* ── TOASTS ── */
.toast-wrap { position:fixed; bottom:calc(var(--nav-h) + 12px); left:50%; transform:translateX(-50%); display:flex; flex-direction:column; gap:8px; z-index:400; width:calc(100% - 40px); max-width:320px; pointer-events:none; }
.toast { background:var(--text); color:var(--bg); padding:11px 18px; border-radius:var(--radius-sm); font-size:.87rem; font-weight:600; box-shadow:var(--shadow-lg); animation:toastIn .35s var(--ease-back) both; border-left:4px solid var(--primary); text-align:center; }
.toast.ok  { border-left-color:var(--success); }
.toast.err { border-left-color:var(--danger); }

/* ── ANIMATIONS ── */
@keyframes iconPop  { from{transform:scale(0.5);opacity:0} to{transform:scale(1);opacity:1} }
@keyframes fadeUp   { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
@keyframes cardIn   { from{opacity:0;transform:translateY(14px) scale(.97)} to{opacity:1;transform:translateY(0) scale(1)} }
@keyframes expandIn { from{opacity:0;transform:translateY(-6px)} to{opacity:1;transform:translateY(0)} }
@keyframes overlayIn{ from{opacity:0} to{opacity:1} }
@keyframes sheetIn  { from{transform:translateY(100%);opacity:.8} to{transform:translateY(0);opacity:1} }
@keyframes modalPopIn{from{transform:scale(.88) translateY(16px);opacity:0} to{transform:scale(1) translateY(0);opacity:1}}
@keyframes fabIn    { from{transform:scale(0);opacity:0} to{transform:scale(1);opacity:1} }
@keyframes toastIn  { from{opacity:0;transform:translateY(16px) scale(.92)} to{opacity:1;transform:translateY(0) scale(1)} }
@keyframes spin     { to{transform:rotate(360deg)} }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
// ════════════════════════════════════════
// CONSTANTS
// ════════════════════════════════════════
const CATS = [
  { id:'almacen',   emoji:'🥫', label:'Almacén',    color:'#FF9F43' },
  { id:'lacteos',   emoji:'🥛', label:'Lácteos',    color:'#7C9EFF' },
  { id:'carnes',    emoji:'🥩', label:'Carnes',     color:'#FF6B7A' },
  { id:'verduras',  emoji:'🥬', label:'Verduras',   color:'#3DAA6B' },
  { id:'limpieza',  emoji:'🧴', label:'Limpieza',   color:'#A78BFA' },
  { id:'bebidas',   emoji:'🧃', label:'Bebidas',    color:'#5B82FF' },
  { id:'panaderia', emoji:'🍞', label:'Panadería',  color:'#E8906A' },
  { id:'otros',     emoji:'📦', label:'Otros',      color:'#8890B0' },
];
const getCat = id => CATS.find(c => c.id === id) || CATS[7];

const MESES = ['enero','febrero','marzo','abril','mayo','junio',
               'julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MESES_S = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

// ════════════════════════════════════════
// UTILS
// ════════════════════════════════════════
const uuid      = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36);
const todayStr  = () => new Date().toISOString().split('T')[0];
const monthKey  = d => d.slice(0, 7);
const prevMth   = k => { const [y,m] = k.split('-').map(Number); return m===1?`${y-1}-12`:`${y}-${String(m-1).padStart(2,'0')}`; };
const nextMth   = k => { const [y,m] = k.split('-').map(Number); return m===12?`${y+1}-01`:`${y}-${String(m+1).padStart(2,'0')}`; };
const monthLabel= k => { const [y,m] = k.split('-'); return `${MESES[parseInt(m)-1]} ${y}`; };
const fmt       = n => '$ ' + Number(n||0).toLocaleString('es-UY', { minimumFractionDigits:0, maximumFractionDigits:2 });
const sanitizePrice = v => {
  // Permitir campo vacío o solo un punto/coma al escribir
  if (v === '' || v === '.' || v === ',') return v;
  // Reemplazar coma por punto
  let s = v.replace(',', '.');
  // Solo dígitos y un punto decimal
  s = s.replace(/[^0-9.]/g, '');
  // Si hay más de un punto, quedarse solo con el primero
  const parts = s.split('.');
  if (parts.length > 2) s = parts[0] + '.' + parts.slice(1).join('');
  // Máximo 2 decimales
  const p2 = s.split('.');
  if (p2[1] !== undefined && p2[1].length > 2) s = p2[0] + '.' + p2[1].slice(0, 2);
  return s;
};
function parseTicket(text) {
  const lineas = text.split('\n');

  const ignorar = [
    'TOTAL','SUBTOTAL','IVA','EFECTIVO','TARJETA',
    'DEBITO','CREDITO','CAMBIO','RUT','TEL',
    'CAJA','CLIENTE','FACTURA','BOLETA'
  ];

  const resultados = [];

  for (let l of lineas) {

    if (!l) continue;

    // 🔧 limpiar ruido OCR
    l = l
      .replace(/[^a-zA-Z0-9\s.,]/g, '')
      .replace(/\s+/g, ' ')
      .trim();

    if (!l) continue;

    // ❌ ignorar basura
    if (ignorar.some(p => l.toUpperCase().includes(p))) continue;

    // 🔍 detectar precio al final (UY usa coma o punto)
    const match = l.match(/(.+?)\s+(\d+[.,]\d{2}|\d+)$/);

    if (!match) continue;

    let nombre = match[1].trim();
    let precioRaw = match[2];

    const precio = parseFloat(precioRaw.replace(',', '.'));

    // ❌ validaciones fuertes
    if (!nombre || nombre.length < 2) continue;
    if (isNaN(precio) || precio <= 0) continue;

    // ❌ evitar líneas tipo "1 120"
    if (/^\d+$/.test(nombre)) continue;

    resultados.push({
      producto: nombre,
      precio: precio
    });
  }

  return resultados;
}
const fmtDate   = d => { if(!d)return''; const [y,m,day]=d.split('-'); return `${parseInt(day)} ${MESES_S[parseInt(m)-1]} ${y}`; };
const salidaTotal = s => s.items.reduce((a,i) => a+(Number(i.qty)||0)*(Number(i.price)||0), 0);

// ════════════════════════════════════════
// STORAGE
// ════════════════════════════════════════
const K = { salidas:'surtido_s_v2', budget:'surtido_b_v2', shoplist:'surtido_l_v2', theme:'surtido_theme' };
const load  = key => { try { const r=localStorage.getItem(key); return r?JSON.parse(r):null; } catch{return null;} };
const save  = (key,val) => localStorage.setItem(key, JSON.stringify(val));

// ════════════════════════════════════════
// DERIVED DATA
// ════════════════════════════════════════
function getFreqItems(salidas) {
  const map = {};
  salidas.forEach(s => s.items.forEach(i => {
    const k = i.name.toLowerCase();
    if (!map[k]) map[k] = { name:i.name, catId:i.catId||'otros', count:0 };
    map[k].count++;
  }));
  return Object.values(map).sort((a,b) => b.count - a.count);
}

function getPriceHistory(salidas) {
  const map = {};
  salidas.forEach(s => s.items.forEach(i => {
    const k = i.name.toLowerCase();
    if (!map[k]) map[k] = { name:i.name, entries:[] };
    map[k].entries.push({ date:s.date, price:Number(i.price), store:s.store });
  }));
  Object.values(map).forEach(v => v.entries.sort((a,b)=>a.date.localeCompare(b.date)));
  return map;
}

function getCatBreakdown(salidasMes) {
  const map = {};
  salidasMes.forEach(s => s.items.forEach(i => {
    const id = i.catId||'otros';
    map[id] = (map[id]||0) + (Number(i.qty)||1)*(Number(i.price)||0);
  }));
  return CATS.map(c => ({...c, total:map[c.id]||0})).filter(c=>c.total>0).sort((a,b)=>b.total-a.total);
}

function getStoreComparison(salidas) {
  const map = {};
  salidas.forEach(s => {
    if(!map[s.store]) map[s.store] = { store:s.store, total:0, count:0 };
    map[s.store].total += salidaTotal(s);
    map[s.store].count++;
  });
  return Object.values(map).map(s=>({...s,avg:Math.round(s.total/s.count)})).sort((a,b)=>b.total-a.total);
}

function getMonthlyChart(salidas) {
  const now = new Date();
  return Array.from({length:6}, (_,i) => {
    const d = new Date(now.getFullYear(), now.getMonth()-5+i, 1);
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    return {
      key,
      label: MESES_S[d.getMonth()],
      total: salidas.filter(s=>monthKey(s.date)===key).reduce((sum,s)=>sum+salidaTotal(s),0)
    };
  });
}

// ════════════════════════════════════════
// HOOKS
// ════════════════════════════════════════
const { useState, useEffect, useCallback, useRef } = React;

function useToast() {
  const [toasts, setToasts] = useState([]);
  const add = useCallback((msg, type='') => {
    const id = uuid();
    setToasts(t=>[...t, {id,msg,type}]);
    setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)), 3000);
  }, []);
  return { toasts, add };
}

function useTheme() {
  const [theme, setTheme] = useState(()=>load(K.theme)||'light');
  useEffect(()=>{ document.documentElement.setAttribute('data-theme',theme); save(K.theme,theme); }, [theme]);
  return { theme, toggle:()=>setTheme(t=>t==='light'?'dark':'light') };
}

// ════════════════════════════════════════
// SMALL COMPONENTS
// ════════════════════════════════════════
function Toasts({ toasts }) {
  return <div className="toast-wrap">{toasts.map(t=><div key={t.id} className={`toast ${t.type}`}>{t.msg}</div>)}</div>;
}

function ConfirmModal({ msg, onOk, onCancel }) {
  return (
    <div className="modal-overlay center" onClick={e=>e.target===e.currentTarget&&onCancel()}>
      <div className="modal modal-sm">
        <div className="modal-header">
          <span className="modal-title">Confirmar</span>
          <button className="btn-icon" onClick={onCancel}>✕</button>
        </div>
        <div className="modal-body">
          <p style={{color:'var(--muted)',lineHeight:1.6,fontSize:'.91rem',fontWeight:500}}>{msg}</p>
        </div>
        <div className="modal-footer">
          <button className="btn btn-secondary btn-sm" onClick={onCancel}>Cancelar</button>
          <button className="btn btn-danger btn-sm" onClick={onOk}>Eliminar</button>
        </div>
      </div>
    </div>
  );
}

function CatPicker({ value, onChange }) {
  return (
    <div className="cat-picker">
      {CATS.map(c => (
        <button key={c.id}
          className={`cat-chip ${value===c.id?'active':''}`}
          style={value===c.id?{background:c.color+'22',borderColor:c.color,color:c.color}:{}}
          onClick={()=>onChange(c.id)}>
          {c.emoji} <span style={{fontSize:'.72rem'}}>{c.label}</span>
        </button>
      ))}
    </div>
  );
}

function AutoInput({ value, onChange, suggestions, placeholder, className }) {
  const [show, setShow] = useState(false);
  const filtered = show && value.length > 0
    ? suggestions.filter(s=>s.name.toLowerCase().includes(value.toLowerCase())&&s.name!==value).slice(0,5)
    : [];
  return (
    <div className="ac-wrap">
      <input className={className||'form-input'} placeholder={placeholder} value={value}
        onChange={e=>{onChange(e.target.value,'');setShow(true);}}
        onFocus={()=>setShow(true)}
        onBlur={()=>setTimeout(()=>setShow(false),150)} />
      {filtered.length>0 && (
        <div className="ac-dropdown">
          {filtered.map(s=>(
            <div key={s.name} className="ac-item"
              onMouseDown={()=>{onChange(s.name,s.catId);setShow(false);}}>
              <span>{getCat(s.catId).emoji}</span>
              <span>{s.name}</span>
              <span className="ac-item-freq">×{s.count}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function BudgetBar({ spent, budget }) {
  if (!budget) return null;
  const pct = Math.min(100, Math.round(spent/budget*100));
  const color = pct < 70 ? '#3DAA6B' : pct < 90 ? '#FF9F43' : '#FF6B7A';
  return (
    <div className="budget-bar-wrap">
      <div className="budget-bar-track">
        <div className="budget-bar-fill" style={{width:`${pct}%`,background:color}}></div>
      </div>
      <div className="budget-bar-labels">
        <span className="budget-bar-used" style={{color}}>{pct}% del presupuesto</span>
        <span className="budget-bar-total">/ {fmt(budget)}</span>
      </div>
    </div>
  );
}

function BarChart({ data, curKey }) {
  const max = Math.max(...data.map(d=>d.total), 1);
  const W=340, H=110, padB=22, padT=20, gap=3;
  const chartH = H-padB-padT;
  const bw = W/data.length;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} className="chart-svg">
      {data.map((d,i) => {
        const h = d.total ? Math.max(4, d.total/max*chartH) : 0;
        const x = i*bw+gap;
        const y = padT+chartH-h;
        const isCur = d.key===curKey;
        return (
          <g key={d.key}>
            <rect x={x} y={padT+chartH} width={bw-gap*2} height={0} rx={4} fill="none"/>
            <rect x={x} y={y} width={bw-gap*2} height={h} rx={4}
              fill={isCur?'var(--primary)':d.total?'var(--primary-bg)':'var(--surface-3)'}
              opacity={isCur?1:.7}/>
            {d.total>0 && <text x={x+(bw-gap*2)/2} y={y-5} textAnchor="middle"
              fontSize="8" fill={isCur?'var(--primary)':'var(--faint)'}
              fontFamily="var(--sans)" fontWeight="700">
              {fmt(d.total).replace('$ ','').replace(/\.000/,'')}
            </text>}
            <text x={x+(bw-gap*2)/2} y={H-5} textAnchor="middle"
              fontSize="8.5" fill={isCur?'var(--primary)':'var(--muted)'}
              fontFamily="var(--sans)" fontWeight={isCur?'800':'600'}>
              {d.label}
            </text>
          </g>
        );
      })}
    </svg>
  );
}

// ════════════════════════════════════════
// MODAL SALIDA
// ════════════════════════════════════════
function ModalSalida({ salida, freqItems, prefillItems, onSave, onClose }) {
  const isEdit = !!salida;
const [scanning, setScanning] = useState(false);
  const [form, setForm] = useState(()=>{
    if (salida) return { date:salida.date, store:salida.store, notes:salida.notes||'', items:salida.items.map(i=>({...i,price:String(i.price)})) };
    const pi = (prefillItems||[]).map(i=>({id:uuid(),name:i.name,catId:i.catId||'otros',qty:'1',price:String(i.price||'')}));
    return { date:todayStr(), store:'', notes:'', items:pi.length?pi:[{id:uuid(),name:'',catId:'otros',qty:'1',price:''}] };
  });

async function handleScan() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';

  input.onchange = async () => {
    const file = input.files[0];
    if (!file) return;

    try {
      setScanning(true);

      const { data: { text } } = await Tesseract.recognize(file, 'spa');

      const items = parseTicket(text);

      if (items.length) {
        setForm(f => ({
          ...f,
          items: items.map(i => ({
            id: uuid(),
            name: i.producto,
            catId: 'otros',
            qty: '1',
            price: String(i.precio)
          }))
        }));
      } else {
        alert('No se pudieron detectar productos automáticamente');
      }

    } catch (e) {
      console.error(e);
      alert('Error al escanear el ticket');
    } finally {
      setScanning(false);
    }
  };

  input.click();
}

  const set  = (k,v)=>setForm(f=>({...f,[k]:v}));
  const setI = (idx,k,v)=>setForm(f=>{ const items=[...f.items]; items[idx]={...items[idx],[k]:v}; return{...f,items}; });
  const addItem = ()=>setForm(f=>({...f,items:[...f.items,{id:uuid(),name:'',catId:'otros',qty:'1',price:''}]}));
  const removeItem = idx=>setForm(f=>({...f,items:f.items.filter((_,i)=>i!==idx)}));

  const grandTotal = form.items.reduce((s,i)=>s+(Number(i.qty)||0)*(Number(i.price)||0),0);

  const handleSave = ()=>{
    if(!form.date||!form.store.trim()){alert('Completá la fecha y el local.');return;}
    const valid = form.items.filter(i=>i.name.trim()&&Number(i.price)>0);
    if(!valid.length){alert('Agregá al menos un artículo con nombre y precio.');return;}
    onSave({ id:salida?.id||uuid(), date:form.date, store:form.store.trim(), notes:form.notes.trim(),
      items:valid.map(i=>({id:i.id,name:i.name.trim(),catId:i.catId||'otros',qty:Number(i.qty)||1,price:Number(i.price)}))
    });
  };

  return (
  <>
    {scanning && (
      <div style={{
        position:'fixed',
        top:0,left:0,right:0,bottom:0,
        background:'rgba(0,0,0,0.5)',
        display:'flex',
        alignItems:'center',
        justifyContent:'center',
        color:'#fff',
        zIndex:9999
      }}>
        <div>📷 Escaneando ticket...</div>
      </div>
    )}

    <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal">
        <div className="modal-handle"></div>
        <div className="modal-header">

          <div style={{display:'flex', gap:'8px', alignItems:'center'}}>
            <span className="modal-title">{isEdit?'Editar salida':'Nueva salida'}</span>
            <button className="btn btn-secondary btn-xs" onClick={handleScan}>
              📷 Escanear
            </button>
          </div>

          <button className="btn-icon" onClick={onClose}>✕</button>
        </div>
        <div className="modal-body">
          <div className="form-row">
            <div className="form-group">
              <label className="form-label">Fecha</label>
              <input type="date" className="form-input" value={form.date} onChange={e=>set('date',e.target.value)}/>
            </div>
            <div className="form-group">
              <label className="form-label">Local</label>
              <input type="text" className="form-input" placeholder="Disco, Tienda…" value={form.store} onChange={e=>set('store',e.target.value)}/>
            </div>
          </div>
          <div className="form-group">
            <label className="form-label">Notas (opcional)</label>
            <textarea className="form-input" placeholder="Ej: había oferta en lácteos…" value={form.notes} onChange={e=>set('notes',e.target.value)}/>
          </div>
          <hr className="form-divider"/>
          <div className="items-hrow">
            <span className="form-label" style={{margin:0}}>Artículo</span>
            <span className="form-label" style={{margin:0,textAlign:'center'}}>Cant.</span>
            <span className="form-label" style={{margin:0,textAlign:'right'}}>Precio</span>
            <span></span>
          </div>
          {form.items.map((item,idx)=>(
            <div key={item.id}>
              <div className="item-row">
                <AutoInput
                  value={item.name}
                  onChange={(name,catId)=>setI(idx,'name',name)||(catId&&setI(idx,'catId',catId))}
                  suggestions={freqItems}
                  placeholder="Nombre del artículo"
                />
                <input type="number" className="form-input center" min="1" value={item.qty} onChange={e=>setI(idx,'qty',e.target.value)}/>
                <input type="text" inputMode="decimal" className="form-input" placeholder="0.00" value={item.price} onChange={e=>setI(idx,'price',sanitizePrice(e.target.value))}/>
                <button className="btn-icon" style={{color:'var(--danger)',width:'24px',height:'24px',fontSize:'.72rem'}} onClick={()=>removeItem(idx)}>✕</button>
              </div>
              <div style={{marginBottom:'10px'}}>
                <CatPicker value={item.catId} onChange={v=>setI(idx,'catId',v)}/>
              </div>
            </div>
          ))}
          <button className="items-add-btn" onClick={addItem}>＋ Agregar artículo</button>
          <div className="modal-items-total">
            <span className="modal-items-total-label">Total de la salida</span>
            <span className="modal-items-total-val">{fmt(grandTotal)}</span>
          </div>
        </div>
        <div className="modal-footer">
          <button className="btn btn-secondary btn-sm" onClick={onClose}>Cancelar</button>
          <button className="btn btn-primary btn-sm" onClick={handleSave}>{isEdit?'Guardar cambios':'Guardar salida'}</button>
        </div>
      </div>
    </div>
</>
  );
}

                <th className="r">P.unit.</th>
                <th className="r">Sub</th>

// HOME VIEW
// ════════════════════════════════════════
function HomeView({ salidas, mes, setMes, budget, onNewSalida, onEditSalida, onDeleteSalida }) {
  const salidasMes = salidas.filter(s=>monthKey(s.date)===mes).sort((a,b)=>b.date.localeCompare(a.date));
  const totalMes   = salidasMes.reduce((s,sal)=>s+salidaTotal(sal),0);
  const totalItems = salidasMes.reduce((s,sal)=>s+sal.items.length,0);
  const prevKey    = prevMth(mes);
  const totalPrev  = salidas.filter(s=>monthKey(s.date)===prevKey).reduce((s,sal)=>s+salidaTotal(sal),0);
  const diff       = totalPrev>0 ? Math.round((totalMes-totalPrev)/totalPrev*100) : null;
  const avgSalida  = salidasMes.length ? Math.round(totalMes/salidasMes.length) : 0;
  const bdg        = budget[mes];

  return (
    <>
      <div className="hero">
        <div className="hero-gradient"></div>
        <div className="hero-orb hero-orb-1"></div>
        <div className="hero-orb hero-orb-2"></div>
        <div className="hero-content">
          <div className="hero-stats">
            <div className="hero-stat">
              <div className="hero-stat-label">Gasto del mes</div>
              <div className="hero-stat-value xl">{fmt(totalMes)}</div>
              {diff!==null
                ?<div className={`hero-stat-sub ${diff>0?'up':'down'}`}>{diff>0?'▲':'▼'} {Math.abs(diff)}% vs anterior</div>
                :<div className="hero-stat-sub neu">Primer mes</div>}
              <BudgetBar spent={totalMes} budget={bdg}/>
            </div>
            <div className="hero-stat">
              <div className="hero-stat-label">Salidas</div>
              <div className="hero-stat-value">{salidasMes.length}</div>
              <div className="hero-stat-sub neu">{totalItems} artículos</div>
            </div>
            <div className="hero-stat">
              <div className="hero-stat-label">Promedio por salida · Mes anterior</div>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline'}}>
                <div className="hero-stat-value">{salidasMes.length?fmt(avgSalida):'—'}</div>
                {totalPrev>0&&<div style={{fontSize:'.8rem',fontWeight:700,color:'rgba(30,34,53,.5)'}}>{fmt(totalPrev)}</div>}
              </div>
            </div>
          </div>
        </div>
      </div>

      <div className="container">
        <div className="month-nav">
          <button className="month-nav-btn" onClick={()=>setMes(prevMth(mes))}>◀</button>
          <span className="month-nav-label">{monthLabel(mes)}</span>
          <button className="month-nav-btn" onClick={()=>setMes(nextMth(mes))}>▶</button>
        </div>

        <div className="section-hdr" style={{animation:'fadeUp .5s var(--ease) .35s both'}}>
          <span className="section-title">
            {MESES[parseInt(mes.split('-')[1])-1]}
            {salidasMes.length>0&&<span className="pill">{salidasMes.length}</span>}
          </span>
        </div>

        {salidasMes.length===0
          ? <div className="empty">
              <span className="empty-icon">🛍️</span>
              <div className="empty-title">Sin compras este mes</div>
              <div className="empty-sub">Registrá tu primera salida<br/>de {MESES[parseInt(mes.split('-')[1])-1]}.</div>
              <button className="btn btn-primary" onClick={onNewSalida}>+ Nueva salida</button>
            </div>
          : <div className="salida-list">
              {salidasMes.map(s=><SalidaCard key={s.id} salida={s} onEdit={onEditSalida} onDelete={onDeleteSalida}/>)}
            </div>
        }
      </div>

      <button className="fab" onClick={onNewSalida} title="Nueva salida">＋</button>
    </>
  );
}

// ANALYSIS VIEW

function AnalysisView({ salidas, mes }) {
  const [priceQ, setPriceQ] = useState('');
  const salidasMes = salidas.filter(s=>monthKey(s.date)===mes);
  const chart = getMonthlyChart(salidas);
  const cats  = getCatBreakdown(salidasMes);
  const stores= getStoreComparison(salidas);
  const priceH= getPriceHistory(salidas);
  const maxCat= cats[0]?.total||1;

  const priceResults = priceQ.length>1
    ? Object.values(priceH).filter(v=>v.name.toLowerCase().includes(priceQ.toLowerCase())).slice(0,3)
    : [];

  return (
    <div className="container">
      {/* Evolución mensual */}
      <div className="analysis-section">
        <div className="a-title">Evolución últimos 6 meses</div>
        <div className="card card-pad">
          <BarChart data={chart} curKey={mes}/>
        </div>
      </div>

      {/* Categorías */}
      <div className="analysis-section">
        <div className="a-title">Categorías · {MESES[parseInt(mes.split('-')[1])-1]}</div>
        <div className="card card-pad">
          {cats.length===0
            ?<div style={{color:'var(--faint)',fontSize:'.88rem',textAlign:'center',padding:'12px 0'}}>Sin datos este mes</div>
            :cats.map(c=>(
              <div key={c.id} className="cat-row">
                <span className="cat-emoji">{c.emoji}</span>
                <div className="cat-info">
                  <div className="cat-name-row">
                    <span className="cat-name">{c.label}</span>
                    <span className="cat-amt" style={{color:c.color}}>{fmt(c.total)}</span>
                  </div>
                  <div className="cat-track">
                    <div className="cat-fill" style={{width:`${c.total/maxCat*100}%`,background:c.color}}></div>
                  </div>
                </div>
              </div>
            ))
          }
        </div>
      </div>

      {/* Locales */}
      <div className="analysis-section">
        <div className="a-title">Locales (historial completo)</div>
        <div className="card card-pad">
          {stores.length===0
            ?<div style={{color:'var(--faint)',fontSize:'.88rem',textAlign:'center',padding:'12px 0'}}>Sin datos</div>
            :stores.map(s=>(
              <div key={s.store} className="store-row">
                <div className="store-left">
                  <span className="store-name">{s.store}</span>
                  <span className="store-visits">{s.count} visita{s.count!==1?'s':''}</span>
                </div>
                <div className="store-right">
                  <span className="store-total">{fmt(s.total)}</span>
                  <span className="store-avg">prom. {fmt(s.avg)}/salida</span>
                </div>
              </div>
            ))
          }
        </div>
      </div>

      {/* Historial de precios */}
      <div className="analysis-section">
        <div className="a-title">Historial de precios</div>
        <div className="card card-pad">
          <input className="form-input" placeholder="🔍 Buscar artículo…" value={priceQ}
            onChange={e=>setPriceQ(e.target.value)} style={{marginBottom:'12px'}}/>
          {priceQ.length<2&&<p style={{color:'var(--faint)',fontSize:'.82rem',textAlign:'center'}}>Escribí al menos 2 letras</p>}
          {priceQ.length>=2&&priceResults.length===0&&<p style={{color:'var(--faint)',fontSize:'.82rem',textAlign:'center'}}>Sin resultados</p>}
          {priceResults.map(item=>(
            <div key={item.name} style={{marginBottom:'14px'}}>
              <div className="price-search-title">{item.name}</div>
              <div className="price-history-list">
                {item.entries.map((e,i)=>{
                  const prev = item.entries[i-1];
                  const trend = prev ? (e.price>prev.price?'up':e.price<prev.price?'down':null) : null;
                  return (
                    <div key={i} className="price-entry">
                      <div className="price-entry-left">
                        <span className="price-entry-date">{fmtDate(e.date)}</span>
                        <span className="price-entry-store">{e.store}</span>
                      </div>
                      <div className="price-entry-right">
                        {trend&&<span className={`price-trend ${trend}`}>{trend==='up'?'▲':'▼'}</span>}
                        <span className="price-val">{fmt(e.price)}</span>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// SHOPPING VIEW
// ════════════════════════════════════════
function ShoppingView({ shoplist, setShoplist, freqItems, onSaveAsSalida, add }) {
  const [newName, setNewName] = useState('');
  const [newCat, setNewCat]   = useState('otros');

  const addItem = () => {
    if (!newName.trim()) return;
    setShoplist(l=>[...l, {id:uuid(), name:newName.trim(), catId:newCat, done:false, price:''}]);
    setNewName(''); setNewCat('otros');
  };

  const toggle  = id=>setShoplist(l=>l.map(i=>i.id===id?{...i,done:!i.done}:i));
  const setPrice= (id,p)=>setShoplist(l=>l.map(i=>i.id===id?{...i,price:p}:i));
  const remove  = id=>setShoplist(l=>l.filter(i=>i.id!==id));
  const clearDone=()=>setShoplist(l=>l.filter(i=>!i.done));

  const shopTotal = shoplist.reduce((s,i)=>s+(Number(i.price)||0),0);
  const doneCount = shoplist.filter(i=>i.done).length;

  const handleSave = () => {
    const withPrice = shoplist.filter(i=>i.done&&Number(i.price)>0);
    if (!withPrice.length) { add('Marcá artículos con precio primero','err'); return; }
    onSaveAsSalida(withPrice.map(i=>({name:i.name,catId:i.catId,price:i.price})));
  };

  const addFrequent = () => {
    const existing = new Set(shoplist.map(i=>i.name.toLowerCase()));
    const toAdd = freqItems.filter(f=>!existing.has(f.name.toLowerCase())).slice(0,5);
    if (!toAdd.length) { add('No hay artículos nuevos para sugerir'); return; }
    setShoplist(l=>[...l,...toAdd.map(f=>({id:uuid(),name:f.name,catId:f.catId,done:false,price:''}))]);
    add(`${toAdd.length} artículos sugeridos agregados ✓`,'ok');
  };

  return (
    <div className="container">
      {/* Add item */}
      <div className="card card-pad" style={{marginBottom:'16px',animation:'fadeUp .4s var(--ease) .05s both'}}>
        <div className="a-title" style={{marginBottom:'10px'}}>Agregar a la lista</div>
        <div className="shop-add">
          <AutoInput value={newName} onChange={(n,c)=>{setNewName(n);if(c)setNewCat(c);}} suggestions={freqItems} placeholder="Nombre del artículo"/>
          <CatPicker value={newCat} onChange={setNewCat}/>
          <div style={{display:'flex',gap:'8px'}}>
            <button className="btn btn-primary btn-sm" onClick={addItem} style={{flex:1,justifyContent:'center'}}>＋ Agregar</button>
            {freqItems.length>0&&<button className="btn btn-secondary btn-sm" onClick={addFrequent}>⚡ Frecuentes</button>}
          </div>
        </div>
      </div>

      {/* List */}
      {shoplist.length===0
        ?<div className="empty">
            <span className="empty-icon">📋</span>
            <div className="empty-title">Lista vacía</div>
            <div className="empty-sub">Agregá artículos antes de ir al super.</div>
          </div>
        :<>
          <div className="section-hdr" style={{animation:'fadeUp .4s var(--ease) .1s both'}}>
            <span className="section-title">Lista <span className="pill">{shoplist.length}</span></span>
            {doneCount>0&&<button className="btn btn-secondary btn-xs" onClick={clearDone}>Limpiar ✓</button>}
          </div>
          <div className="shop-list">
            {shoplist.map(item=>(
              <div key={item.id} className={`shop-item ${item.done?'done':''}`}>
                <button className="shop-check" onClick={()=>toggle(item.id)}>{item.done?'✓':''}</button>
                <div className="shop-meta">
                  <span className="shop-name">{item.name}</span>
                  <span className="shop-cat">{getCat(item.catId).emoji} {getCat(item.catId).label}</span>
                </div>
                <input className="shop-price-input" type="text" inputMode="decimal" placeholder="0.00"
                  value={item.price} onChange={e=>setPrice(item.id,sanitizePrice(e.target.value))}/>
                <button className="btn-icon" style={{color:'var(--faint)',width:'24px',height:'24px',fontSize:'.7rem'}} onClick={()=>remove(item.id)}>✕</button>
              </div>
            ))}
          </div>
          <div className="shop-bottom">
            <div className="shop-total-bar">
              <span className="shop-total-label">Total en carrito</span>
              <span className="shop-total-val">{fmt(shopTotal)}</span>
            </div>
            <button className="btn btn-success btn-block" onClick={handleSave}>
              💾 Guardar como salida ({doneCount} marcados)
            </button>
          </div>
        </>
      }
    </div>
  );
}

// SETTINGS VIEW
// ════════════════════════════════════════
function SettingsView({ mes, budget, setBudget, salidas, setSalidas, add }) {
  const [bdgInput, setBdgInput] = useState(()=>String(budget[mes]||''));

  const saveBudget = () => {
    const v = Number(bdgInput);
    if (!v||v<0) { add('Ingresá un monto válido','err'); return; }
    setBudget(b=>({...b,[mes]:v}));
    add('Presupuesto guardado ✓','ok');
  };

  const handleExport = ()=>{
    const blob=new Blob([JSON.stringify(salidas,null,2)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download=`surtido_${todayStr()}.json`; a.click();
    add('Backup exportado ✓','ok');
  };

  const handleImport = ()=>{
    const input=document.createElement('input'); input.type='file'; input.accept='.json';
    input.onchange=e=>{
      const file=e.target.files[0]; if(!file)return;
      const r=new FileReader();
      r.onload=ev=>{
        try { const d=JSON.parse(ev.target.result); if(!Array.isArray(d))throw new Error(); setSalidas(d); add(`${d.length} registros importados ✓`,'ok'); }
        catch { add('Archivo inválido','err'); }
      }; r.readAsText(file);
    }; input.click();
  };

  const handleClear = ()=>{ if(window.confirm('¿Borrar TODOS los datos? Esta acción no se puede deshacer.')) { setSalidas([]); add('Datos eliminados'); } };

  return (
    <div className="container">
      {/* Presupuesto */}
      <div className="settings-section">
        <div className="settings-label">Presupuesto mensual</div>
        <div className="card card-pad">
          <div className="settings-row">
            <div>
              <div className="settings-row-label">{monthLabel(mes)}</div>
              <div className="settings-row-sub">Cuánto querés gastar este mes</div>
            </div>
            <div style={{display:'flex',gap:'8px',alignItems:'center'}}>
              <input className="settings-budget-input" type="number" min="0" placeholder="0"
                value={bdgInput} onChange={e=>setBdgInput(e.target.value)}/>
              <button className="btn btn-primary btn-xs" onClick={saveBudget}>OK</button>
            </div>
          </div>
        </div>
      </div>

      {/* Datos */}
      <div className="settings-section">
        <div className="settings-label">Datos</div>
        <div className="card card-pad">
          <div className="settings-row">
            <div>
              <div className="settings-row-label">Exportar backup</div>
              <div className="settings-row-sub">Descargá un JSON con todos tus datos</div>
            </div>
            <button className="btn btn-secondary btn-xs" onClick={handleExport}>⬇ Exportar</button>
          </div>
          <div className="settings-row">
            <div>
              <div className="settings-row-label">Importar backup</div>
              <div className="settings-row-sub">Restaurar datos desde un JSON</div>
            </div>
            <button className="btn btn-secondary btn-xs" onClick={handleImport}>⬆ Importar</button>
          </div>
          <div className="settings-row">
            <div>
              <div className="settings-row-label">Borrar todo</div>
              <div className="settings-row-sub" style={{color:'var(--danger)'}}>Elimina todos los registros</div>
            </div>
            <button className="btn btn-soft btn-xs" onClick={handleClear}>Borrar</button>
          </div>
        </div>
      </div>

      {/* Info */}
      <div className="settings-section">
        <div className="card card-pad">
          <div style={{textAlign:'center'}}>
            <div style={{fontSize:'1.6rem',marginBottom:'8px'}}>🛒</div>
            <div style={{fontSize:'.88rem',fontWeight:700,color:'var(--text)',marginBottom:'4px'}}>Surtido v2</div>
            <div style={{fontSize:'.78rem',color:'var(--muted)'}}>Compras del hogar · Cotton Cloud</div>
            <div style={{fontSize:'.75rem',color:'var(--faint)',marginTop:'6px'}}>{salidas.length} registros en total</div>
          </div>
        </div>
      </div>
    </div>
  );
}

// ════════════════════════════════════════
// APP
// ════════════════════════════════════════
function App() {
  const [salidas,  setSalidas]  = useState(()=>load(K.salidas)||[]);
  const [budget,   setBudget]   = useState(()=>load(K.budget)||{});
  const [shoplist, setShoplist] = useState(()=>load(K.shoplist)||[]);
  const [mes,      setMes]      = useState(()=>monthKey(todayStr()));
  const [tab,      setTab]      = useState('home');
  const [modal,    setModal]    = useState(null); // null|{t:'new'}|{t:'edit',s}|{t:'shop',items}
  const [confirm,  setConfirm]  = useState(null);
  const { toasts, add }         = useToast();
  const { theme, toggle }       = useTheme();
  const freqItems                = React.useMemo(()=>getFreqItems(salidas),[salidas]);

  useEffect(()=>save(K.salidas,salidas),  [salidas]);
  useEffect(()=>save(K.budget,budget),    [budget]);
  useEffect(()=>save(K.shoplist,shoplist),[shoplist]);

  const handleSave = (salida)=>{
    setSalidas(prev=>prev.some(s=>s.id===salida.id)?prev.map(s=>s.id===salida.id?salida:s):[...prev,salida]);
    setModal(null);
    if (modal?.t==='shop') { setShoplist(l=>l.filter(i=>!i.done)); }
    add('Salida guardada ✓','ok');
  };

  const handleDelete = id=>{ setSalidas(p=>p.filter(s=>s.id!==id)); setConfirm(null); add('Salida eliminada'); };

  const TABS = [
    { id:'home',     icon:'🏠', label:'Inicio' },
    { id:'analysis', icon:'📊', label:'Análisis' },
    { id:'shopping', icon:'🛒', label:'Comprando' },
    { id:'settings', icon:'⚙️', label:'Ajustes' },
  ];

  return (
    <>
      {/* Theme toggle solo visible en tabs que no tienen hero */}
      {tab!=='home'&&(
        <div style={{position:'sticky',top:0,zIndex:50,background:'var(--surface)',borderBottom:'1.5px solid var(--border)',padding:'12px 20px',display:'flex',alignItems:'center',justifyContent:'space-between',boxShadow:'var(--shadow)'}}>
          <div style={{display:'flex',alignItems:'center',gap:'10px'}}>
            <div style={{width:'30px',height:'30px',borderRadius:'9px',background:'linear-gradient(135deg,var(--primary),var(--accent))',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'14px',boxShadow:'0 3px 10px var(--primary-glow)'}}>🛒</div>
            <span style={{fontWeight:800,fontSize:'1.05rem',letterSpacing:'-.3px'}}>
              {tab==='analysis'?'Análisis':tab==='shopping'?'Comprando':'Ajustes'}
            </span>
          </div>
          <button className="theme-btn" style={{background:'var(--surface-2)',border:'1.5px solid var(--border)',backdropFilter:'none'}} onClick={toggle}>
            {theme==='light'?'🌙':'☀️'}
          </button>
        </div>
      )}

      {/* Theme toggle en home (en el hero) */}
      {tab==='home'&&(
        <div style={{position:'absolute',top:'28px',right:'20px',zIndex:10}}>
          <button className="theme-btn" onClick={toggle}>{theme==='light'?'🌙':'☀️'}</button>
        </div>
      )}

      {tab==='home'&&(
        <HomeView
          salidas={salidas} mes={mes} setMes={setMes} budget={budget}
          onNewSalida={()=>setModal({t:'new'})}
          onEditSalida={s=>setModal({t:'edit',s})}
          onDeleteSalida={id=>setConfirm(id)}
        />
      )}
      {tab==='analysis'&&<AnalysisView salidas={salidas} mes={mes}/>}
      {tab==='shopping'&&(
        <ShoppingView
          shoplist={shoplist} setShoplist={setShoplist} freqItems={freqItems}
          onSaveAsSalida={items=>setModal({t:'shop',items})} add={add}
        />
      )}
      {tab==='settings'&&(
        <SettingsView
          mes={mes} budget={budget} setBudget={setBudget}
          salidas={salidas} setSalidas={setSalidas} add={add}
        />
      )}

      {/* Modales */}
      {(modal?.t==='new'||modal?.t==='edit')&&(
        <ModalSalida
          salida={modal.t==='edit'?modal.s:null}
          freqItems={freqItems}
          onSave={handleSave}
          onClose={()=>setModal(null)}
        />
      )}
      {modal?.t==='shop'&&(
        <ModalSalida
          salida={null}
          freqItems={freqItems}
          prefillItems={modal.items}
          onSave={handleSave}
          onClose={()=>setModal(null)}
        />
      )}
      {confirm&&(
        <ConfirmModal
          msg="¿Eliminar esta salida y todos sus artículos? Esta acción no se puede deshacer."
          onOk={()=>handleDelete(confirm)}
          onCancel={()=>setConfirm(null)}
        />
      )}

      {/* Bottom nav */}
      <nav className="bottom-nav">
        {TABS.map(t=>(
          <button key={t.id} className={`nav-btn ${tab===t.id?'active':''}`} onClick={()=>setTab(t.id)}>
            <span className="nav-icon">{t.icon}</span>
            <span className="nav-label">{t.label}</span>
          </button>
        ))}
      </nav>

      <Toasts toasts={toasts}/>
    </>
  );
}

ReactDOM.render(<App/>, document.getElementById('root'));
</script>
</body>
</html>
