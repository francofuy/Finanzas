<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useMemo } = React;

// ── STORAGE ──────────────────────────────────────────────────────────
const storage = {
    get(key) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; } catch(e) { return null; } },
    set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); return true; } catch(e) { return false; } },
    list(prefix) { try { const k = []; for (let i = 0; i < localStorage.length; i++) { const key = localStorage.key(i); if (key.startsWith(prefix)) k.push(key); } return k; } catch(e) { return []; } }
};

// ── ML CATEGORIZER ────────────────────────────────────────────────────
class MLCategorizer {
    constructor() { this.patterns = {}; this.history = []; }
    train(transaction, category) {
        const key = this.extractFeatures(transaction);
        if (!this.patterns[key]) this.patterns[key] = {};
        this.patterns[key][category] = (this.patterns[key][category] || 0) + 1;
        this.history.push({ transaction, category, timestamp: Date.now() });
        if (this.history.length > 1000) this.history = this.history.slice(-1000);
        storage.set('ml-model', { patterns: this.patterns, history: this.history.slice(-100) });
    }
    extractFeatures(transaction) {
        const desc = transaction.description.toLowerCase();
        const words = desc.split(/\s+/).filter(w => w.length > 3);
        const amount = Math.round(transaction.amount / 10) * 10;
        const day = new Date(transaction.date).getDay();
        return `${words.slice(0, 2).join('_')}_${amount}_${day}`;
    }
    predict(transaction) {
        const key = this.extractFeatures(transaction);
        const matches = this.patterns[key];
        if (!matches) {
            const desc = transaction.description.toLowerCase();
            for (const hist of this.history.slice(-50)) {
                if (hist.transaction.description.toLowerCase().includes(desc.slice(0, 5))) return { category: hist.category, confidence: 0.6 };
            }
            return { category: 'other', confidence: 0.0 };
        }
        const total = Object.values(matches).reduce((a, b) => a + b, 0);
        const best = Object.entries(matches).sort((a, b) => b[1] - a[1])[0];
        return { category: best[0], confidence: best[1] / total };
    }
    load() { const m = storage.get('ml-model'); if (m) { this.patterns = m.patterns || {}; this.history = m.history || []; } }
}

// ── PREDICTION ENGINE ─────────────────────────────────────────────────
class PredictionEngine {
    constructor(transactions) { this.transactions = transactions; }
    generateAlerts(budgets, currentMonth) {
        const alerts = [];
        const now = new Date();
        const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
        const progressPct = now.getDate() / daysInMonth;
        Object.entries(budgets).forEach(([category, limit]) => {
            const spent = this.transactions.filter(t => t.category === category && t.date.startsWith(currentMonth)).reduce((s, t) => s + t.amount, 0);
            const spentPct = spent / limit;
            if (spentPct > 1.0) alerts.push({ type: 'danger', category, message: `Excediste el presupuesto de ${category} en $${Math.round(spent - limit).toLocaleString()}`, severity: 'high' });
            else if (spentPct > 0.9) alerts.push({ type: 'warning', category, message: `Al ${Math.round(spentPct * 100)}% del presupuesto de ${category}`, severity: 'medium' });
            else if (spentPct > progressPct + 0.15) alerts.push({ type: 'info', category, message: `Vas ${Math.round((spentPct - progressPct) * 100)}% por encima del ritmo en ${category}`, severity: 'low' });
        });
        return alerts.sort((a, b) => ({ high: 3, medium: 2, low: 1 }[b.severity] - { high: 3, medium: 2, low: 1 }[a.severity]));
    }
}

// ── HELPERS ───────────────────────────────────────────────────────────
const fmt = (n) => Math.round(n || 0).toLocaleString('es-AR');
const fmtDec = (n) => (n || 0).toFixed(1);

function calcMonthlyIncome(incomes, monthNum) {
    return incomes.reduce((sum, inc) => {
        const amt = inc.amount || 0;
        if (inc.frequency === 'monthly') return sum + amt;
        if (inc.frequency === 'annual') return sum + amt / 12;
        if (inc.frequency === 'biannual') { const sm = inc.seasonalMonths || [6, 12]; return sm.includes(monthNum) ? sum + amt : sum; }
        return sum;
    }, 0);
}

function calcMonthlyFixed(fixedExpenses) {
    return fixedExpenses.reduce((sum, exp) => {
        const amt = exp.amount || 0;
        if (exp.frequency === 'monthly') return sum + amt;
        if (exp.frequency === 'annual') return sum + amt / 12;
        return sum;
    }, 0);
}

function calcPayoffMonths(balance, payment, annualRate) {
    if (!balance || !payment || payment <= 0) return null;
    if (!annualRate || annualRate === 0) return Math.ceil(balance / payment);
    const r = annualRate / 100 / 12;
    const interest = r * balance;
    if (payment <= interest) return Infinity;
    return Math.ceil(-Math.log(1 - (r * balance) / payment) / Math.log(1 + r));
}

const MONTHS_SHORT = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const NEEDS_CATS = ['food', 'housing', 'utilities', 'health', 'transport'];
const WANTS_CATS = ['entertainment', 'shopping', 'other'];

// ── MAIN APP ──────────────────────────────────────────────────────────
function FinanceApp() {
    const [view, setView] = useState('dashboard');
    const [transactions, setTransactions] = useState([]);
    const [categories, setCategories] = useState([]);
    const [budgets, setBudgets] = useState({});
    const [goals, setGoals] = useState([]);
    const [mlCategorizer] = useState(() => new MLCategorizer());
    const [loading, setLoading] = useState(true);
    const [incomes, setIncomes] = useState([]);
    const [fixedExpenses, setFixedExpenses] = useState([]);
    const [debts, setDebts] = useState([]);
    const [emergencyFund, setEmergencyFund] = useState({ housing: 0, utilities: 0, food: 0, transport: 0, health: 0, other: 0, targetMonths: 6, currentBalance: 0, monthlyDeposit: 0 });

    const currentMonth = useMemo(() => { const n = new Date(); return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}`; }, []);

    useEffect(() => {
        setLoading(true);
        let cats = storage.get('categories');
        if (!cats) {
            cats = [
                { id: 'food', name: 'Alimentación', icon: '🍔', color: '#10b981' },
                { id: 'transport', name: 'Transporte', icon: '🚗', color: '#3b82f6' },
                { id: 'housing', name: 'Vivienda', icon: '🏠', color: '#8b5cf6' },
                { id: 'entertainment', name: 'Entretenimiento', icon: '🎬', color: '#f59e0b' },
                { id: 'shopping', name: 'Compras', icon: '🛍️', color: '#ec4899' },
                { id: 'health', name: 'Salud', icon: '⚕️', color: '#06b6d4' },
                { id: 'utilities', name: 'Servicios', icon: '⚡', color: '#6366f1' },
                { id: 'income', name: 'Ingresos', icon: '💰', color: '#22c55e' },
                { id: 'savings', name: 'Ahorros', icon: '🏦', color: '#14b8a6' },
                { id: 'other', name: 'Otros', icon: '📦', color: '#64748b' }
            ];
            storage.set('categories', cats);
        }
        setCategories(cats);
        const txKeys = storage.list('transactions:');
        const allTx = [];
        for (const key of txKeys) { const m = storage.get(key); if (m) allTx.push(...m); }
        setTransactions(allTx.sort((a,b) => new Date(b.date)-new Date(a.date)));
        setBudgets(storage.get(`budgets:${currentMonth}`) || {});
        setGoals(storage.get('goals') || []);
        mlCategorizer.load();
        setIncomes(storage.get('incomes') || []);
        setFixedExpenses(storage.get('fixed-expenses') || []);
        setDebts(storage.get('debts') || []);
        setEmergencyFund(storage.get('emergency-fund') || { housing:0, utilities:0, food:0, transport:0, health:0, other:0, targetMonths:6, currentBalance:0, monthlyDeposit:0 });
        setLoading(false);
    }, [currentMonth, mlCategorizer]);

    const addTransaction = (transaction) => {
        const newTx = { id: Date.now().toString(), date: new Date().toISOString().split('T')[0], ...transaction };
        if (!newTx.category || newTx.category === 'Sin categorizar') {
            const pred = mlCategorizer.predict(newTx);
            newTx.category = pred.confidence > 0.5 ? pred.category : 'other';
            if (pred.confidence > 0.5) newTx.autoCategorized = true;
        }
        const updated = [newTx, ...transactions];
        setTransactions(updated);
        const month = newTx.date.substring(0, 7);
        storage.set(`transactions:${month}`, updated.filter(t => t.date.startsWith(month)));
        if (newTx.category !== 'Sin categorizar') mlCategorizer.train(newTx, newTx.category);
    };

    const deleteTransaction = (txId) => {
        const tx = transactions.find(t => t.id === txId);
        if (!tx) return;
        const updated = transactions.filter(t => t.id !== txId);
        setTransactions(updated);
        storage.set(`transactions:${tx.date.substring(0,7)}`, updated.filter(t => t.date.startsWith(tx.date.substring(0,7))));
    };

    const updateBudget = (category, amount) => { const u = {...budgets,[category]:amount}; setBudgets(u); storage.set(`budgets:${currentMonth}`,u); };
    const addGoal = (goal) => { const u = [...goals,{id:Date.now().toString(),...goal,progress:0}]; setGoals(u); storage.set('goals',u); };
    const updateGoal = (goalId, amount) => { const u = goals.map(g => g.id===goalId ? {...g,progress:g.progress+amount} : g); setGoals(u); storage.set('goals',u); };

    const saveIncomes = (u) => { setIncomes(u); storage.set('incomes', u); };
    const saveFixed = (u) => { setFixedExpenses(u); storage.set('fixed-expenses', u); };
    const saveDebts = (u) => { setDebts(u); storage.set('debts', u); };
    const saveEF = (u) => { setEmergencyFund(u); storage.set('emergency-fund', u); };

    const exportJSON = () => {
        const data = { transactions, categories, budgets, goals, incomes, fixedExpenses, debts, emergencyFund, exportDate: new Date().toISOString() };
        const blob = new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href=url; a.download=`finanzas-${currentMonth}.json`; a.click();
    };

    const exportXLSX = () => {
        if (typeof XLSX === 'undefined') { alert('Librería Excel no disponible. Verificá tu conexión.'); return; }
        const wb = XLSX.utils.book_new();
        const cats = categories;

        // Transacciones
        const txRows = transactions.length ? transactions.map(t => ({
            'Fecha': t.date, 'Descripción': t.description,
            'Categoría': cats.find(c=>c.id===t.category)?.name || t.category,
            'Monto ($)': t.amount
        })) : [{'Info':'Sin transacciones'}];
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(txRows), 'Transacciones');

        // Ingresos
        const incRows = incomes.length ? incomes.map(i => ({
            'Fuente': i.name, 'Monto ($)': i.amount,
            'Frecuencia': i.frequency==='monthly'?'Mensual':i.frequency==='biannual'?'Semestral':'Anual',
            'Tipo': i.type==='fixed'?'Fijo':'Variable',
            'Equiv. Mensual ($)': i.frequency==='monthly'?i.amount:i.frequency==='annual'?i.amount/12:i.amount/6,
            'Notas': i.notes||''
        })) : [{'Info':'Sin ingresos'}];
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(incRows), 'Ingresos');

        // Gastos Fijos
        const fixRows = fixedExpenses.length ? fixedExpenses.map(e => ({
            'Concepto': e.name, 'Categoría': e.category,
            'Monto ($)': e.amount, 'Frecuencia': e.frequency==='monthly'?'Mensual':'Anual',
            'Mensual Prorrateo ($)': e.frequency==='monthly'?e.amount:e.amount/12,
            'Notas': e.notes||''
        })) : [{'Info':'Sin gastos fijos'}];
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(fixRows), 'Gastos Fijos');

        // Flujo Mensual
        const year = new Date().getFullYear();
        const monthlyFixed = calcMonthlyFixed(fixedExpenses);
        const totalBudget = Object.values(budgets).reduce((s,b)=>s+b,0);
        let cumBal = 0;
        const flowRows = Array.from({length:12},(_,i)=>{
            const mn = i+1;
            const ms = `${year}-${String(mn).padStart(2,'0')}`;
            const inc = incomes.length>0?calcMonthlyIncome(incomes,mn):transactions.filter(t=>t.date.startsWith(ms)&&t.category==='income').reduce((s,t)=>s+t.amount,0);
            const vari = transactions.filter(t=>t.date.startsWith(ms)&&!['income','savings'].includes(t.category)).reduce((s,t)=>s+t.amount,0)||totalBudget;
            const sav = transactions.filter(t=>t.date.startsWith(ms)&&t.category==='savings').reduce((s,t)=>s+t.amount,0);
            const bal = inc - monthlyFixed - vari - sav;
            cumBal += bal;
            return { 'Mes':MONTHS_SHORT[i], 'Ingresos ($)':Math.round(inc), 'Gastos Fijos ($)':Math.round(monthlyFixed), 'Gastos Variables ($)':Math.round(vari), 'Ahorro ($)':Math.round(sav), 'Saldo Libre ($)':Math.round(bal), 'Balance Acumulado ($)':Math.round(cumBal) };
        });
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(flowRows), 'Flujo Mensual');

        // Deudas
        const debtRows = debts.length ? debts.map(d => ({
            'Deuda': d.name, 'Tipo': d.type, 'Saldo ($)': d.balance,
            'Cuota Mensual ($)': d.payment, 'Tasa Anual (%)': d.rate,
            'Meses para cancelar': calcPayoffMonths(d.balance,d.payment,d.rate)||'-',
            'Notas': d.notes||''
        })) : [{'Info':'Sin deudas'}];
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(debtRows), 'Deudas');

        // Metas
        const goalRows = goals.length ? goals.map(g => ({
            'Meta': g.name, 'Objetivo ($)': g.target, 'Progreso ($)': g.progress,
            '% Completado': `${Math.round((g.progress/g.target)*100)}%`, 'Fecha Límite': g.deadline
        })) : [{'Info':'Sin metas'}];
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(goalRows), 'Metas');

        // Fondo Emergencia
        const efTotal = (emergencyFund.housing||0)+(emergencyFund.utilities||0)+(emergencyFund.food||0)+(emergencyFund.transport||0)+(emergencyFund.health||0)+(emergencyFund.other||0);
        const efMeta = efTotal*(emergencyFund.targetMonths||6);
        const efRows = [
            {'Concepto':'Vivienda (mensual)','Monto ($)':emergencyFund.housing||0},
            {'Concepto':'Servicios (mensual)','Monto ($)':emergencyFund.utilities||0},
            {'Concepto':'Alimentación (mensual)','Monto ($)':emergencyFund.food||0},
            {'Concepto':'Transporte (mensual)','Monto ($)':emergencyFund.transport||0},
            {'Concepto':'Salud (mensual)','Monto ($)':emergencyFund.health||0},
            {'Concepto':'Otros esenciales (mensual)','Monto ($)':emergencyFund.other||0},
            {'Concepto':'TOTAL ESENCIALES MENSUALES','Monto ($)':efTotal},
            {'Concepto':'Meses de cobertura objetivo','Monto ($)':emergencyFund.targetMonths||6},
            {'Concepto':'META DEL FONDO ($)','Monto ($)':efMeta},
            {'Concepto':'Saldo actual ($)','Monto ($)':emergencyFund.currentBalance||0},
            {'Concepto':'% completado','Monto ($)':efMeta>0?`${((emergencyFund.currentBalance||0)/efMeta*100).toFixed(1)}%`:'0%'},
        ];
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(efRows), 'Fondo Emergencia');

        XLSX.writeFile(wb, `finanzas-pro-${currentMonth}.xlsx`);
    };

    if (loading) return (
        <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center'}}>
            <div className="text-2xl font-serif text-cyan-400">Cargando finanzas...</div>
        </div>
    );

    return (
        <div>
            <Header view={view} setView={setView} onExportJSON={exportJSON} onExportXLSX={exportXLSX} />
            <main className="container py-8">
                {view==='dashboard' && <Dashboard transactions={transactions} categories={categories} budgets={budgets} currentMonth={currentMonth} incomes={incomes} fixedExpenses={fixedExpenses} debts={debts} goals={goals} />}
                {view==='transactions' && <TransactionsView transactions={transactions} categories={categories} onAdd={addTransaction} onDelete={deleteTransaction} />}
                {view==='budget' && <BudgetView budgets={budgets} categories={categories} transactions={transactions} currentMonth={currentMonth} onUpdate={updateBudget} />}
                {view==='goals' && <GoalsView goals={goals} onAdd={addGoal} onUpdateGoal={updateGoal} />}
                {view==='incomes' && <IncomesView incomes={incomes} onSave={saveIncomes} />}
                {view==='fixed-expenses' && <FixedExpensesView fixedExpenses={fixedExpenses} onSave={saveFixed} />}
                {view==='cashflow' && <CashFlowView incomes={incomes} fixedExpenses={fixedExpenses} transactions={transactions} budgets={budgets} currentMonth={currentMonth} />}
                {view==='debts' && <DebtsView debts={debts} onSave={saveDebts} />}
                {view==='emergency' && <EmergencyFundView fund={emergencyFund} onSave={saveEF} />}
            </main>
        </div>
    );
}

// ── DASHBOARD ─────────────────────────────────────────────────────────
function Dashboard({ transactions, categories, budgets, currentMonth, incomes, fixedExpenses, debts, goals }) {
    const predictor = useMemo(() => new PredictionEngine(transactions), [transactions]);
    const now = new Date();
    const currentMonthNum = now.getMonth() + 1;
    const thisMonthTx = transactions.filter(t => t.date.startsWith(currentMonth));
    const totalSpent = thisMonthTx.filter(t => !['income','savings'].includes(t.category)).reduce((s,t)=>s+t.amount,0);
    const totalIncomeTx = thisMonthTx.filter(t=>t.category==='income').reduce((s,t)=>s+t.amount,0);
    const totalBudget = Object.values(budgets).reduce((s,b)=>s+b,0);
    const daysInMonth = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
    const daysRemaining = daysInMonth - now.getDate();
    const budgetRemaining = totalBudget - totalSpent;
    const canSpendToday = daysRemaining > 0 ? Math.round(budgetRemaining / daysRemaining) : 0;
    const alerts = predictor.generateAlerts(budgets, currentMonth);

    // 50/30/20
    const totalIncome = incomes.length > 0 ? calcMonthlyIncome(incomes, currentMonthNum) : totalIncomeTx;
    const monthlyFixed = calcMonthlyFixed(fixedExpenses);
    const needsAmt = thisMonthTx.filter(t=>NEEDS_CATS.includes(t.category)).reduce((s,t)=>s+t.amount,0) + monthlyFixed;
    const wantsAmt = thisMonthTx.filter(t=>WANTS_CATS.includes(t.category)).reduce((s,t)=>s+t.amount,0);
    const savingsAmt = thisMonthTx.filter(t=>t.category==='savings').reduce((s,t)=>s+t.amount,0) + debts.reduce((s,d)=>s+(d.payment||0),0);
    const needsPct = totalIncome > 0 ? (needsAmt/totalIncome)*100 : 0;
    const wantsPct = totalIncome > 0 ? (wantsAmt/totalIncome)*100 : 0;
    const savingsPct = totalIncome > 0 ? (savingsAmt/totalIncome)*100 : 0;

    const ruleBar = (label, pct, target, color, trackColor) => {
        const over = pct > target;
        const fillColor = over ? '#ef4444' : pct > target*0.85 ? '#f59e0b' : color;
        return (
            <div style={{marginBottom:'0.875rem'}}>
                <div style={{display:'flex',justifyContent:'space-between',marginBottom:'0.375rem'}}>
                    <span className="text-sm font-medium">{label}</span>
                    <div style={{display:'flex',gap:'0.75rem',alignItems:'center'}}>
                        <span style={{fontSize:'0.75rem',color:'#64748b'}}>Objetivo: {target}%</span>
                        <span style={{fontSize:'0.875rem',fontWeight:700,color: over?'#fca5a5':fillColor}}>{fmtDec(pct)}%</span>
                    </div>
                </div>
                <div className="rule-bar-track">
                    <div className="rule-bar-fill" style={{width:`${Math.min(pct,100)}%`,background:fillColor}}>
                        {pct >= 8 && `${Math.round(pct)}%`}
                    </div>
                    <div style={{position:'absolute',top:0,bottom:0,left:`${target}%`,width:'2px',background:'rgba(255,255,255,0.3)'}} />
                </div>
            </div>
        );
    };

    const totalDebt = debts.reduce((s,d)=>s+(d.balance||0),0);
    const monthlyDebtPayment = debts.reduce((s,d)=>s+(d.payment||0),0);

    return (
        <div className="space-y-6">
            <div className="hero-card">
                <div style={{position:'relative',zIndex:1}}>
                    <div style={{display:'flex',alignItems:'center',gap:'0.5rem',marginBottom:'0.5rem'}}>
                        <span style={{fontSize:'1.25rem'}}>⚡</span>
                        <span className="text-sm text-cyan-400 font-medium">Podés gastar hoy</span>
                    </div>
                    <div className="text-6xl font-serif font-bold gradient-text">${fmt(canSpendToday)}</div>
                    <div style={{marginTop:'1rem',display:'flex',gap:'1.5rem',flexWrap:'wrap'}} className="text-sm">
                        <div><span className="text-slate-400">Gastado este mes:</span><span className="ml-2 text-slate-200 font-semibold">${fmt(totalSpent)}</span></div>
                        <div><span className="text-slate-400">Presupuesto total:</span><span className="ml-2 text-slate-200 font-semibold">${fmt(totalBudget)}</span></div>
                        <div><span className="text-slate-400">Días restantes:</span><span className="ml-2 text-slate-200 font-semibold">{daysRemaining}</span></div>
                        {totalIncome > 0 && <div><span className="text-slate-400">Ingreso mensual:</span><span className="ml-2 text-green-300 font-semibold">${fmt(totalIncome)}</span></div>}
                    </div>
                </div>
            </div>

            {/* KPI Cards */}
            <div className="grid grid-cols-1 md-grid-cols-4 gap-4">
                <div className="kpi-card">
                    <div className="text-xs text-slate-500 mb-1">Balance Neto</div>
                    <div className="text-2xl font-serif font-bold" style={{color:totalIncome-totalSpent>=0?'#86efac':'#fca5a5'}}>${fmt(totalIncome-totalSpent)}</div>
                    <div className="text-xs mt-1" style={{color:totalIncome-totalSpent>=0?'#22c55e':'#ef4444'}}>{totalIncome-totalSpent>=0?'📈 Positivo':'📉 Negativo'}</div>
                </div>
                <div className="kpi-card">
                    <div className="text-xs text-slate-500 mb-1">Total Ingresos</div>
                    <div className="text-2xl font-serif font-bold text-green-300">${fmt(totalIncome||totalIncomeTx)}</div>
                    <div className="text-xs text-slate-500 mt-1">{incomes.length>0?`${incomes.length} fuentes`:'desde transacciones'}</div>
                </div>
                <div className="kpi-card">
                    <div className="text-xs text-slate-500 mb-1">Total Deudas</div>
                    <div className="text-2xl font-serif font-bold text-red-300">${fmt(totalDebt)}</div>
                    <div className="text-xs text-slate-500 mt-1">Cuota: ${fmt(monthlyDebtPayment)}/mes</div>
                </div>
                <div className="kpi-card">
                    <div className="text-xs text-slate-500 mb-1">Total Gastos</div>
                    <div className="text-2xl font-serif font-bold text-cyan-400">${fmt(totalSpent)}</div>
                    <div className="text-xs text-slate-500 mt-1">Gastos Fijos: ${fmt(monthlyFixed)}/mes</div>
                </div>
            </div>

            <div className="grid grid-cols-1 md-grid-cols-2 gap-6">
                {/* Regla 50/30/20 */}
                <div className="card">
                    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'1.25rem'}}>
                        <div style={{display:'flex',alignItems:'center',gap:'0.5rem'}}>
                            <span style={{fontSize:'1.25rem'}}>⚖️</span>
                            <h2 className="text-lg font-semibold">Regla 50/30/20</h2>
                        </div>
                        {totalIncome === 0 && <span className="badge badge-amber">Configura ingresos</span>}
                    </div>
                    {totalIncome > 0 ? (
                        <div>
                            {ruleBar('🏠 Necesidades', needsPct, 50, '#60a5fa')}
                            {ruleBar('🎬 Deseos', wantsPct, 30, '#c084fc')}
                            {ruleBar('🏦 Ahorro / Deuda', savingsPct, 20, '#22c55e')}
                            <div className="text-xs text-slate-500 mt-3" style={{borderTop:'1px solid #1e293b',paddingTop:'0.75rem'}}>
                                La línea blanca marca el objetivo. Rojo = por encima del límite recomendado.
                            </div>
                        </div>
                    ) : (
                        <div style={{textAlign:'center',padding:'2rem 0'}}>
                            <div style={{fontSize:'2.5rem',marginBottom:'0.75rem'}}>📊</div>
                            <p className="text-slate-400 text-sm">Registrá tus ingresos en la sección <strong className="text-cyan-400">Ingresos</strong> para ver este análisis.</p>
                        </div>
                    )}
                </div>

                {/* Alerts */}
                <div className="card">
                    <div style={{display:'flex',alignItems:'center',gap:'0.5rem',marginBottom:'1rem'}}>
                        <span style={{fontSize:'1.25rem'}}>🔔</span>
                        <h2 className="text-lg font-semibold">Alertas</h2>
                        {alerts.length > 0 && <span className="badge badge-red">{alerts.length}</span>}
                    </div>
                    {alerts.length > 0 ? (
                        <div className="space-y-3">
                            {alerts.slice(0,4).map((alert,idx) => (
                                <div key={idx} className={`alert alert-${alert.type}`}>
                                    <span>{alert.type==='danger'?'🔴':alert.type==='warning'?'🟡':'🔵'}</span>
                                    <span className="text-sm">{alert.message}</span>
                                </div>
                            ))}
                        </div>
                    ) : (
                        <div style={{textAlign:'center',padding:'2rem 0'}}>
                            <div style={{fontSize:'2.5rem',marginBottom:'0.75rem'}}>✅</div>
                            <p className="text-slate-400 text-sm">Todo en orden. Seguís dentro del presupuesto.</p>
                        </div>
                    )}
                </div>
            </div>

            {/* Quick start if no data */}
            {transactions.length === 0 && incomes.length === 0 && (
                <div className="card">
                    <h2 className="text-lg font-semibold mb-4">🚀 Primeros pasos</h2>
                    <div className="space-y-3">
                        <div style={{padding:'1rem',background:'rgba(6,182,212,0.1)',border:'1px solid rgba(6,182,212,0.2)',borderRadius:'0.5rem'}}>
                            <div style={{display:'flex',alignItems:'center',gap:'0.5rem',marginBottom:'0.5rem'}}><span>💰</span><span className="font-semibold text-cyan-400">1. Registrá tus ingresos</span></div>
                            <p className="text-sm text-slate-300">Ve a "Ingresos" y agrega tu sueldo y otras fuentes de ingreso.</p>
                        </div>
                        <div style={{padding:'1rem',background:'rgba(59,130,246,0.1)',border:'1px solid rgba(59,130,246,0.2)',borderRadius:'0.5rem'}}>
                            <div style={{display:'flex',alignItems:'center',gap:'0.5rem',marginBottom:'0.5rem'}}><span>📋</span><span className="font-semibold text-blue-400">2. Configurá gastos fijos</span></div>
                            <p className="text-sm text-slate-300">Alquiler, servicios, suscripciones — los gastos que se repiten cada mes.</p>
                        </div>
                        <div style={{padding:'1rem',background:'rgba(139,92,246,0.1)',border:'1px solid rgba(139,92,246,0.2)',borderRadius:'0.5rem'}}>
                            <div style={{display:'flex',alignItems:'center',gap:'0.5rem',marginBottom:'0.5rem'}}><span>💵</span><span className="font-semibold text-purple-400">3. Registrá transacciones</span></div>
                            <p className="text-sm text-slate-300">Llevá el registro de tus gastos variables del día a día.</p>
                        </div>
                    </div>
                </div>
            )}
        </div>
    );
}

// ── TRANSACTIONS VIEW ─────────────────────────────────────────────────
function TransactionsView({ transactions, categories, onAdd, onDelete }) {

    const [formData, setFormData] = useState({ description:'', amount:'', category:'', date: new Date().toISOString().split('T')[0] });
    const handleSubmit = (e) => {
        e.preventDefault();
        onAdd({...formData, amount: parseFloat(formData.amount)});
        setFormData({ description:'', amount:'', category:'', date: new Date().toISOString().split('T')[0] });
        setShowForm(false);
    };
    return (
        <div className="space-y-6">
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                <h1 className="text-3xl font-serif font-bold">Transacciones</h1>
                <button onClick={() => setShowForm(!showForm)} className="btn btn-primary">➕ Nueva</button>
            </div>
            {showForm && (
                <div className="card">
                    <form onSubmit={handleSubmit} className="space-y-4">
                        <div className="grid grid-cols-1 md-grid-cols-2 gap-4">
                            <div><label className="text-sm text-slate-400 mb-2" style={{display:'block'}}>Descripción</label><input type="text" value={formData.description} onChange={e=>setFormData({...formData,description:e.target.value})} className="input" required /></div>
                            <div><label className="text-sm text-slate-400 mb-2" style={{display:'block'}}>Monto ($)</label><input type="number" step="0.01" value={formData.amount} onChange={e=>setFormData({...formData,amount:e.target.value})} className="input" required /></div>
                            <div><label className="text-sm text-slate-400 mb-2" style={{display:'block'}}>Categoría</label>
                                <select value={formData.category} onChange={e=>setFormData({...formData,category:e.target.value})} className="input">
                                    <option value="">Auto-categorizar</option>
                                    {categories.map(c=><option key={c.id} value={c.id}>{c.icon} {c.name}</option>)}
                                </select>
                            </div>
                            <div><label className="text-sm text-slate-400 mb-2" style={{display:'block'}}>Fecha</label><input type="date" value={formData.date} onChange={e=>setFormData({...formData,date:e.target.value})} className="input" required /></div>
                        </div>
                        <div style={{display:'flex',gap:'0.75rem'}}><button type="submit" className="btn btn-primary">Agregar</button><button type="button" onClick={()=>setShowForm(false)} className="btn btn-secondary">Cancelar</button></div>
                    </form>
                </div>
            )}
            <div className="card">
                {transactions.length === 0 ? (
                    <div style={{textAlign:'center',padding:'3rem'}}><div style={{fontSize:'3rem',marginBottom:'1rem'}}>📭</div><p className="text-slate-400">No hay transacciones todavía</p></div>
                ) : (
                    <div style={{overflowX:'auto'}}>
                        <table>
                            <thead><tr><th>FECHA</th><th>DESCRIPCIÓN</th><th>CATEGORÍA</th><th style={{textAlign:'right'}}>MONTO</th><th style={{textAlign:'center'}}>ACCIONES</th></tr></thead>
                            <tbody>
                                {transactions.slice(0,50).map(tx => {
                                    const cat = categories.find(c=>c.id===tx.category)||{name:tx.category,icon:'📦'};
                                    return (
                                        <tr key={tx.id}>
                                            <td className="text-sm text-slate-300">{new Date(tx.date+'T12:00:00').toLocaleDateString('es')}</td>
                                            <td className="text-sm">{tx.description}{tx.autoCategorized&&<span className="badge badge-cyan ml-2">Auto</span>}</td>
                                            <td className="text-sm">{cat.icon} {cat.name}</td>
                                            <td style={{textAlign:'right'}}><span className="text-xl font-serif font-semibold text-cyan-400">${fmt(tx.amount)}</span></td>
                                            <td style={{textAlign:'center'}}><button onClick={()=>{if(window.confirm('¿Eliminar?'))onDelete(tx.id)}} className="delete-btn">🗑️</button></td>

                                    );

                        </table>
                    </div>
                )}
            </div>
        </div>
    );
}

// ── BUDGET VIEW ───────────────────────────────────────────────────────
function BudgetView({ budgets, categories, transactions, currentMonth, onUpdate }) {
    const [editCategory, setEditCategory] = useState(null);
    const [editAmount, setEditAmount] = useState('');
    const thisMonthTx = transactions.filter(t=>t.date.startsWith(currentMonth));
    const categoryStats = categories.filter(c=>!['income','savings'].includes(c.id)).map(cat=>{
        const spent = thisMonthTx.filter(t=>t.category===cat.id).reduce((s,t)=>s+t.amount,0);
        const budget = budgets[cat.id]||0;
        return {...cat, spent:Math.round(spent), budget, percentage: budget>0?Math.round((spent/budget)*100):0};
    }).sort((a,b)=>b.spent-a.spent);
    const handleSave = () => { onUpdate(editCategory, parseFloat(editAmount)); setEditCategory(null); setEditAmount(''); };
    return (
        <div className="space-y-6">
            <h1 className="text-3xl font-serif font-bold">Presupuesto Mensual</h1>
            <div className="grid gap-4">
                {categoryStats.map(cat=>(
                    <div key={cat.id} className="card">
                        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:'1rem',marginBottom:'1rem'}}>
                            <div style={{display:'flex',alignItems:'center',gap:'0.75rem'}}>
                                <div style={{fontSize:'2rem'}}>{cat.icon}</div>
                                <div><div className="font-semibold text-lg">{cat.name}</div><div className="text-sm text-slate-400">{cat.budget>0?`${cat.percentage}% usado`:'Sin presupuesto'}</div></div>
                            </div>
                            <div style={{display:'flex',alignItems:'center',gap:'1rem'}}>
                                <div style={{textAlign:'right'}}><div className="text-2xl font-serif font-bold text-cyan-400">${fmt(cat.spent)}</div><div className="text-sm text-slate-400">de ${fmt(cat.budget)}</div></div>
                                {editCategory===cat.id ? (
                                    <div style={{display:'flex',gap:'0.5rem'}}><input type="number" value={editAmount} onChange={e=>setEditAmount(e.target.value)} className="input" style={{width:'8rem'}} autoFocus /><button onClick={handleSave} className="btn btn-primary">✓</button></div>
                                ) : (
                                    <button onClick={()=>{setEditCategory(cat.id);setEditAmount(cat.budget.toString())}} className="btn btn-secondary">Editar</button>
                                )}
                            </div>
                        </div>
                        {cat.budget>0&&<div className="progress-bar"><div className={`progress-fill ${cat.percentage>100?'danger':cat.percentage>80?'warning':''}`} style={{width:`${Math.min(cat.percentage,100)}%`}} /></div>}
                    </div>
                ))}
            </div>
        </div>
    );
}

// ── GOALS VIEW ────────────────────────────────────────────────────────
function GoalsView({ goals, onAdd, onUpdateGoal }) {
    const [showForm, setShowForm] = useState(false);
    const [formData, setFormData] = useState({name:'',target:'',deadline:''});
    const [addingTo, setAddingTo] = useState(null);

    const handleAddMoney = (goalId) => { if(!addAmount||parseFloat(addAmount)<=0)return; onUpdateGoal(goalId,parseFloat(addAmount)); setAddingTo(null); setAddAmount(''); };
    return (
        <div className="space-y-6">
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>

                <div className="card">
                    <form onSubmit={handleSubmit} className="space-y-4">

                            <div><label className="text-sm text-slate-400 mb-2" style={{display:'block'}}>Fecha límite</label><input type="date" value={formData.deadline} onChange={e=>setFormData({...formData,deadline:e.target.value})} className="input" required /></div>

                                    <span className="text-slate-400">Progreso</span><span className="text-cyan-400 font-semibold">{Math.round(progress)}%</span>
                                </div>
                                <div className="progress-bar"><div className="progress-fill" style={{width:`${Math.min(progress,100)}%`}} /></div>
                            </div>
                            <div style={{display:'flex',justifyContent:'space-between',marginBottom:'1rem'}}>
                                <div><div className="text-sm text-slate-400">Ahorrado</div><div className="text-2xl font-serif font-bold text-cyan-400">${fmt(goal.progress)}</div></div>

function IncomesView({ incomes, onSave }) {
    const [showForm, setShowForm] = useState(false);

    const emptyForm = { name:'', amount:'', frequency:'monthly', type:'fixed', seasonalMonths:[6,12], notes:'' };
    const [form, setForm] = useState(emptyForm);

    const monthlyTotal = incomes.reduce((sum,inc)=>{
        const amt=inc.amount||0;
        if(inc.frequency==='monthly') return sum+amt;
        if(inc.frequency==='annual') return sum+amt/12;
        if(inc.frequency==='biannual') return sum+amt/6;
        return sum;
    },0);

    const annualTotal = incomes.reduce((sum,inc)=>{
        const amt=inc.amount||0;
        if(inc.frequency==='monthly') return sum+amt*12;
        if(inc.frequency==='annual') return sum+amt;
        if(inc.frequency==='biannual') return sum+amt*2;
        return sum;
    },0);

    const handleSubmit = () => {
        if(!form.name||!form.amount) return;
        const income = {id:editId||Date.now().toString(), ...form, amount:parseFloat(form.amount)};

    const handleDelete = (id) => { if(window.confirm('¿Eliminar este ingreso?')) onSave(incomes.filter(i=>i.id!==id)); };

    const toggleMonth = (m) => {
        const sm = form.seasonalMonths||[];

                </div>
            )}

                        </div>
                    );
                })
            )}

    );
}

// ── CASH FLOW CHART (SVG) ─────────────────────────────────────────────
function CashFlowChart({ chartData }) {
    const W=760, H=280, padL=65, padR=15, padT=20, padB=50;
    const cW=W-padL-padR, cH=H-padT-padB;
    const slotW=cW/12;
    const barW=10, barGap=3, groupW=3*barW+2*barGap, groupOff=(slotW-groupW)/2;

    const maxInc = Math.max(...chartData.map(d=>d.income),1);
    const maxExp = Math.max(...chartData.map(d=>d.fixed+d.variable),1);
    const maxVal = Math.max(maxInc, maxExp, 1);

    const scaleY = (v) => Math.max(0, (v/maxVal)*cH);
    const barY = (v) => padT + cH - scaleY(v);

    const fmtK = (v) => v>=1000?`${(v/1000).toFixed(0)}k`:`${v}`;

    const balancePoints = chartData.map((d,i)=>{
        const bx = padL + i*slotW + slotW/2;
        const by = padT + cH - scaleY(Math.max(0, d.income - d.fixed - d.variable));
        return `${bx},${by}`;
    }).join(' ');

    return (
        <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:'auto',display:'block'}}>
            {/* Grid lines */}
            {[0,0.25,0.5,0.75,1].map(pct=>{
                const y=padT+cH*(1-pct);
                return (
                    <g key={pct}>
                        <line x1={padL} y1={y} x2={W-padR} y2={y} stroke="rgba(71,85,105,0.35)" strokeWidth={1} strokeDasharray={pct===0?'':'4,4'} />
                        <text x={padL-6} y={y+4} textAnchor="end" fill="#64748b" fontSize={10}>{fmtK(Math.round(maxVal*pct))}</text>
                    </g>
                );
            })}

            {/* Bars */}
            {chartData.map((d,i)=>{
                const x0=padL+i*slotW+groupOff;
                const incH=scaleY(d.income);
                const fixH=scaleY(d.fixed);
                const varH=scaleY(d.variable);
                const alpha=d.isProjected?0.45:1;
                const cx=padL+i*slotW+slotW/2;
                return (
                    <g key={i}>
                        {/* Income */}
                        {incH>0&&<rect x={x0} y={barY(d.income)} width={barW} height={incH} fill={`rgba(34,197,94,${alpha})`} rx={2} />}
                        {/* Fixed */}
                        {fixH>0&&<rect x={x0+barW+barGap} y={barY(d.fixed)} width={barW} height={fixH} fill={`rgba(96,165,250,${alpha})`} rx={2} />}
                        {/* Variable */}
                        {varH>0&&<rect x={x0+2*(barW+barGap)} y={barY(d.variable)} width={barW} height={varH} fill={`rgba(249,115,22,${alpha})`} rx={2} />}
                        {/* Projected marker */}
                        {d.isProjected&&<text x={cx} y={padT+cH+15} textAnchor="middle" fill="#334155" fontSize={8}>~</text>}
                        {/* Month label */}
                        <text x={cx} y={H-padB+20} textAnchor="middle" fill={d.isCurrentMonth?'#22d3ee':'#64748b'} fontSize={10} fontWeight={d.isCurrentMonth?700:400}>{d.month}</text>
                    </g>
                );
            })}

            {/* Balance line */}
            <polyline points={balancePoints} fill="none" stroke="#fbbf24" strokeWidth={2} strokeLinejoin="round" />
            {chartData.map((d,i)=>{
                const bal=d.income-d.fixed-d.variable;
                const bx=padL+i*slotW+slotW/2;
                const by=padT+cH-scaleY(Math.max(0,bal));
                return <circle key={i} cx={bx} cy={by} r={3} fill="#fbbf24" />;
            })}
        </svg>
    );
}

// ── CASH FLOW VIEW ────────────────────────────────────────────────────
function CashFlowView({ incomes, fixedExpenses, transactions, budgets, currentMonth }) {
    const now = new Date();
    const year = now.getFullYear();
    const currentMonthNum = now.getMonth() + 1;
    const monthlyFixed = calcMonthlyFixed(fixedExpenses);
    const totalBudget = Object.values(budgets).reduce((s,b)=>s+b,0);

    const chartData = useMemo(() => {
        let cumBal = 0;
        return Array.from({length:12},(_,i)=>{
            const mn=i+1;
            const ms=`${year}-${String(mn).padStart(2,'0')}`;
            const inc = incomes.length>0 ? calcMonthlyIncome(incomes,mn) :
                transactions.filter(t=>t.date.startsWith(ms)&&t.category==='income').reduce((s,t)=>s+t.amount,0);
            const actualVar = transactions.filter(t=>t.date.startsWith(ms)&&!['income','savings'].includes(t.category)).reduce((s,t)=>s+t.amount,0);
            const variable = mn<=currentMonthNum ? actualVar : (totalBudget||actualVar);
            const isProjected = mn > currentMonthNum;
            const isCurrentMonth = mn === currentMonthNum;
            const bal = inc - monthlyFixed - variable;
            cumBal += bal;
            return {month:MONTHS_SHORT[i], monthNum:mn, income:Math.round(inc), fixed:Math.round(monthlyFixed), variable:Math.round(variable), balance:Math.round(bal), cumBalance:Math.round(cumBal), isProjected, isCurrentMonth};
        });
    }, [incomes, fixedExpenses, transactions, budgets, year, currentMonthNum, monthlyFixed, totalBudget]);

    const annualInc=chartData.reduce((s,d)=>s+d.income,0);
    const annualFixed=chartData.reduce((s,d)=>s+d.fixed,0);
    const annualVar=chartData.reduce((s,d)=>s+d.variable,0);
    const annualBal=chartData.reduce((s,d)=>s+d.balance,0);

    return (
        <div className="space-y-6">
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:'1rem'}}>
                <h1 className="text-3xl font-serif font-bold">📅 Flujo de Caja {year}</h1>
                <div style={{display:'flex',gap:'0.5rem',flexWrap:'wrap'}}>
                    {incomes.length===0&&<span className="badge badge-amber">⚠️ Configura ingresos para mejor precisión</span>}
                    {fixedExpenses.length===0&&<span className="badge badge-blue">💡 Agrega gastos fijos</span>}
                </div>
            </div>

            {/* Summary KPIs */}
            <div className="grid grid-cols-1 md-grid-cols-4 gap-4">
                <div className="kpi-card"><div className="text-xs text-slate-500 mb-1">Ingresos anuales</div><div className="text-xl font-serif font-bold text-green-300">${fmt(annualInc)}</div></div>
                <div className="kpi-card"><div className="text-xs text-slate-500 mb-1">Gastos Fijos anuales</div><div className="text-xl font-serif font-bold text-blue-300">${fmt(annualFixed)}</div></div>
                <div className="kpi-card"><div className="text-xs text-slate-500 mb-1">Gastos Var. anuales</div><div className="text-xl font-serif font-bold text-amber-300">${fmt(annualVar)}</div></div>
                <div className="kpi-card"><div className="text-xs text-slate-500 mb-1">Balance anual</div><div className="text-xl font-serif font-bold" style={{color:annualBal>=0?'#86efac':'#fca5a5'}}>${fmt(annualBal)}</div></div>
            </div>

            {/* Chart */}
            <div className="card">
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'1rem',flexWrap:'wrap',gap:'0.75rem'}}>
                    <h2 className="text-lg font-semibold">Comparativa Mensual</h2>
                    <div className="chart-legend">
                        <div className="legend-item"><div className="legend-dot" style={{background:'rgba(34,197,94,0.85)'}} /><span>Ingresos</span></div>
                        <div className="legend-item"><div className="legend-dot" style={{background:'rgba(96,165,250,0.85)'}} /><span>Gastos Fijos</span></div>

                            <td>📈 Acumulado</td>

                    </tbody>
                </table>
                <p className="text-xs text-slate-500 mt-3">* Meses proyectados usando presupuesto configurado. Los pasados usan datos reales de transacciones.</p>

    );
}

// ── DEBTS VIEW ────────────────────────────────────────────────────────
function DebtsView({ debts, onSave }) {
    const [strategy, setStrategy] = useState('avalanche');
    const [showForm, setShowForm] = useState(false);
    const [editId, setEditId] = useState(null);
    const emptyForm = {name:'',type:'Tarjeta crédito',balance:'',payment:'',rate:'',notes:''};
    const [form, setForm] = useState(emptyForm);

    const DEBT_TYPES = ['Tarjeta crédito','Préstamo personal','Hipoteca','Prendario (auto)','Familiar/amigo','Consumo','Otro'];

    const sorted = [...debts].sort((a,b)=>{
        if(strategy==='avalanche') return (b.rate||0)-(a.rate||0);
        return (a.balance||0)-(b.balance||0);
    });

    const totalBalance=debts.reduce((s,d)=>s+(d.balance||0),0);
    const totalPayment=debts.reduce((s,d)=>s+(d.payment||0),0);
    const totalInterestAnnual=debts.reduce((s,d)=>s+(d.balance||0)*(d.rate||0)/100,0);

    const handleSubmit = () => {
        if(!form.name||!form.balance) return;
        const debt = {id:editId||Date.now().toString(),...form,balance:parseFloat(form.balance)||0,payment:parseFloat(form.payment)||0,rate:parseFloat(form.rate)||0};
        onSave(editId?debts.map(d=>d.id===editId?debt:d):[...debts,debt]);
        resetForm();
    };
    const handleEdit = (d) => { setEditId(d.id); setForm({name:d.name,type:d.type,balance:String(d.balance),payment:String(d.payment),rate:String(d.rate),notes:d.notes||''}); setShowForm(true); };
    const handleDelete = (id) => { if(window.confirm('¿Eliminar esta deuda?')) onSave(debts.filter(d=>d.id!==id)); };
    const resetForm = () => { setShowForm(false); setEditId(null); setForm(emptyForm); };

    return (
        <div className="space-y-6">
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>

                                    </div>
                                </div>
                            );

                </div>
            )}
        </div>
    );

                            <span style={{padding:'0.4rem 0.875rem',borderRadius:'0.5rem',background:`rgba(${pct>=100?'34,197,94':pct>=50?'245,158,11':'239,68,68'},0.15)`,color:statusColor,fontWeight:600,fontSize:'0.875rem'}}>
                                {statusLabel}
                            </span>
                            <div className="text-sm text-slate-400 mt-2">{fmtDec(monthsCovered)} meses cubiertos</div>
                        </div>
                    </div>

                    <div className="ef-bar-track">
                        <div className="ef-bar-fill" style={{width:`${pct}%`}}>{pct>=15&&`${Math.round(pct)}%`}</div>
                    </div>

                    <div style={{display:'flex',gap:'1.5rem',marginTop:'1rem',flexWrap:'wrap'}} className="text-sm">
                        <div><span className="text-slate-400">Gastos esenciales/mes:</span><span className="ml-2 text-slate-200 font-semibold">${fmt(totalEssentials)}</span></div>
                        <div><span className="text-slate-400">Meses objetivo:</span><span className="ml-2 text-slate-200 font-semibold">{local.targetMonths||6}</span></div>
                        {monthsToComplete&&<div><span className="text-slate-400">Tiempo para completar:</span><span className="ml-2 text-cyan-400 font-semibold">{monthsToComplete} meses</span></div>}
                    </div>
                </div>
            </div>

            {/* Edit form or display */}
            <div className="grid grid-cols-1 md-grid-cols-2 gap-6">
                {/* Essentials breakdown */}
                <div className="card">
                    <h2 className="text-lg font-semibold mb-4">💰 Gastos Esenciales Mensuales</h2>
                    {editing ? (
                        <div className="space-y-3">
                            {fields.map(f=>(
                                <div key={f.key} style={{display:'flex',alignItems:'center',gap:'0.75rem'}}>
                                    <label style={{flex:1,fontSize:'0.875rem',color:'#94a3b8'}}>{f.label}</label>
                                    <input type="number" value={local[f.key]||''} onChange={e=>setLocal({...local,[f.key]:parseFloat(e.target.value)||0})} className="input" style={{width:'8rem'}} placeholder="$0" />
                                </div>
                            ))}
                            <div style={{borderTop:'1px solid #334155',paddingTop:'0.75rem',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                                <span className="font-semibold">TOTAL MENSUAL</span>
                                <span className="text-xl font-serif font-bold text-cyan-400">${fmt(totalEssentials)}</span>
                            </div>
                        </div>
                    ) : (
                        <div className="space-y-3">
                            {fields.map(f=>(
                                <div key={f.key} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'0.5rem 0',borderBottom:'1px solid rgba(51,65,85,0.4)'}}>
                                    <span className="text-sm text-slate-300">{f.label}</span>
                                    <span className="font-semibold">{fund[f.key]>0?`$${fmt(fund[f.key])}`:<span className="text-slate-600">—</span>}</span>
                                </div>
                            ))}
                            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',paddingTop:'0.75rem'}}>
                                <span className="font-bold">TOTAL</span>
                                <span className="text-xl font-serif font-bold text-cyan-400">${fmt(totalEssentials)}</span>
                            </div>
                        </div>
                    )}
                </div>

                {/* Config & status */}
                <div className="card">
                    <h2 className="text-lg font-semibold mb-4">⚙️ Configuración del Fondo</h2>
                    <div className="space-y-4">
                        <div>
                            <label className="text-sm text-slate-400 mb-2" style={{display:'block'}}>Meses de cobertura objetivo</label>
                            {editing ? (
                                <select value={local.targetMonths||6} onChange={e=>setLocal({...local,targetMonths:parseInt(e.target.value)})} className="input">
                                    {[1,2,3,4,5,6,9,12].map(m=><option key={m} value={m}>{m} {m===3?'(mínimo)':m===6?'(recomendado)':m===12?'(conservador)':''}</option>)}
                                </select>
                            ) : (
                                <div className="text-xl font-serif font-bold">{fund.targetMonths||6} meses</div>
                            )}
                        </div>
                        <div>
                            <label className="text-sm text-slate-400 mb-2" style={{display:'block'}}>Saldo actual del fondo ($)</label>
                            {editing ? (
                                <input type="number" value={local.currentBalance||''} onChange={e=>setLocal({...local,currentBalance:parseFloat(e.target.value)||0})} className="input" placeholder="$0" />
                            ) : (
                                <div className="text-xl font-serif font-bold text-cyan-400">${fmt(fund.currentBalance)}</div>
                            )}
                        </div>
                        <div>
                            <label className="text-sm text-slate-400 mb-2" style={{display:'block'}}>Depósito mensual al fondo ($)</label>
                            {editing ? (
                                <input type="number" value={local.monthlyDeposit||''} onChange={e=>setLocal({...local,monthlyDeposit:parseFloat(e.target.value)||0})} className="input" placeholder="$0" />
                            ) : (
                                <div className="text-xl font-serif font-bold">${fmt(fund.monthlyDeposit)}</div>
                            )}
                        </div>
                        {editing && (
                            <button onClick={handleSave} className="btn btn-primary" style={{width:'100%'}}>💾 Guardar cambios</button>
                        )}
                    </div>

                    {!editing && (
                        <div style={{marginTop:'1.5rem',padding:'0.875rem',background:'rgba(6,182,212,0.05)',border:'1px solid rgba(6,182,212,0.15)',borderRadius:'0.5rem'}}>
                            <p className="text-xs text-cyan-400 font-semibold mb-2">💡 Consejos</p>
                            <ul style={{listStyle:'none',padding:0}}>
                                <li className="text-xs text-slate-400 mb-1">• Meta mínima: 3 meses de gastos esenciales</li>
                                <li className="text-xs text-slate-400 mb-1">• Ideal: 6 meses (empleo autónomo: 9-12)</li>
                                <li className="text-xs text-slate-400 mb-1">• Guardalo en una cuenta separada de ahorro</li>
                                <li className="text-xs text-slate-400">• Prioridad antes que otras metas de inversión</li>
                            </ul>
                        </div>
                    )}
                </div>
            </div>
        </div>
    );
}

// ── RENDER ────────────────────────────────────────────────────────────
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<FinanceApp />);
    </script>
</body>
</html>
