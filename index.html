                                <select value={local.targetMonths||6} onChange={e=>setLocal({...local,targetMonths:parseInt(e.target.value)})} className="input">
                                    {[1,2,3,4,5,6,9,12].map(m=><option key={m} value={m}>{m} {m===3?'(mínimo)':m===6?'(recomendado)':m===12?'(conservador)':''}</option>)}
                                </select>
                            ) : (
                                <div className="text-xl font-serif font-bold">{fund.targetMonths||6} meses</div>
                            )}
                        </div>
                        <div>
                            <label className="text-sm text-slate-400 mb-2" style={{display:'block'}}>Saldo actual del fondo ($)</label>
                            {editing ? (
                                <input type="number" value={local.currentBalance||''} onChange={e=>setLocal({...local,currentBalance:parseFloat(e.target.value)||0})} className="input" placeholder="$0" />
                            ) : (
                                <div className="text-xl font-serif font-bold text-cyan-400">${fmt(fund.currentBalance)}</div>
                            )}
                        </div>
                        <div>
                            <label className="text-sm text-slate-400 mb-2" style={{display:'block'}}>Depósito mensual al fondo ($)</label>
                            {editing ? (
                                <input type="number" value={local.monthlyDeposit||''} onChange={e=>setLocal({...local,monthlyDeposit:parseFloat(e.target.value)||0})} className="input" placeholder="$0" />
                            ) : (
                                <div className="text-xl font-serif font-bold">${fmt(fund.monthlyDeposit)}</div>
                            )}
                        </div>
                        {editing && (
                            <button onClick={handleSave} className="btn btn-primary" style={{width:'100%'}}>💾 Guardar cambios</button>
                        )}
                    </div>

                    {!editing && (
                        <div style={{marginTop:'1.5rem',padding:'0.875rem',background:'rgba(6,182,212,0.05)',border:'1px solid rgba(6,182,212,0.15)',borderRadius:'0.5rem'}}>
                            <p className="text-xs text-cyan-400 font-semibold mb-2">💡 Consejos</p>
                            <ul style={{listStyle:'none',padding:0}}>
                                <li className="text-xs text-slate-400 mb-1">• Meta mínima: 3 meses de gastos esenciales</li>
                                <li className="text-xs text-slate-400 mb-1">• Ideal: 6 meses (empleo autónomo: 9-12)</li>
                                <li className="text-xs text-slate-400 mb-1">• Guardalo en una cuenta separada de ahorro</li>
                                <li className="text-xs text-slate-400">• Prioridad antes que otras metas de inversión</li>
                            </ul>
                        </div>
                    )}
                </div>
            </div>
        </div>
    );
}

// ── SIMULATOR VIEW ────────────────────────────────────────────────────
function SimulatorView({ incomes, fixedExpenses, budgets, debts, transactions, categories, currentMonth, goals, emergencyFund }) {
    const now = new Date();
    const monthNum = now.getMonth() + 1;

    // Real data baseline
    const baseIncome = incomes.length > 0 ? calcMonthlyIncome(incomes, monthNum) : 0;
    const incomeTx = transactions.filter(t => t.category === 'income' && t.date.startsWith(currentMonth)).reduce((s,t)=>s+t.amount,0);
    const baseFixed = calcFixedForMonth(fixedExpenses, monthNum);
    const baseVariable = Object.values(budgets).reduce((s,b)=>s+b,0);
    const baseDebtPayments = debts.reduce((s,d)=>s+(d.payment||0),0);
    const baseSavingsGoals = goals.length > 0 ? Math.round(goals.reduce((s,g) => { const remaining = Math.max(0, g.target - g.progress); const monthsLeft = g.deadline ? Math.max(1, Math.ceil((new Date(g.deadline) - now) / (30.44*24*60*60*1000))) : 12; return s + remaining / monthsLeft; }, 0)) : 0;
    const baseEmergencyDeposit = emergencyFund.monthlyDeposit || 0;

    // Mode: summary vs detailed real
    const [useRealExpenses, setUseRealExpenses] = useState(false);

    // Summary mode state
    const [sim, setSim] = useState({
        income: baseIncome, incomeExtra: incomeTx, fixed: baseFixed,
        variable: baseVariable, debtPayments: baseDebtPayments,
        savingsGoals: baseSavingsGoals, emergencyDeposit: baseEmergencyDeposit, customItems: []
    });

    // Detailed mode state — individual editable lines
    const [detailLines, setDetailLines] = useState([]);

    // Build real expense lines from actual data
    const loadRealExpenses = () => {
        const lines = [];
        // Income
        lines.push({ id: 'inc-salary', name: 'Salario / Ingreso fijo', amount: baseIncome, type: 'income', source: 'fixed', editable: true });
        if (incomeTx > 0) {
            transactions.filter(t => t.category === 'income' && t.date.startsWith(currentMonth)).forEach(t => {
                lines.push({ id: `inc-${t.id}`, name: `💵 ${t.description}`, amount: t.amount, type: 'income', source: 'tx', editable: true });
            });
        }
        // Fixed expenses — each item
        fixedExpenses.forEach(exp => {
            if (exp.frequency === 'monthly' || (exp.frequency === 'specific-month' && exp.paymentMonth === monthNum)) {
                lines.push({ id: `fix-${exp.id}`, name: `📋 ${exp.name}`, amount: exp.amount, type: 'fixed', source: 'fixed', editable: true });
            } else if (exp.frequency === 'annual') {
                lines.push({ id: `fix-${exp.id}`, name: `📋 ${exp.name} (prorrateo)`, amount: Math.round(exp.amount/12), type: 'fixed', source: 'fixed', editable: true });
            }
        });
        // Variable transactions (real, not fixed-linked)
        const varTx = transactions.filter(t => t.date.startsWith(currentMonth) && isVariableTx(t));
        varTx.forEach(t => {
            const cat = categories.find(c=>c.id===t.category);
            lines.push({ id: `var-${t.id}`, name: `${cat?cat.icon:'📦'} ${t.description}`, amount: t.amount, type: 'variable', source: 'tx', editable: true });
        });
        // Debt payments
        debts.forEach(d => {
            lines.push({ id: `debt-${d.id}`, name: `💳 ${d.name}`, amount: d.payment || 0, type: 'debt', source: 'fixed', editable: true });
        });
        // Savings
        if (baseSavingsGoals > 0) lines.push({ id: 'sav-goals', name: '🎯 Depósito metas', amount: baseSavingsGoals, type: 'savings', source: 'calc', editable: true });
        if (baseEmergencyDeposit > 0) lines.push({ id: 'sav-ef', name: '🚨 Depósito fondo emergencia', amount: baseEmergencyDeposit, type: 'savings', source: 'calc', editable: true });
        return lines;
    };

    const toggleRealExpenses = () => {
        if (!useRealExpenses) {
            setDetailLines(loadRealExpenses());
        }
        setUseRealExpenses(!useRealExpenses);
    };

    const updateDetailLine = (id, newAmount) => {
        setDetailLines(detailLines.map(l => l.id === id ? {...l, amount: newAmount} : l));
    };
    const removeDetailLine = (id) => setDetailLines(detailLines.filter(l => l.id !== id));

    // Custom item for both modes
    const [newItem, setNewItem] = useState({ name: '', amount: '', type: 'expense' });
    const addCustomItem = () => {
        if (!newItem.name || !newItem.amount) return;
        const item = { id: `custom-${Date.now()}`, name: newItem.name, amount: parseFloat(newItem.amount) || 0, type: newItem.type === 'income' ? 'income' : 'custom-expense', source: 'custom', editable: true };
        if (useRealExpenses) {
            setDetailLines([...detailLines, item]);
        } else {
            setSim({ ...sim, customItems: [...sim.customItems, { id: Date.now(), name: newItem.name, amount: parseFloat(newItem.amount) || 0, type: newItem.type }] });
        }
        setNewItem({ name: '', amount: '', type: 'expense' });
    };
    const removeCustomItem = (id) => setSim({ ...sim, customItems: sim.customItems.filter(i => i.id !== id) });

    // Reset
    const resetSim = () => {
        setSim({ income: baseIncome, incomeExtra: incomeTx, fixed: baseFixed, variable: baseVariable, debtPayments: baseDebtPayments, savingsGoals: baseSavingsGoals, emergencyDeposit: baseEmergencyDeposit, customItems: [] });
        if (useRealExpenses) setDetailLines(loadRealExpenses());
    };

    // ── Calculations (works for both modes) ──
    let totalIncome, totalExpenses, freeBalance;
    let breakdownItems = []; // for waterfall

    if (useRealExpenses) {
        totalIncome = detailLines.filter(l=>l.type==='income').reduce((s,l)=>s+l.amount,0);
        const fixedAmt = detailLines.filter(l=>l.type==='fixed').reduce((s,l)=>s+l.amount,0);
        const variableAmt = detailLines.filter(l=>l.type==='variable').reduce((s,l)=>s+l.amount,0);
        const debtAmt = detailLines.filter(l=>l.type==='debt').reduce((s,l)=>s+l.amount,0);
        const savingsAmt = detailLines.filter(l=>l.type==='savings').reduce((s,l)=>s+l.amount,0);
        const customAmt = detailLines.filter(l=>l.type==='custom-expense').reduce((s,l)=>s+l.amount,0);
        totalExpenses = fixedAmt + variableAmt + debtAmt + savingsAmt + customAmt;
        freeBalance = totalIncome - totalExpenses;
        breakdownItems = [
            { label: '📋 Gastos Fijos', amount: fixedAmt, color: '#60a5fa' },
            { label: '🛒 Gastos Variables', amount: variableAmt, color: '#f59e0b' },
            { label: '💳 Deudas', amount: debtAmt, color: '#ef4444' },
            { label: '🏦 Ahorro', amount: savingsAmt, color: '#14b8a6' },
            { label: '📌 Personalizados', amount: customAmt, color: '#ec4899' },
        ].filter(b => b.amount > 0);
    } else {
        totalIncome = sim.income + sim.incomeExtra + sim.customItems.filter(i=>i.type==='income').reduce((s,i)=>s+i.amount,0);
        const totalFixed = sim.fixed;
        const totalVariable = sim.variable;
        const totalDebt = sim.debtPayments;
        const totalSavings = sim.savingsGoals + sim.emergencyDeposit;
        const totalCustomExpenses = sim.customItems.filter(i=>i.type==='expense').reduce((s,i)=>s+i.amount,0);
        totalExpenses = totalFixed + totalVariable + totalDebt + totalSavings + totalCustomExpenses;
        freeBalance = totalIncome - totalExpenses;
        breakdownItems = [
            { label: '📋 Gastos Fijos', amount: totalFixed, color: '#60a5fa' },
            { label: '🛒 Presupuesto Variable', amount: totalVariable, color: '#f59e0b' },
            { label: '💳 Deudas', amount: totalDebt, color: '#ef4444' },
            { label: '🏦 Ahorro', amount: totalSavings, color: '#14b8a6' },
            { label: '📌 Personalizados', amount: totalCustomExpenses, color: '#ec4899' },
        ].filter(b => b.amount > 0);
    }

    const freePct = totalIncome > 0 ? (freeBalance / totalIncome) * 100 : 0;
    const annualFree = freeBalance * 12;

    const simInput = (label, key, icon, color) => (
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'0.625rem 0',borderBottom:'1px solid rgba(51,65,85,0.3)'}}>
            <div style={{display:'flex',alignItems:'center',gap:'0.5rem'}}>
                <span>{icon}</span>
                <span className="text-sm">{label}</span>
            </div>
            <div style={{display:'flex',alignItems:'center',gap:'0.5rem'}}>
                <span className="text-xs text-slate-500">$</span>
                <input type="text" inputMode="decimal" value={sim[key]}
                    onChange={e => { const v = e.target.value; if (/^[0-9]*[.,]?[0-9]*$/.test(v)) setSim({...sim, [key]: parseFloat(v.replace(',','.')) || 0}); }}
                    className="input" style={{width:'7rem',textAlign:'right',color}} />
            </div>
        </div>
    );

    // Type colors & labels for detail mode
    const typeConfig = { income: { color: '#86efac', label: 'Ingreso' }, fixed: { color: '#93c5fd', label: 'Fijo' }, variable: { color: '#fcd34d', label: 'Variable' }, debt: { color: '#fca5a5', label: 'Deuda' }, savings: { color: '#5eead4', label: 'Ahorro' }, 'custom-expense': { color: '#f9a8d4', label: 'Personalizado' } };

    return (
        <div className="space-y-6">
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:'0.75rem'}}>
                <div>
                    <h1 className="text-3xl font-serif font-bold">🧮 Simulador Financiero</h1>
                    <p className="text-sm text-slate-500 mt-1">Ajustá cualquier valor para ver cómo impacta en tu saldo libre</p>
                </div>
                <div style={{display:'flex',gap:'0.5rem',flexWrap:'wrap'}}>
                    <button onClick={resetSim} className="btn btn-secondary">🔄 Resetear</button>
                </div>
            </div>

            {/* Mode toggle */}
            <div style={{display:'flex',alignItems:'center',gap:'1rem',padding:'1rem',background:'rgba(30,41,59,0.5)',borderRadius:'0.75rem',border:'1px solid rgba(71,85,105,0.4)'}}>
                <label style={{display:'flex',alignItems:'center',gap:'0.75rem',cursor:'pointer',flex:1}}>
                    <div onClick={toggleRealExpenses} style={{width:'3rem',height:'1.625rem',borderRadius:'9999px',background:useRealExpenses?'#06b6d4':'#334155',padding:'0.125rem',transition:'background 0.2s',cursor:'pointer',flexShrink:0}}>
                        <div style={{width:'1.375rem',height:'1.375rem',borderRadius:'50%',background:'white',transition:'transform 0.2s',transform:useRealExpenses?'translateX(1.375rem)':'translateX(0)'}} />
                    </div>
                    <div>
                        <div className="text-sm font-medium">{useRealExpenses ? '📋 Modo detallado — Gastos reales del mes' : '📊 Modo resumen — Totales por categoría'}</div>
                        <div className="text-xs text-slate-500">{useRealExpenses ? 'Cada transacción y gasto fijo como línea editable individual' : 'Totales agrupados: fijos, presupuesto, deudas, ahorro'}</div>
                    </div>
                </label>
            </div>

            {/* Hero result */}
            <div className="hero-card">
                <div style={{position:'relative',zIndex:1}}>
                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',flexWrap:'wrap',gap:'1.5rem'}}>
                        <div>
                            <div className="text-sm text-cyan-400 mb-1">Saldo libre mensual</div>
                            <div className="text-5xl font-serif font-bold" style={{color:freeBalance>=0?'#86efac':'#fca5a5'}}>
                                {freeBalance >= 0 ? '' : '-'}${fmt(Math.abs(freeBalance))}
                            </div>
                            <div className="text-sm text-slate-400 mt-2">
                                {freeBalance >= 0 ? `Te sobran $${fmt(freeBalance)} después de cubrir todo` : `Te faltan $${fmt(Math.abs(freeBalance))} para cubrir todos los gastos`}
                            </div>
                        </div>
                        <div style={{textAlign:'right'}}>
                            <div className="text-xs text-slate-500 mb-1">Proyección anual</div>
                            <div className="text-2xl font-serif font-bold" style={{color:annualFree>=0?'#86efac':'#fca5a5'}}>${fmt(annualFree)}</div>
                            <div className="text-xs text-slate-500 mt-1">{freePct >= 0 ? Math.round(freePct) : 0}% del ingreso queda libre</div>
                        </div>
                    </div>
                    {/* Stacked bar */}
                    {totalIncome > 0 && (
                        <div style={{marginTop:'1.5rem'}}>
                            <div style={{height:'2rem',display:'flex',borderRadius:'0.5rem',overflow:'hidden',border:'1px solid rgba(51,65,85,0.5)'}}>
                                {breakdownItems.map((b,i) => <div key={i} style={{width:`${(b.amount/totalIncome)*100}%`,background:b.color,minWidth:'2px'}} />)}
                                {freeBalance > 0 && <div style={{width:`${freePct}%`,background:'rgba(34,197,94,0.3)',minWidth:'2px'}} />}
                            </div>
                            <div style={{display:'flex',gap:'0.75rem',flexWrap:'wrap',marginTop:'0.5rem'}}>
                                {breakdownItems.map((b,i) => <span key={i} className="text-xs" style={{color:b.color}}>■ {b.label} {Math.round((b.amount/totalIncome)*100)}%</span>)}
                                {freeBalance > 0 && <span className="text-xs" style={{color:'#86efac'}}>■ Libre {Math.round(freePct)}%</span>}
                            </div>
                        </div>
                    )}
                </div>
            </div>

            {/* ── SUMMARY MODE ── */}
            {!useRealExpenses && (
                <div className="grid grid-cols-1 md-grid-cols-2 gap-6">
                    <div className="card">
                        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'1rem'}}>
                            <h2 className="text-lg font-semibold" style={{display:'flex',alignItems:'center',gap:'0.5rem'}}><span>💰</span> Ingresos</h2>
                            <span className="text-xl font-serif font-bold text-green-300">${fmt(totalIncome)}</span>
                        </div>
                        {simInput('Salario / Ingreso fijo', 'income', '🏢', '#86efac')}
                        {simInput('Ingresos extra', 'incomeExtra', '💵', '#4ade80')}
                        {sim.customItems.filter(i=>i.type==='income').map(item => (
                            <div key={item.id} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'0.625rem 0',borderBottom:'1px solid rgba(51,65,85,0.3)'}}>
                                <span className="text-sm">✨ {item.name}</span>
                                <div style={{display:'flex',alignItems:'center',gap:'0.5rem'}}>
                                    <span className="text-green-300 font-semibold">${fmt(item.amount)}</span>
                                    <button onClick={()=>removeCustomItem(item.id)} className="delete-btn" style={{padding:'0.15rem 0.4rem',fontSize:'0.75rem'}}>✕</button>
                                </div>
                            </div>
                        ))}
                    </div>
                    <div className="card">
                        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'1rem'}}>
                            <h2 className="text-lg font-semibold" style={{display:'flex',alignItems:'center',gap:'0.5rem'}}><span>📤</span> Egresos</h2>
                            <span className="text-xl font-serif font-bold text-red-300">${fmt(totalExpenses)}</span>
                        </div>
                        {simInput('Gastos fijos del mes', 'fixed', '📋', '#93c5fd')}
                        {simInput('Presupuesto variable', 'variable', '🛒', '#fcd34d')}
                        {simInput('Cuotas de deudas', 'debtPayments', '💳', '#fca5a5')}
                        {simInput('Depósito metas de ahorro', 'savingsGoals', '🎯', '#5eead4')}
                        {simInput('Depósito fondo emergencia', 'emergencyDeposit', '🚨', '#c084fc')}
                        {sim.customItems.filter(i=>i.type==='expense').map(item => (
                            <div key={item.id} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'0.625rem 0',borderBottom:'1px solid rgba(51,65,85,0.3)'}}>
                                <span className="text-sm">📌 {item.name}</span>
                                <div style={{display:'flex',alignItems:'center',gap:'0.5rem'}}>
                                    <span className="text-amber-300 font-semibold">${fmt(item.amount)}</span>
                                    <button onClick={()=>removeCustomItem(item.id)} className="delete-btn" style={{padding:'0.15rem 0.4rem',fontSize:'0.75rem'}}>✕</button>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            )}

            {/* ── DETAILED MODE ── */}
            {useRealExpenses && (
                <div className="card">
                    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'1rem'}}>
                        <h2 className="text-lg font-semibold">Todos los movimientos del mes</h2>
                        <div className="text-xs text-slate-500">{detailLines.length} líneas</div>
                    </div>
                    <div style={{maxHeight:'60vh',overflowY:'auto'}}>
                        {['income','fixed','variable','debt','savings','custom-expense'].map(type => {
                            const lines = detailLines.filter(l => l.type === type);
                            if (lines.length === 0) return null;
                            const cfg = typeConfig[type];
                            const groupTotal = lines.reduce((s,l)=>s+l.amount,0);
                            return (
                                <div key={type} style={{marginBottom:'1.25rem'}}>
                                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'0.5rem 0.75rem',background:'rgba(15,23,42,0.4)',borderRadius:'0.375rem',marginBottom:'0.375rem'}}>
                                        <span className="text-xs font-semibold" style={{color:cfg.color}}>{type==='income'?'💰 INGRESOS':type==='fixed'?'📋 GASTOS FIJOS':type==='variable'?'🛒 GASTOS VARIABLES':type==='debt'?'💳 DEUDAS':type==='savings'?'🏦 AHORRO':'📌 PERSONALIZADOS'}</span>
                                        <span className="text-sm font-bold" style={{color:cfg.color}}>{type==='income'?'+':'−'}${fmt(groupTotal)}</span>
                                    </div>
                                    {lines.map(line => (
                                        <div key={line.id} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'0.4rem 0.75rem',borderBottom:'1px solid rgba(51,65,85,0.2)',gap:'0.5rem'}}>
                                            <span className="text-sm" style={{flex:1,minWidth:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{line.name}</span>
                                            <div style={{display:'flex',alignItems:'center',gap:'0.375rem',flexShrink:0}}>
                                                <span className="text-xs text-slate-500">$</span>
                                                <input type="text" inputMode="decimal" value={line.amount}
                                                    onChange={e => { const v = e.target.value; if (/^[0-9]*[.,]?[0-9]*$/.test(v)) updateDetailLine(line.id, parseFloat(v.replace(',','.')) || 0); }}
                                                    className="input" style={{width:'6rem',textAlign:'right',color:cfg.color,padding:'0.25rem 0.5rem',fontSize:'0.8rem'}} />
                                                <button onClick={()=>removeDetailLine(line.id)} className="delete-btn" style={{padding:'0.15rem 0.35rem',fontSize:'0.7rem'}}>✕</button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            );
                        })}
                    </div>
                </div>
            )}

            {/* Add custom item */}
            <div className="card" style={{borderColor:'rgba(6,182,212,0.25)'}}>
                <h3 className="text-sm font-semibold text-cyan-400 mb-3">➕ Agregar ítem personalizado</h3>
                <div style={{display:'flex',gap:'0.5rem',flexWrap:'wrap',alignItems:'flex-end'}}>
                    <div>
                        <label className="text-xs text-slate-400" style={{display:'block',marginBottom:'0.25rem'}}>Tipo</label>
                        <select value={newItem.type} onChange={e=>setNewItem({...newItem,type:e.target.value})} className="input" style={{width:'8rem'}}>
                            <option value="expense">Gasto</option>
                            <option value="income">Ingreso</option>
                        </select>
                    </div>
                    <div>
                        <label className="text-xs text-slate-400" style={{display:'block',marginBottom:'0.25rem'}}>Descripción</label>
                        <input type="text" value={newItem.name} onChange={e=>setNewItem({...newItem,name:e.target.value})} className="input" placeholder="Ej: Seguro de vida" style={{width:'12rem'}} />
                    </div>
                    <div>
                        <label className="text-xs text-slate-400" style={{display:'block',marginBottom:'0.25rem'}}>Monto ($)</label>
                        <input type="text" inputMode="decimal" value={newItem.amount} onChange={e=>{const v=e.target.value;if(/^[0-9]*[.,]?[0-9]*$/.test(v))setNewItem({...newItem,amount:v.replace(',','.')})}} className="input" placeholder="0" style={{width:'7rem'}} />
                    </div>
                    <button onClick={addCustomItem} className="btn btn-primary" style={{fontSize:'0.85rem'}}>Agregar</button>
                </div>
            </div>

            {/* Waterfall */}
            <div className="card">
                <h2 className="text-lg font-semibold mb-4" style={{display:'flex',alignItems:'center',gap:'0.5rem'}}>
                    <span>📊</span> Desglose — ¿A dónde va tu plata?
                </h2>
                <div className="space-y-3">
                    {breakdownItems.map((b, idx) => (
                        <div key={idx}>
                            <div style={{display:'flex',justifyContent:'space-between',marginBottom:'0.25rem'}}>
                                <span className="text-sm">{b.label}</span>
                                <div style={{display:'flex',alignItems:'center',gap:'0.75rem'}}>
                                    <span className="text-xs text-slate-500">{totalIncome>0?Math.round((b.amount/totalIncome)*100):0}%</span>
                                    <span className="font-semibold text-sm" style={{color:b.color}}>−${fmt(b.amount)}</span>
                                </div>
                            </div>
                            <div style={{height:'0.375rem',background:'rgba(15,23,42,0.7)',borderRadius:'9999px',overflow:'hidden'}}>
                                <div style={{height:'100%',width:`${totalIncome>0?Math.min((b.amount/totalIncome)*100,100):0}%`,background:b.color,borderRadius:'9999px',transition:'width 0.4s'}} />
                            </div>
                        </div>
                    ))}
                    <div style={{borderTop:'1px solid #334155',paddingTop:'0.75rem',marginTop:'0.75rem'}}>
                        <div style={{display:'flex',justifyContent:'space-between',marginBottom:'0.25rem'}}>
                            <span className="text-sm font-bold">{freeBalance >= 0 ? '✅ Saldo Libre' : '🔴 Déficit'}</span>
                            <span className="font-bold" style={{color:freeBalance>=0?'#86efac':'#fca5a5'}}>{freeBalance>=0?'+':'−'}${fmt(Math.abs(freeBalance))}</span>
                        </div>
                        <div style={{height:'0.5rem',background:'rgba(15,23,42,0.7)',borderRadius:'9999px',overflow:'hidden'}}>
                            <div style={{height:'100%',width:`${Math.min(Math.abs(freePct),100)}%`,background:freeBalance>=0?'#22c55e':'#ef4444',borderRadius:'9999px',transition:'width 0.4s'}} />
                        </div>
                    </div>
                </div>
            </div>

            {/* KPIs */}
            <div className="grid grid-cols-1 md-grid-cols-3 gap-4">
                <div className="kpi-card">
                    <div className="text-xs text-slate-500 mb-1">💰 Si ahorraras el saldo libre</div>
                    <div className="text-xl font-serif font-bold text-green-300">${fmt(Math.max(0, freeBalance) * 12)}/año</div>
                </div>
                <div className="kpi-card">
                    <div className="text-xs text-slate-500 mb-1">📋 % comprometido</div>
                    <div className="text-xl font-serif font-bold" style={{color:totalIncome>0?((totalExpenses/totalIncome)*100>90?'#fca5a5':(totalExpenses/totalIncome)*100>75?'#fcd34d':'#86efac'):'#64748b'}}>
                        {totalIncome > 0 ? Math.round((totalExpenses/totalIncome)*100) : 0}%
                    </div>
                    <div className="text-xs text-slate-500 mt-1">Ideal: menos del 80%</div>
                </div>
                <div className="kpi-card">
                    <div className="text-xs text-slate-500 mb-1">⏳ Fondo emergencia</div>
                    {(() => {
                        const efTotal = (emergencyFund.housing||0)+(emergencyFund.utilities||0)+(emergencyFund.food||0)+(emergencyFund.transport||0)+(emergencyFund.health||0)+(emergencyFund.other||0);
                        const efTarget = efTotal * (emergencyFund.targetMonths||6);
                        const efRemaining = Math.max(0, efTarget - (emergencyFund.currentBalance||0));
                        const deposit = useRealExpenses ? detailLines.filter(l=>l.id==='sav-ef').reduce((s,l)=>s+l.amount,0) : sim.emergencyDeposit;
                        const months = deposit > 0 ? Math.ceil(efRemaining / deposit) : null;
                        return <div className="text-xl font-serif font-bold text-purple-400">{months !== null ? `${months} meses` : '—'}</div>;
                    })()}
                </div>
            </div>

            <div style={{padding:'0.75rem 1rem',background:'rgba(51,65,85,0.2)',borderRadius:'0.75rem',border:'1px solid rgba(51,65,85,0.3)'}}>
                <p className="text-xs text-slate-500">💡 Los cambios son solo simulación — no modifican tus datos reales. El modo detallado carga cada gasto y transacción real del mes para que puedas editarlos individualmente o agregar nuevos.</p>
            </div>
        </div>
    );
}

// ── RENDER ────────────────────────────────────────────────────────────
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<FinanceApp />);
    </script>
</body>
</html>
