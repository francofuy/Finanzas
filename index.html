                    <div style={{display:'flex',alignItems:'center',gap:'0.75rem'}}>
                        <div style={{width:'2.25rem',height:'2.25rem',borderRadius:'0.625rem',background:'linear-gradient(135deg,#22d3ee,#3b82f6)',display:'flex',alignItems:'center',justifyContent:'center'}}>
                            <span style={{fontSize:'1.25rem'}}>💰</span>
                        </div>
                        <div>
                            <h1 className="text-xl font-serif font-bold gradient-text">Finanzas Pro</h1>
                            <p className="text-xs text-slate-500">Tu asistente financiero inteligente</p>
                        </div>
                    </div>
                    <div style={{display:'flex',gap:'0.5rem'}}>
                        <input type="file" accept=".json" ref={fileInputRef} onChange={onImportJSON} style={{display:'none'}} />
                        <button onClick={()=>fileInputRef.current?.click()} className="btn btn-secondary" style={{fontSize:'0.8rem',padding:'0.375rem 0.75rem'}}>⬆️ Importar</button>
                        <button onClick={onExportJSON} className="btn btn-secondary" style={{fontSize:'0.8rem',padding:'0.375rem 0.75rem'}}>⬇️ JSON</button>
                        <button onClick={onExportXLSX} className="btn btn-primary" style={{fontSize:'0.8rem',padding:'0.375rem 0.75rem'}}>📊 Excel</button>
                    </div>
                </div>
                <nav style={{display:'flex',gap:'0.25rem',flexWrap:'wrap',alignItems:'center'}}>
                    {navBtn('dashboard','📊','Dashboard')}
                    {navBtn('transactions','💵','Transacciones')}
                    {navBtn('budget','🏷️','Presupuesto')}
                    {navBtn('goals','🎯','Metas')}
                    <div className="nav-divider" />
                    {navBtn('incomes','💰','Ingresos')}
                    {navBtn('fixed-expenses','📋','Gastos Fijos')}
                    {navBtn('cashflow','📅','Flujo Mensual')}
                    {navBtn('debts','💳','Deudas')}
                    {navBtn('emergency','🚨','Emergencia')}
                    <div className="nav-divider" />
                    {navBtn('simulator','🧮','Simulador')}
                </nav>
            </div>
        </header>
    );
}

// ── DASHBOARD ─────────────────────────────────────────────────────────
function Dashboard({ transactions, categories, budgets, currentMonth, incomes, fixedExpenses, debts, goals, emergencyFund }) {
    // All analytics are computed fresh on every render — alerts auto-clear when data changes
    const predictor = useMemo(() => new PredictionEngine(transactions, categories), [transactions, categories]);
    const analytics = useMemo(() => new SmartAnalytics(transactions, categories, budgets, incomes, fixedExpenses, debts, emergencyFund, currentMonth), [transactions, categories, budgets, incomes, fixedExpenses, debts, emergencyFund, currentMonth]);

    const now = new Date();
    const currentMonthNum = now.getMonth() + 1;
    const thisMonthTx = transactions.filter(t => t.date.startsWith(currentMonth));
    const totalSpent = thisMonthTx.filter(t => isVariableTx(t)).reduce((s,t)=>s+t.amount,0);
    const totalFixedPaid = thisMonthTx.filter(t => t.fixedExpenseId).reduce((s,t)=>s+t.amount,0);
    const totalIncomeTx = thisMonthTx.filter(t=>t.category==='income').reduce((s,t)=>s+t.amount,0);
    const totalIncomeFixed = incomes.length > 0 ? calcMonthlyIncome(incomes, currentMonthNum) : 0;
    const totalIncome = totalIncomeFixed + totalIncomeTx;
    const totalBudget = Object.values(budgets).reduce((s,b)=>s+b,0);
    const daysInMonth = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
    const daysRemaining = daysInMonth - now.getDate();
    const budgetRemaining = totalBudget - totalSpent;
    const canSpendToday = daysRemaining > 0 ? Math.round(budgetRemaining / daysRemaining) : 0;

    const alerts = predictor.generateAlerts(budgets, currentMonth);
    const health = analytics.healthScore();
    const anomalies = analytics.detectAnomalies();
    const insights = analytics.generateInsights();
    const prediction = analytics.predictMonthEnd();

    const monthlyFixed = calcMonthlyFixed(fixedExpenses);
    const needsAmt = thisMonthTx.filter(t=>NEEDS_CATS.includes(t.category) && !t.fixedExpenseId).reduce((s,t)=>s+t.amount,0) + monthlyFixed;
    const wantsAmt = thisMonthTx.filter(t=>WANTS_CATS.includes(t.category) && !t.fixedExpenseId).reduce((s,t)=>s+t.amount,0);
    const savingsAmt = thisMonthTx.filter(t=>t.category==='savings').reduce((s,t)=>s+t.amount,0) + debts.reduce((s,d)=>s+(d.payment||0),0);
    const needsPct = totalIncome > 0 ? (needsAmt/totalIncome)*100 : 0;
    const wantsPct = totalIncome > 0 ? (wantsAmt/totalIncome)*100 : 0;
    const savingsPct = totalIncome > 0 ? (savingsAmt/totalIncome)*100 : 0;

    const ruleBar = (label, pct, target, color) => {
        const over = pct > target;
        const fillColor = over ? '#ef4444' : pct > target*0.85 ? '#f59e0b' : color;
        return (
            <div style={{marginBottom:'0.875rem'}}>
                <div style={{display:'flex',justifyContent:'space-between',marginBottom:'0.375rem'}}>
                    <span className="text-sm font-medium">{label}</span>
                    <div style={{display:'flex',gap:'0.75rem',alignItems:'center'}}>
                        <span style={{fontSize:'0.75rem',color:'#64748b'}}>Objetivo: {target}%</span>
                        <span style={{fontSize:'0.875rem',fontWeight:700,color: over?'#fca5a5':fillColor}}>{fmtDec(pct)}%</span>
                    </div>
                </div>
                <div className="rule-bar-track">
                    <div className="rule-bar-fill" style={{width:`${Math.min(pct,100)}%`,background:fillColor}}>
                        {pct >= 8 && `${Math.round(pct)}%`}
                    </div>
                    <div style={{position:'absolute',top:0,bottom:0,left:`${target}%`,width:'2px',background:'rgba(255,255,255,0.3)'}} />
                </div>
            </div>
        );
    };

    const totalDebt = debts.reduce((s,d)=>s+(d.balance||0),0);
    const monthlyDebtPayment = debts.reduce((s,d)=>s+(d.payment||0),0);

    // Health score arc
    const scoreArc = (score, color) => {
        const r = 54, cx = 60, cy = 60;
        const startAngle = -225, endAngle = 45;
        const range = endAngle - startAngle;
        const angle = startAngle + (score / 100) * range;
        const toRad = a => (a * Math.PI) / 180;
        const x1 = cx + r * Math.cos(toRad(startAngle));
        const y1 = cy + r * Math.sin(toRad(startAngle));
        const x2 = cx + r * Math.cos(toRad(angle));
        const y2 = cy + r * Math.sin(toRad(angle));
        const largeArc = (angle - startAngle) > 180 ? 1 : 0;
        return (
            <svg viewBox="0 0 120 120" style={{width:'120px',height:'120px'}}>
                <path d={`M ${cx+r*Math.cos(toRad(startAngle))} ${cy+r*Math.sin(toRad(startAngle))} A ${r} ${r} 0 1 1 ${cx+r*Math.cos(toRad(endAngle))} ${cy+r*Math.sin(toRad(endAngle))}`} fill="none" stroke="rgba(51,65,85,0.5)" strokeWidth="8" strokeLinecap="round" />
                {score > 0 && <path d={`M ${x1} ${y1} A ${r} ${r} 0 ${largeArc} 1 ${x2} ${y2}`} fill="none" stroke={color} strokeWidth="8" strokeLinecap="round" />}
                <text x={cx} y={cy-4} textAnchor="middle" fill={color} fontSize="26" fontWeight="700" fontFamily="'Crimson Pro',serif">{score}</text>
                <text x={cx} y={cy+14} textAnchor="middle" fill="#94a3b8" fontSize="9">de 100</text>
            </svg>
        );
    };

    return (
        <div className="space-y-6">
            <div className="hero-card">
                <div style={{position:'relative',zIndex:1}}>
                    <div style={{display:'flex',alignItems:'center',gap:'0.5rem',marginBottom:'0.5rem'}}>
                        <span style={{fontSize:'1.25rem'}}>⚡</span>
                        <span className="text-sm text-cyan-400 font-medium">Podés gastar hoy</span>
                    </div>
                    <div className="text-6xl font-serif font-bold gradient-text">${fmt(Math.max(0, canSpendToday))}</div>
                    <div style={{marginTop:'1rem',display:'flex',gap:'1.5rem',flexWrap:'wrap'}} className="text-sm">
                        <div><span className="text-slate-400">Gasto variable:</span><span className="ml-2 text-slate-200 font-semibold">${fmt(totalSpent)}</span></div>
                        <div><span className="text-slate-400">Gastos fijos pagados:</span><span className="ml-2 text-purple-400 font-semibold">${fmt(totalFixedPaid)}</span></div>
                        <div><span className="text-slate-400">Presupuesto variable:</span><span className="ml-2 text-slate-200 font-semibold">${fmt(totalBudget)}</span></div>
                        <div><span className="text-slate-400">Días restantes:</span><span className="ml-2 text-slate-200 font-semibold">{daysRemaining}</span></div>
                        {totalIncome > 0 && <div><span className="text-slate-400">Ingreso total:</span><span className="ml-2 text-green-300 font-semibold">${fmt(totalIncome)}</span>{totalIncomeTx > 0 && totalIncomeFixed > 0 && <span className="text-xs text-slate-500 ml-1">(fijo: ${fmt(totalIncomeFixed)} + extra: ${fmt(totalIncomeTx)})</span>}</div>}
                    </div>
                    {prediction && (
                        <div style={{marginTop:'0.75rem',padding:'0.5rem 0.75rem',background: prediction.willExceed ? 'rgba(239,68,68,0.1)' : 'rgba(34,197,94,0.1)',border:`1px solid ${prediction.willExceed?'rgba(239,68,68,0.2)':'rgba(34,197,94,0.2)'}`,borderRadius:'0.5rem',display:'inline-flex',alignItems:'center',gap:'0.5rem'}}>
                            <span>{prediction.willExceed ? '📉' : '📈'}</span>
                            <span className="text-xs" style={{color:prediction.willExceed?'#fca5a5':'#86efac'}}>
                                Proyección fin de mes: ${fmt(prediction.projected)} ({prediction.willExceed ? `$${fmt(prediction.excess)} sobre presupuesto` : 'dentro del presupuesto'})
                            </span>
                        </div>
                    )}
                </div>
            </div>

            {/* KPI Cards */}
            <div className="grid grid-cols-1 md-grid-cols-4 gap-4">
                <div className="kpi-card">
                    <div className="text-xs text-slate-500 mb-1">Balance Neto</div>
                    <div className="text-2xl font-serif font-bold" style={{color:totalIncome-totalSpent-totalFixedPaid>=0?'#86efac':'#fca5a5'}}>${fmt(totalIncome-totalSpent-totalFixedPaid)}</div>
                    <div className="text-xs mt-1" style={{color:totalIncome-totalSpent-totalFixedPaid>=0?'#22c55e':'#ef4444'}}>{totalIncome-totalSpent-totalFixedPaid>=0?'📈 Positivo':'📉 Negativo'}</div>
                </div>
                <div className="kpi-card">
                    <div className="text-xs text-slate-500 mb-1">Total Ingresos</div>
                    <div className="text-2xl font-serif font-bold text-green-300">${fmt(totalIncome)}</div>
                    <div className="text-xs text-slate-500 mt-1">{totalIncomeFixed>0?`Fijo: $${fmt(totalIncomeFixed)}`:''}{totalIncomeTx>0?`${totalIncomeFixed>0?' + ':''}Extra: $${fmt(totalIncomeTx)}`:''}{totalIncome===0?'sin ingresos':''}</div>
                </div>
                <div className="kpi-card">
                    <div className="text-xs text-slate-500 mb-1">Total Deudas</div>
                    <div className="text-2xl font-serif font-bold text-red-300">${fmt(totalDebt)}</div>
                    <div className="text-xs text-slate-500 mt-1">Cuota: ${fmt(monthlyDebtPayment)}/mes</div>
                </div>
                <div className="kpi-card">
                    <div className="text-xs text-slate-500 mb-1">Gasto Variable</div>
                    <div className="text-2xl font-serif font-bold text-cyan-400">${fmt(totalSpent)}</div>
                    <div className="text-xs text-slate-500 mt-1">Fijos: ${fmt(monthlyFixed)}/mes · Pagados: ${fmt(totalFixedPaid)}</div>
                </div>
            </div>

            {/* Health Score + Alerts row */}
            <div className="grid grid-cols-1 md-grid-cols-2 gap-6">
                {/* Health Score */}
                <div className="card">
                    <div style={{display:'flex',alignItems:'center',gap:'0.5rem',marginBottom:'1rem'}}>
                        <span style={{fontSize:'1.25rem'}}>🧠</span>
                        <h2 className="text-lg font-semibold">Salud Financiera</h2>
                        <span className="badge" style={{background:`${health.color}22`,color:health.color}}>{health.label}</span>
                    </div>
                    <div style={{display:'flex',alignItems:'center',gap:'1.5rem'}}>
                        {scoreArc(health.total, health.color)}
                        <div style={{flex:1}} className="space-y-3">
                            {health.scores.map(s => (
                                <div key={s.name}>
                                    <div style={{display:'flex',justifyContent:'space-between',marginBottom:'0.2rem'}}>
                                        <span className="text-xs text-slate-400">{s.icon} {s.name}</span>
                                        <span className="text-xs font-semibold" style={{color:s.score>=s.max*0.7?'#86efac':s.score>=s.max*0.4?'#fcd34d':'#fca5a5'}}>{s.score}/{s.max}</span>
                                    </div>
                                    <div style={{height:'4px',background:'rgba(15,23,42,0.7)',borderRadius:'9999px',overflow:'hidden'}}>
                                        <div style={{height:'100%',width:`${(s.score/s.max)*100}%`,background:s.score>=s.max*0.7?'#22c55e':s.score>=s.max*0.4?'#f59e0b':'#ef4444',borderRadius:'9999px',transition:'width 0.5s'}} />
                                    </div>
                                    {s.note && <span className="text-xs text-slate-500">{s.note}</span>}
                                </div>
                            ))}
                        </div>
                    </div>
                </div>

                {/* Alerts — REACTIVE: auto-clear when resolved */}
                <div className="card">
                    <div style={{display:'flex',alignItems:'center',gap:'0.5rem',marginBottom:'1rem'}}>
                        <span style={{fontSize:'1.25rem'}}>🔔</span>
                        <h2 className="text-lg font-semibold">Alertas</h2>
                        {alerts.length > 0 ? <span className="badge badge-red">{alerts.length}</span> : <span className="badge badge-green">0</span>}
                    </div>
                    {alerts.length > 0 ? (
                        <div className="space-y-3">
                            {alerts.slice(0,5).map((alert,idx) => (
                                <div key={`${alert.category}-${alert.type}`} className={`alert alert-${alert.type}`}>
                                    <span>{alert.type==='danger'?'🔴':alert.type==='warning'?'🟡':'🔵'}</span>
                                    <span className="text-sm">{alert.message}</span>
                                </div>
                            ))}
                        </div>
                    ) : (
                        <div style={{textAlign:'center',padding:'2rem 0'}}>
                            <div style={{fontSize:'2.5rem',marginBottom:'0.75rem'}}>✅</div>
                            <p className="text-slate-400 text-sm">Todo en orden. Seguís dentro del presupuesto.</p>
                            <p className="text-xs text-slate-500 mt-1">Las alertas aparecen y desaparecen automáticamente según tus gastos.</p>
                        </div>
                    )}
                </div>
            </div>

            <div className="grid grid-cols-1 md-grid-cols-2 gap-6">
                {/* Regla 50/30/20 */}
                <div className="card">
                    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'1.25rem'}}>
                        <div style={{display:'flex',alignItems:'center',gap:'0.5rem'}}>
                            <span style={{fontSize:'1.25rem'}}>⚖️</span>
                            <h2 className="text-lg font-semibold">Regla 50/30/20</h2>
                        </div>
                        {totalIncome === 0 && <span className="badge badge-amber">Configura ingresos</span>}
                    </div>
                    {totalIncome > 0 ? (
                        <div>
                            {ruleBar('🏠 Necesidades', needsPct, 50, '#60a5fa')}
                            {ruleBar('🎬 Deseos', wantsPct, 30, '#c084fc')}
                            {ruleBar('🏦 Ahorro / Deuda', savingsPct, 20, '#22c55e')}
                            <div className="text-xs text-slate-500 mt-3" style={{borderTop:'1px solid #1e293b',paddingTop:'0.75rem'}}>
                                La línea blanca marca el objetivo. Rojo = por encima del límite recomendado.
                            </div>
                        </div>
                    ) : (
                        <div style={{textAlign:'center',padding:'2rem 0'}}>
                            <div style={{fontSize:'2.5rem',marginBottom:'0.75rem'}}>📊</div>
                            <p className="text-slate-400 text-sm">Registrá tus ingresos en la sección <strong className="text-cyan-400">Ingresos</strong> para ver este análisis.</p>
                        </div>
                    )}
                </div>

                {/* Smart Insights */}
                <div className="card">
                    <div style={{display:'flex',alignItems:'center',gap:'0.5rem',marginBottom:'1rem'}}>
                        <span style={{fontSize:'1.25rem'}}>💡</span>
                        <h2 className="text-lg font-semibold">Insights Inteligentes</h2>
                    </div>
                    {insights.length > 0 ? (
                        <div className="space-y-3">
                            {insights.map((insight, idx) => {
                                const colors = { warning:'rgba(245,158,11,0.1)', danger:'rgba(239,68,68,0.1)', success:'rgba(34,197,94,0.1)', info:'rgba(59,130,246,0.1)', tip:'rgba(6,182,212,0.1)' };
                                const borders = { warning:'rgba(245,158,11,0.2)', danger:'rgba(239,68,68,0.2)', success:'rgba(34,197,94,0.2)', info:'rgba(59,130,246,0.2)', tip:'rgba(6,182,212,0.2)' };
                                const textColors = { warning:'#fcd34d', danger:'#fca5a5', success:'#86efac', info:'#93c5fd', tip:'#22d3ee' };
                                return (
                                    <div key={idx} style={{padding:'0.625rem 0.75rem',background:colors[insight.type]||colors.info,border:`1px solid ${borders[insight.type]||borders.info}`,borderRadius:'0.5rem',display:'flex',alignItems:'flex-start',gap:'0.5rem'}}>
                                        <span style={{flexShrink:0}}>{insight.icon}</span>
                                        <span className="text-xs" style={{color:textColors[insight.type]||textColors.info,lineHeight:1.5}}>{insight.text}</span>
                                    </div>
                                );
                            })}
                        </div>
                    ) : (
                        <div style={{textAlign:'center',padding:'2rem 0'}}>
                            <div style={{fontSize:'2.5rem',marginBottom:'0.75rem'}}>🤖</div>
                            <p className="text-slate-400 text-sm">Agregá transacciones e ingresos para recibir insights personalizados.</p>
                        </div>
                    )}
                </div>
            </div>

            {/* Anomalies */}
            {anomalies.length > 0 && (
                <div className="card">
                    <div style={{display:'flex',alignItems:'center',gap:'0.5rem',marginBottom:'1rem'}}>
                        <span style={{fontSize:'1.25rem'}}>🔍</span>
                        <h2 className="text-lg font-semibold">Gastos Inusuales Detectados</h2>
                        <span className="badge badge-amber">{anomalies.length}</span>
                    </div>
                    <p className="text-xs text-slate-500 mb-4">Transacciones que son significativamente más altas que tu promedio en esa categoría.</p>
                    <div className="space-y-3">
                        {anomalies.map((a, idx) => (
                            <div key={idx} style={{padding:'0.75rem',background:'rgba(245,158,11,0.05)',border:'1px solid rgba(245,158,11,0.15)',borderRadius:'0.5rem',display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:'0.5rem'}}>
                                <div>
                                    <div className="font-medium text-sm">{a.tx.description}</div>
                                    <div className="text-xs text-slate-500">{a.catName} · {new Date(a.tx.date+'T12:00:00').toLocaleDateString('es')}</div>
                                </div>
                                <div style={{textAlign:'right'}}>
                                    <div className="font-bold text-amber-300">${fmt(a.tx.amount)}</div>
                                    <div className="text-xs text-slate-500">Promedio: ${fmt(a.mean)} ({a.pctAbove}% mayor)</div>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            )}

            {/* Quick start if no data */}
            {transactions.length === 0 && incomes.length === 0 && (
                <div className="card">
                    <h2 className="text-lg font-semibold mb-4">🚀 Primeros pasos</h2>
                    <div className="space-y-3">
                        <div style={{padding:'1rem',background:'rgba(6,182,212,0.1)',border:'1px solid rgba(6,182,212,0.2)',borderRadius:'0.5rem'}}>
                            <div style={{display:'flex',alignItems:'center',gap:'0.5rem',marginBottom:'0.5rem'}}><span>💰</span><span className="font-semibold text-cyan-400">1. Registrá tus ingresos</span></div>
                            <p className="text-sm text-slate-300">Ve a "Ingresos" y agrega tu sueldo y otras fuentes de ingreso.</p>
                        </div>
                        <div style={{padding:'1rem',background:'rgba(59,130,246,0.1)',border:'1px solid rgba(59,130,246,0.2)',borderRadius:'0.5rem'}}>
                            <div style={{display:'flex',alignItems:'center',gap:'0.5rem',marginBottom:'0.5rem'}}><span>📋</span><span className="font-semibold text-blue-400">2. Configurá gastos fijos</span></div>
                            <p className="text-sm text-slate-300">Alquiler, servicios, suscripciones — los gastos que se repiten cada mes.</p>
                        </div>
                        <div style={{padding:'1rem',background:'rgba(139,92,246,0.1)',border:'1px solid rgba(139,92,246,0.2)',borderRadius:'0.5rem'}}>
                            <div style={{display:'flex',alignItems:'center',gap:'0.5rem',marginBottom:'0.5rem'}}><span>💵</span><span className="font-semibold text-purple-400">3. Registrá transacciones</span></div>
                            <p className="text-sm text-slate-300">Llevá el registro de tus gastos variables del día a día.</p>
                        </div>
                    </div>
                </div>
            )}
        </div>
    );
}

// ── TRANSACTIONS VIEW ─────────────────────────────────────────────────
function TransactionsView({ transactions, categories, fixedExpenses, budgets, onAdd, onDelete, onEdit, onAddCategory }) {
    const [showForm, setShowForm] = useState(false);
    const [editingTx, setEditingTx] = useState(null);
    const [formData, setFormData] = useState({ description:'', amount:'', category:'', date: new Date().toISOString().split('T')[0], fixedExpenseId:'' });
    const [showNewCat, setShowNewCat] = useState(false);
    const [newCat, setNewCat] = useState({ name:'', icon:'📌', color:'#64748b' });
    const formRef = React.useRef(null);

    const openNew = () => {
        setEditingTx(null);
        setFormData({ description:'', amount:'', category:'', date: new Date().toISOString().split('T')[0], fixedExpenseId:'' });
        setShowForm(true);
    };
    const openNewFromFixed = (exp) => {
        setEditingTx(null);
        setFormData({ description: exp.name, amount: String(exp.amount), category:'', date: new Date().toISOString().split('T')[0], fixedExpenseId: exp.id });
        setShowForm(true);
        setTimeout(() => formRef.current?.scrollIntoView({ behavior:'smooth', block:'nearest' }), 100);
    };
    const openEdit = (tx) => {
        setEditingTx(tx.id);
        setFormData({ description: tx.description, amount: String(tx.amount), category: tx.category, date: tx.date, fixedExpenseId: tx.fixedExpenseId || '' });
        setShowForm(true);
        setTimeout(() => formRef.current?.scrollIntoView({ behavior:'smooth', block:'nearest' }), 100);
    };
    const handleFixedSelect = (expId) => {
        if (expId) {
            const exp = fixedExpenses.find(e => e.id === expId);
            if (exp) {
                setFormData({ ...formData, fixedExpenseId: expId, description: exp.name, amount: String(exp.amount) });
                return;
            }
        }
        setFormData({ ...formData, fixedExpenseId: '' });
    };
    const handleSubmit = (e) => {
        e.preventDefault();
        const parsed = parseFloat(formData.amount);
        if (isNaN(parsed) || parsed <= 0) return;
        const txData = {...formData, amount: parsed};
        if (!txData.fixedExpenseId) delete txData.fixedExpenseId;
        if (editingTx) {
            onEdit(editingTx, txData);
        } else {
            onAdd(txData);
        }
        setFormData({ description:'', amount:'', category:'', date: new Date().toISOString().split('T')[0], fixedExpenseId:'' });
        setShowForm(false);
        setEditingTx(null);
    };
    const handleCancel = () => { setShowForm(false); setEditingTx(null); };
    const handleAddCategory = () => {
        if (!newCat.name.trim()) return;
        const id = newCat.name.toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,'');
        onAddCategory({ id, name: newCat.name, icon: newCat.icon, color: newCat.color });
        setNewCat({ name:'', icon:'📌', color:'#64748b' });
        setShowNewCat(false);
    };

    const openNewIncome = () => {
        setEditingTx(null);
        setFormData({ description:'', amount:'', category:'income', date: new Date().toISOString().split('T')[0], fixedExpenseId:'' });
        setShowForm(true);
        setTimeout(() => formRef.current?.scrollIntoView({ behavior:'smooth', block:'nearest' }), 100);
    };

    // Check which fixed expenses have been paid this month
    const currentMonth = new Date().toISOString().substring(0,7);
    const paidFixedIds = new Set(transactions.filter(t => t.fixedExpenseId && t.date.startsWith(currentMonth)).map(t => t.fixedExpenseId));
    const monthlyFixed = fixedExpenses.filter(e => e.frequency === 'monthly');
    const unpaidFixed = monthlyFixed.filter(e => !paidFixedIds.has(e.id));

    // Income summary this month
    const incomeTxThisMonth = transactions.filter(t => t.category === 'income' && t.date.startsWith(currentMonth));
    const totalIncomeTxMonth = incomeTxThisMonth.reduce((s,t)=>s+t.amount,0);

    return (
        <div className="space-y-6">
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:'0.5rem'}}>
                <h1 className="text-3xl font-serif font-bold">Transacciones</h1>
                <div style={{display:'flex',gap:'0.5rem'}}>
                    <button onClick={openNewIncome} className="btn" style={{background:'rgba(34,197,94,0.15)',color:'#86efac',border:'1px solid rgba(34,197,94,0.3)'}}>💵 Ingreso Extra</button>
                    <button onClick={openNew} className="btn btn-primary">➕ Nuevo Gasto</button>
                </div>
            </div>

            {/* Extra income summary */}
            {totalIncomeTxMonth > 0 && (
                <div style={{padding:'0.75rem 1rem',background:'rgba(34,197,94,0.08)',border:'1px solid rgba(34,197,94,0.2)',borderRadius:'0.75rem',display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:'0.5rem'}}>
                    <div style={{display:'flex',alignItems:'center',gap:'0.5rem'}}>
                        <span>💵</span>
                        <span className="text-sm text-green-300">Ingresos extra este mes: <strong>${fmt(totalIncomeTxMonth)}</strong></span>
                        <span className="text-xs text-slate-500">({incomeTxThisMonth.length} registros)</span>
                    </div>
                </div>
            )}

            {/* Unpaid fixed expenses reminder */}
            {unpaidFixed.length > 0 && (
                <div className="card" style={{borderColor:'rgba(245,158,11,0.3)'}}>
                    <div style={{display:'flex',alignItems:'center',gap:'0.5rem',marginBottom:'0.75rem'}}>
                        <span style={{fontSize:'1.1rem'}}>📋</span>
                        <h3 className="font-semibold text-sm">Gastos Fijos pendientes de registrar este mes</h3>
                        <span className="badge badge-amber">{unpaidFixed.length}</span>
                    </div>
                    <div style={{display:'flex',gap:'0.5rem',flexWrap:'wrap'}}>
                        {unpaidFixed.map(exp => (
                            <button key={exp.id} onClick={() => openNewFromFixed(exp)}
                                style={{padding:'0.4rem 0.75rem',background:'rgba(245,158,11,0.1)',border:'1px solid rgba(245,158,11,0.25)',borderRadius:'0.5rem',color:'#fcd34d',cursor:'pointer',fontSize:'0.8rem',display:'flex',alignItems:'center',gap:'0.375rem',transition:'all 0.2s'}}
                                onMouseOver={e=>e.currentTarget.style.background='rgba(245,158,11,0.2)'}
                                onMouseOut={e=>e.currentTarget.style.background='rgba(245,158,11,0.1)'}>
                                <span>＋</span> {exp.name} <span className="text-slate-400">${fmt(exp.amount)}</span>
                            </button>
                        ))}
                    </div>
                    <p className="text-xs text-slate-500 mt-2">Hacé click para registrar el pago. Se vincula al gasto fijo y no se cuenta doble.</p>
                </div>
            )}

            {/* Spending Breakdown Chart - outside fixed/variable */}
            {(() => {
                const monthTx = transactions.filter(t => t.date.startsWith(currentMonth) && !['income','savings'].includes(t.category));
                if (monthTx.length === 0) return null;
                const budgeted = monthTx.filter(t => !t.fixedExpenseId && budgets[t.category] > 0);
                const fixedPaid = monthTx.filter(t => t.fixedExpenseId);
                const unbudgeted = monthTx.filter(t => !t.fixedExpenseId && !budgets[t.category]);
                const budgetedAmt = budgeted.reduce((s,t)=>s+t.amount,0);
                const fixedPaidAmt = fixedPaid.reduce((s,t)=>s+t.amount,0);
                const unbudgetedAmt = unbudgeted.reduce((s,t)=>s+t.amount,0);
                const totalAmt = budgetedAmt + fixedPaidAmt + unbudgetedAmt;
                if (totalAmt === 0) return null;
                // Group unbudgeted by category
                const unbudgetedByCat = {};
                unbudgeted.forEach(t => {
                    const cat = categories.find(c=>c.id===t.category) || {name:t.category,icon:'📦',color:'#64748b'};
                    if (!unbudgetedByCat[t.category]) unbudgetedByCat[t.category] = { cat, total: 0, count: 0 };
                    unbudgetedByCat[t.category].total += t.amount;
                    unbudgetedByCat[t.category].count++;
                });
                return (
                    <div className="card">
                        <div style={{display:'flex',alignItems:'center',gap:'0.5rem',marginBottom:'1rem'}}>
                            <span style={{fontSize:'1.1rem'}}>📊</span>
                            <h3 className="font-semibold text-sm">Distribución de gastos este mes</h3>
                        </div>
                        {/* Stacked bar */}
                        <div style={{height:'1.5rem',display:'flex',borderRadius:'0.5rem',overflow:'hidden',border:'1px solid rgba(51,65,85,0.5)',marginBottom:'0.75rem'}}>
                            {budgetedAmt > 0 && <div style={{width:`${(budgetedAmt/totalAmt)*100}%`,background:'#3b82f6',minWidth:'2px'}} />}
                            {fixedPaidAmt > 0 && <div style={{width:`${(fixedPaidAmt/totalAmt)*100}%`,background:'#8b5cf6',minWidth:'2px'}} />}
                            {unbudgetedAmt > 0 && <div style={{width:`${(unbudgetedAmt/totalAmt)*100}%`,background:'#f59e0b',minWidth:'2px'}} />}
                        </div>
                        <div style={{display:'flex',gap:'1rem',flexWrap:'wrap',marginBottom: unbudgetedAmt > 0 ? '1rem' : 0}}>
                            <div className="text-xs"><span style={{color:'#3b82f6'}}>■</span> Presupuestado: <strong>${fmt(budgetedAmt)}</strong> ({Math.round((budgetedAmt/totalAmt)*100)}%)</div>
                            <div className="text-xs"><span style={{color:'#8b5cf6'}}>■</span> Gasto fijo: <strong>${fmt(fixedPaidAmt)}</strong> ({Math.round((fixedPaidAmt/totalAmt)*100)}%)</div>
                            <div className="text-xs"><span style={{color:'#f59e0b'}}>■</span> Sin presupuesto: <strong>${fmt(unbudgetedAmt)}</strong> ({Math.round((unbudgetedAmt/totalAmt)*100)}%)</div>
                        </div>
                        {/* Unbudgeted detail */}
                        {Object.keys(unbudgetedByCat).length > 0 && (
                            <div style={{padding:'0.75rem',background:'rgba(245,158,11,0.05)',border:'1px solid rgba(245,158,11,0.15)',borderRadius:'0.5rem'}}>
                                <div className="text-xs font-semibold text-amber-300 mb-2">Gastos sin presupuesto asignado:</div>
                                {Object.values(unbudgetedByCat).sort((a,b)=>b.total-a.total).map(g => (
                                    <div key={g.cat.name} style={{display:'flex',justifyContent:'space-between',padding:'0.3rem 0',borderBottom:'1px solid rgba(51,65,85,0.2)'}}>
                                        <span className="text-xs text-slate-300">{g.cat.icon} {g.cat.name} ({g.count})</span>
                                        <span className="text-xs font-semibold text-amber-300">${fmt(g.total)}</span>
                                    </div>
                                ))}
                                <p className="text-xs text-slate-500 mt-2">💡 Considerá asignarle un presupuesto a estas categorías en la sección Presupuesto.</p>
                            </div>
                        )}
                    </div>
                );
            })()}

            {showForm && (
                <div className="card" ref={formRef}>
                    <h3 className="font-semibold mb-4">{editingTx ? '✏️ Editar Transacción' : formData.category==='income' ? '💵 Registrar Ingreso Extra' : '➕ Nueva Transacción'}</h3>
                    <form onSubmit={handleSubmit} className="space-y-4">
                        {/* Fixed expense link */}
                        {fixedExpenses.length > 0 && (
                            <div style={{padding:'0.75rem',background: formData.fixedExpenseId ? 'rgba(139,92,246,0.1)' : 'rgba(30,41,59,0.3)',border:`1px solid ${formData.fixedExpenseId?'rgba(139,92,246,0.3)':'rgba(51,65,85,0.3)'}`,borderRadius:'0.5rem'}}>
                                <label className="text-xs text-slate-400 mb-2" style={{display:'block'}}>📋 ¿Es un pago de gasto fijo?</label>
                                <select value={formData.fixedExpenseId} onChange={e=>handleFixedSelect(e.target.value)} className="input">
                                    <option value="">No — es un gasto variable</option>
                                    {fixedExpenses.map(exp=><option key={exp.id} value={exp.id}>{exp.name} — ${fmt(exp.amount)} ({exp.frequency==='monthly'?'Mensual':exp.frequency==='annual'?'Anual':MONTHS_SHORT[(exp.paymentMonth||1)-1]})</option>)}
                                </select>
                                {formData.fixedExpenseId && <p className="text-xs text-purple-400 mt-1">✓ Este pago se vinculará al gasto fijo y no se contará como gasto variable</p>}
                            </div>
                        )}
                        <div className="grid grid-cols-1 md-grid-cols-2 gap-4">
                            <div><label className="text-sm text-slate-400 mb-2" style={{display:'block'}}>Descripción</label><input type="text" value={formData.description} onChange={e=>setFormData({...formData,description:e.target.value})} className="input" required /></div>
                            <div><label className="text-sm text-slate-400 mb-2" style={{display:'block'}}>Monto ($)</label><input type="text" inputMode="decimal" value={formData.amount} onChange={e=>{const v=e.target.value;if(/^[0-9]*[.,]?[0-9]*$/.test(v))setFormData({...formData,amount:v.replace(',','.')})}} className="input" required placeholder="0.00" /></div>
                            <div>
                                <label className="text-sm text-slate-400 mb-2" style={{display:'block'}}>Categoría</label>
                                <div style={{display:'flex',gap:'0.5rem'}}>
                                    <select value={formData.category} onChange={e=>setFormData({...formData,category:e.target.value})} className="input" style={{flex:1}}>
                                        <option value="">Auto-categorizar</option>
                                        {categories.map(c=><option key={c.id} value={c.id}>{c.icon} {c.name}</option>)}
                                    </select>
                                    <button type="button" onClick={()=>setShowNewCat(!showNewCat)} className="btn btn-secondary" title="Nueva categoría" style={{padding:'0.5rem 0.625rem'}}>＋</button>
                                </div>
                            </div>
                            <div><label className="text-sm text-slate-400 mb-2" style={{display:'block'}}>Fecha</label><input type="date" value={formData.date} onChange={e=>setFormData({...formData,date:e.target.value})} className="input" required /></div>
                        </div>
                        {showNewCat && (
                            <div style={{padding:'1rem',background:'rgba(6,182,212,0.05)',border:'1px solid rgba(6,182,212,0.2)',borderRadius:'0.5rem'}}>
                                <div className="text-sm font-semibold text-cyan-400 mb-3">Nueva Categoría</div>
                                <div style={{display:'flex',gap:'0.5rem',flexWrap:'wrap',alignItems:'flex-end'}}>
                                    <div><label className="text-xs text-slate-400" style={{display:'block',marginBottom:'0.25rem'}}>Nombre</label><input type="text" value={newCat.name} onChange={e=>setNewCat({...newCat,name:e.target.value})} className="input" placeholder="Ej: Mascotas" style={{width:'10rem'}} /></div>
                                    <div><label className="text-xs text-slate-400" style={{display:'block',marginBottom:'0.25rem'}}>Icono</label><input type="text" value={newCat.icon} onChange={e=>setNewCat({...newCat,icon:e.target.value})} className="input" style={{width:'4rem',textAlign:'center'}} /></div>
                                    <div><label className="text-xs text-slate-400" style={{display:'block',marginBottom:'0.25rem'}}>Color</label><input type="color" value={newCat.color} onChange={e=>setNewCat({...newCat,color:e.target.value})} style={{width:'3rem',height:'2.25rem',border:'none',background:'transparent',cursor:'pointer'}} /></div>
                                    <button type="button" onClick={handleAddCategory} className="btn btn-primary" style={{fontSize:'0.8rem'}}>Crear</button>
                                    <button type="button" onClick={()=>setShowNewCat(false)} className="btn btn-secondary" style={{fontSize:'0.8rem'}}>Cancelar</button>
                                </div>
                            </div>
                        )}
                        <div style={{display:'flex',gap:'0.75rem'}}>
                            <button type="submit" className="btn btn-primary">{editingTx ? '✓ Guardar' : 'Agregar'}</button>
                            <button type="button" onClick={handleCancel} className="btn btn-secondary">Cancelar</button>
                        </div>
                    </form>
                </div>
            )}
            <div className="card">
                {transactions.length === 0 ? (
                    <div style={{textAlign:'center',padding:'3rem'}}><div style={{fontSize:'3rem',marginBottom:'1rem'}}>📭</div><p className="text-slate-400">No hay transacciones todavía</p></div>
                ) : (
                    <div style={{overflowX:'auto'}}>
                        <table>
                            <thead><tr><th>FECHA</th><th>DESCRIPCIÓN</th><th>CATEGORÍA</th><th style={{textAlign:'right'}}>MONTO</th><th style={{textAlign:'center'}}>ACCIONES</th></tr></thead>
                            <tbody>
                                {transactions.slice(0,50).map(tx => {
                                    const cat = categories.find(c=>c.id===tx.category)||{name:tx.category,icon:'📦'};
                                    const linkedFixed = tx.fixedExpenseId ? fixedExpenses.find(e=>e.id===tx.fixedExpenseId) : null;
                                    const isIncome = tx.category === 'income';
                                    const hasBudget = budgets[tx.category] > 0;
                                    return (
                                        <tr key={tx.id} style={linkedFixed?{borderLeft:'3px solid rgba(139,92,246,0.5)'}:isIncome?{borderLeft:'3px solid rgba(34,197,94,0.5)'}:{}}>
                                            <td className="text-sm text-slate-300">{new Date(tx.date+'T12:00:00').toLocaleDateString('es')}</td>
                                            <td className="text-sm">
                                                {tx.description}
                                                {tx.autoCategorized&&<span className="badge badge-cyan ml-2">Auto</span>}
                                                {linkedFixed&&<span className="badge badge-purple ml-2">📋 Fijo</span>}
                                                {isIncome&&<span className="badge badge-green ml-2">💵 Ingreso</span>}
                                                {!isIncome && !linkedFixed && hasBudget && <span className="badge badge-blue ml-2">🏷️ Presupuestado</span>}
                                                {!isIncome && !linkedFixed && !hasBudget && tx.category !== 'savings' && <span className="badge badge-amber ml-2">Sin presupuesto</span>}
                                            </td>
                                            <td className="text-sm">{cat.icon} {cat.name}</td>
                                            <td style={{textAlign:'right'}}><span className="text-xl font-serif font-semibold" style={{color:isIncome?'#86efac':linkedFixed?'#c084fc':'#22d3ee'}}>{isIncome?'+':''}${fmt(tx.amount)}</span></td>
                                            <td style={{textAlign:'center'}}>
                                                <div style={{display:'flex',gap:'0.5rem',justifyContent:'center'}}>
                                                    <button onClick={()=>openEdit(tx)} className="edit-btn">✏️</button>
                                                    <button onClick={()=>{if(window.confirm('¿Eliminar?'))onDelete(tx.id)}} className="delete-btn">🗑️</button>
                                                </div>
                                            </td>
                                        </tr>
                                    );
                                })}
                            </tbody>
                        </table>
                    </div>
                )}
            </div>
        </div>
    );
}

// ── BUDGET VIEW ───────────────────────────────────────────────────────
function BudgetView({ budgets, categories, transactions, currentMonth, onUpdate, onAddCategory }) {
    const [editCategory, setEditCategory] = useState(null);
    const [editAmount, setEditAmount] = useState('');
    const [showNewCat, setShowNewCat] = useState(false);
    const [newCat, setNewCat] = useState({ name:'', icon:'📌', color:'#64748b' });
    const thisMonthTx = transactions.filter(t=>t.date.startsWith(currentMonth));
    const categoryStats = categories.filter(c=>!['income','savings'].includes(c.id)).map(cat=>{
        const spent = thisMonthTx.filter(t=>t.category===cat.id && !t.fixedExpenseId).reduce((s,t)=>s+t.amount,0);
        const budget = budgets[cat.id]||0;
        return {...cat, spent, budget, percentage: budget>0?Math.round((spent/budget)*100):0};
    }).sort((a,b)=>b.spent-a.spent);
    const handleSave = () => { onUpdate(editCategory, parseFloat(editAmount)); setEditCategory(null); setEditAmount(''); };
    const handleAddCategory = () => {
        if (!newCat.name.trim()) return;
        const id = newCat.name.toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,'');
        onAddCategory({ id, name: newCat.name, icon: newCat.icon, color: newCat.color });
        setNewCat({ name:'', icon:'📌', color:'#64748b' });
        setShowNewCat(false);
    };
    return (
        <div className="space-y-6">
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:'0.75rem'}}>
                <h1 className="text-3xl font-serif font-bold">Presupuesto Mensual</h1>
                <button onClick={()=>setShowNewCat(!showNewCat)} className="btn btn-secondary">＋ Nueva Categoría</button>
            </div>
            {showNewCat && (
                <div className="card" style={{borderColor:'rgba(6,182,212,0.3)'}}>
                    <div className="text-sm font-semibold text-cyan-400 mb-3">Nueva Categoría</div>
                    <div style={{display:'flex',gap:'0.5rem',flexWrap:'wrap',alignItems:'flex-end'}}>
                        <div><label className="text-xs text-slate-400" style={{display:'block',marginBottom:'0.25rem'}}>Nombre</label><input type="text" value={newCat.name} onChange={e=>setNewCat({...newCat,name:e.target.value})} className="input" placeholder="Ej: Mascotas" style={{width:'10rem'}} /></div>
                        <div><label className="text-xs text-slate-400" style={{display:'block',marginBottom:'0.25rem'}}>Icono</label><input type="text" value={newCat.icon} onChange={e=>setNewCat({...newCat,icon:e.target.value})} className="input" style={{width:'4rem',textAlign:'center'}} /></div>
                        <div><label className="text-xs text-slate-400" style={{display:'block',marginBottom:'0.25rem'}}>Color</label><input type="color" value={newCat.color} onChange={e=>setNewCat({...newCat,color:e.target.value})} style={{width:'3rem',height:'2.25rem',border:'none',background:'transparent',cursor:'pointer'}} /></div>
                        <button onClick={handleAddCategory} className="btn btn-primary" style={{fontSize:'0.8rem'}}>Crear</button>
                        <button onClick={()=>setShowNewCat(false)} className="btn btn-secondary" style={{fontSize:'0.8rem'}}>Cancelar</button>
                    </div>
                </div>
            )}
            <div className="grid gap-4">
                {categoryStats.map(cat=>(
                    <div key={cat.id} className="card">
                        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:'1rem',marginBottom:'1rem'}}>
                            <div style={{display:'flex',alignItems:'center',gap:'0.75rem'}}>
                                <div style={{fontSize:'2rem'}}>{cat.icon}</div>
                                <div><div className="font-semibold text-lg">{cat.name}</div><div className="text-sm text-slate-400">{cat.budget>0?`${cat.percentage}% usado`:'Sin presupuesto'}</div></div>
                            </div>
                            <div style={{display:'flex',alignItems:'center',gap:'1rem'}}>
                                <div style={{textAlign:'right'}}><div className="text-2xl font-serif font-bold text-cyan-400">${fmt(cat.spent)}</div><div className="text-sm text-slate-400">de ${fmt(cat.budget)}</div></div>
                                {editCategory===cat.id ? (
                                    <div style={{display:'flex',gap:'0.5rem'}}><input type="number" value={editAmount} onChange={e=>setEditAmount(e.target.value)} className="input" style={{width:'8rem'}} autoFocus /><button onClick={handleSave} className="btn btn-primary">✓</button></div>
                                ) : (
                                    <button onClick={()=>{setEditCategory(cat.id);setEditAmount(cat.budget.toString())}} className="btn btn-secondary">Editar</button>
                                )}
                            </div>
                        </div>
                        {cat.budget>0&&<div className="progress-bar"><div className={`progress-fill ${cat.percentage>100?'danger':cat.percentage>80?'warning':''}`} style={{width:`${Math.min(cat.percentage,100)}%`}} /></div>}
                    </div>
                ))}
            </div>
        </div>
    );
}

// ── GOALS VIEW ────────────────────────────────────────────────────────
function GoalsView({ goals, onAdd, onUpdateGoal, onDeleteGoal }) {
    const [showForm, setShowForm] = useState(false);
    const [formData, setFormData] = useState({name:'',target:'',deadline:''});
    const [addingTo, setAddingTo] = useState(null);
    const [addAmount, setAddAmount] = useState('');
    const handleSubmit = (e) => { e.preventDefault(); onAdd({...formData,target:parseFloat(formData.target)}); setFormData({name:'',target:'',deadline:''}); setShowForm(false); };
    const handleAddMoney = (goalId) => { if(!addAmount||parseFloat(addAmount)<=0)return; onUpdateGoal(goalId,parseFloat(addAmount)); setAddingTo(null); setAddAmount(''); };
    const handleDelete = (goalId, name) => { if(window.confirm(`¿Eliminar la meta "${name}"?`)) onDeleteGoal(goalId); };
    return (
        <div className="space-y-6">
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                <h1 className="text-3xl font-serif font-bold">Metas de Ahorro</h1>
                <button onClick={()=>setShowForm(!showForm)} className="btn btn-primary">➕ Nueva Meta</button>
            </div>
            {showForm&&(
                <div className="card">
                    <form onSubmit={handleSubmit} className="space-y-4">
                        <div className="grid grid-cols-1 md-grid-cols-3 gap-4">
                            <div><label className="text-sm text-slate-400 mb-2" style={{display:'block'}}>Nombre</label><input type="text" value={formData.name} onChange={e=>setFormData({...formData,name:e.target.value})} className="input" required /></div>
                            <div><label className="text-sm text-slate-400 mb-2" style={{display:'block'}}>Monto</label><input type="number" value={formData.target} onChange={e=>setFormData({...formData,target:e.target.value})} className="input" required /></div>
                            <div><label className="text-sm text-slate-400 mb-2" style={{display:'block'}}>Fecha límite</label><input type="date" value={formData.deadline} onChange={e=>setFormData({...formData,deadline:e.target.value})} className="input" required /></div>
                        </div>
                        <button type="submit" className="btn btn-primary">Crear Meta</button>
                    </form>
                </div>
            )}

// ── CASH FLOW CHART (SVG) ─────────────────────────────────────────────
function CashFlowChart({ chartData }) {
    const W=760, H=280, padL=65, padR=15, padT=20, padB=50;
    const cW=W-padL-padR, cH=H-padT-padB;
    const slotW=cW/12;
    const barW=10, barGap=3, groupW=3*barW+2*barGap, groupOff=(slotW-groupW)/2;

    const maxInc = Math.max(...chartData.map(d=>d.income),1);
    const maxExp = Math.max(...chartData.map(d=>d.fixed+d.variable),1);
    const maxVal = Math.max(maxInc, maxExp, 1);

    const scaleY = (v) => Math.max(0, (v/maxVal)*cH);
    const barY = (v) => padT + cH - scaleY(v);

    const fmtK = (v) => v>=1000?`${(v/1000).toFixed(0)}k`:`${v}`;

    const balancePoints = chartData.map((d,i)=>{
        const bx = padL + i*slotW + slotW/2;
        const by = padT + cH - scaleY(Math.max(0, d.income - d.fixed - d.variable));
        return `${bx},${by}`;
    }).join(' ');

    return (
        <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:'auto',display:'block'}}>
            {/* Grid lines */}
            {[0,0.25,0.5,0.75,1].map(pct=>{
                const y=padT+cH*(1-pct);
                return (
                    <g key={pct}>
                        <line x1={padL} y1={y} x2={W-padR} y2={y} stroke="rgba(71,85,105,0.35)" strokeWidth={1} strokeDasharray={pct===0?'':'4,4'} />
                        <text x={padL-6} y={y+4} textAnchor="end" fill="#64748b" fontSize={10}>{fmtK(Math.round(maxVal*pct))}</text>
                    </g>
                );
            })}

            {/* Bars */}
            {chartData.map((d,i)=>{
                const x0=padL+i*slotW+groupOff;
                const incH=scaleY(d.income);
                const fixH=scaleY(d.fixed);
                const varH=scaleY(d.variable);
                const alpha=d.isProjected?0.45:1;
                const cx=padL+i*slotW+slotW/2;
                return (
                    <g key={i}>
                        {/* Income */}
                        {incH>0&&<rect x={x0} y={barY(d.income)} width={barW} height={incH} fill={`rgba(34,197,94,${alpha})`} rx={2} />}
                        {/* Fixed */}
                        {fixH>0&&<rect x={x0+barW+barGap} y={barY(d.fixed)} width={barW} height={fixH} fill={`rgba(96,165,250,${alpha})`} rx={2} />}
                        {/* Variable */}
                        {varH>0&&<rect x={x0+2*(barW+barGap)} y={barY(d.variable)} width={barW} height={varH} fill={`rgba(249,115,22,${alpha})`} rx={2} />}
                        {/* Projected marker */}
                        {d.isProjected&&<text x={cx} y={padT+cH+15} textAnchor="middle" fill="#334155" fontSize={8}>~</text>}
                        {/* Month label */}
                        <text x={cx} y={H-padB+20} textAnchor="middle" fill={d.isCurrentMonth?'#22d3ee':'#64748b'} fontSize={10} fontWeight={d.isCurrentMonth?700:400}>{d.month}</text>
                    </g>
                );
            })}

            {/* Balance line */}
            <polyline points={balancePoints} fill="none" stroke="#fbbf24" strokeWidth={2} strokeLinejoin="round" />
            {chartData.map((d,i)=>{
                const bal=d.income-d.fixed-d.variable;
                const bx=padL+i*slotW+slotW/2;
                const by=padT+cH-scaleY(Math.max(0,bal));
                return <circle key={i} cx={bx} cy={by} r={3} fill="#fbbf24" />;
            })}
        </svg>
    );
}

// ── CASH FLOW VIEW ────────────────────────────────────────────────────
function CashFlowView({ incomes, fixedExpenses, transactions, budgets, currentMonth }) {
    const now = new Date();
    const year = now.getFullYear();
    const currentMonthNum = now.getMonth() + 1;
    const totalBudget = Object.values(budgets).reduce((s,b)=>s+b,0);

    const chartData = useMemo(() => {
        let cumBal = 0;
        return Array.from({length:12},(_,i)=>{
            const mn=i+1;
            const ms=`${year}-${String(mn).padStart(2,'0')}`;
            const inc = (incomes.length>0 ? calcMonthlyIncome(incomes,mn) : 0) +
                transactions.filter(t=>t.date.startsWith(ms)&&t.category==='income').reduce((s,t)=>s+t.amount,0);
            const actualVar = transactions.filter(t=>t.date.startsWith(ms)&&isVariableTx(t)).reduce((s,t)=>s+t.amount,0);
            const variable = mn<=currentMonthNum ? actualVar : (totalBudget||actualVar);
            const fixed = calcFixedForMonth(fixedExpenses, mn);
            const isProjected = mn > currentMonthNum;
            const isCurrentMonth = mn === currentMonthNum;
            const bal = inc - fixed - variable;
            cumBal += bal;
            return {month:MONTHS_SHORT[i], monthNum:mn, income:Math.round(inc), fixed:Math.round(fixed), variable:Math.round(variable), balance:Math.round(bal), cumBalance:Math.round(cumBal), isProjected, isCurrentMonth};
        });
    }, [incomes, fixedExpenses, transactions, budgets, year, currentMonthNum, totalBudget]);

    const annualInc=chartData.reduce((s,d)=>s+d.income,0);
    const annualFixed=chartData.reduce((s,d)=>s+d.fixed,0);
    const annualVar=chartData.reduce((s,d)=>s+d.variable,0);
    const annualBal=chartData.reduce((s,d)=>s+d.balance,0);

    return (
        <div className="space-y-6">
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:'1rem'}}>
                <h1 className="text-3xl font-serif font-bold">📅 Flujo de Caja {year}</h1>
                <div style={{display:'flex',gap:'0.5rem',flexWrap:'wrap'}}>
                    {incomes.length===0&&<span className="badge badge-amber">⚠️ Configura ingresos para mejor precisión</span>}
                    {fixedExpenses.length===0&&<span className="badge badge-blue">💡 Agrega gastos fijos</span>}
                </div>
            </div>

            {/* Summary KPIs */}
            <div className="grid grid-cols-1 md-grid-cols-4 gap-4">
                <div className="kpi-card"><div className="text-xs text-slate-500 mb-1">Ingresos anuales</div><div className="text-xl font-serif font-bold text-green-300">${fmt(annualInc)}</div></div>
                <div className="kpi-card"><div className="text-xs text-slate-500 mb-1">Gastos Fijos anuales</div><div className="text-xl font-serif font-bold text-blue-300">${fmt(annualFixed)}</div></div>
                <div className="kpi-card"><div className="text-xs text-slate-500 mb-1">Gastos Var. anuales</div><div className="text-xl font-serif font-bold text-amber-300">${fmt(annualVar)}</div></div>
                <div className="kpi-card"><div className="text-xs text-slate-500 mb-1">Balance anual</div><div className="text-xl font-serif font-bold" style={{color:annualBal>=0?'#86efac':'#fca5a5'}}>${fmt(annualBal)}</div></div>
            </div>

            {/* Chart */}
            <div className="card">
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'1rem',flexWrap:'wrap',gap:'0.75rem'}}>
                    <h2 className="text-lg font-semibold">Comparativa Mensual</h2>
                    <div className="chart-legend">
                        <div className="legend-item"><div className="legend-dot" style={{background:'rgba(34,197,94,0.85)'}} /><span>Ingresos</span></div>
                        <div className="legend-item"><div className="legend-dot" style={{background:'rgba(96,165,250,0.85)'}} /><span>Gastos Fijos</span></div>
                        <div className="legend-item"><div className="legend-dot" style={{background:'rgba(249,115,22,0.85)'}} /><span>Gastos Variables</span></div>
                        <div className="legend-item"><div className="legend-line" style={{background:'#fbbf24',borderRadius:1}} /><span>Saldo Libre</span></div>
                        <div className="legend-item"><span style={{opacity:0.5,fontSize:'0.7rem'}}>~ proyectado</span></div>
                    </div>
                </div>
                <div className="chart-container">
                    <CashFlowChart chartData={chartData} />
                </div>
            </div>

            {/* Detail table */}
            <div className="card" style={{overflowX:'auto'}}>
                <h2 className="text-lg font-semibold mb-4">Detalle Mensual</h2>
                <table className="cashflow-table">
                    <thead>
                        <tr>
                            <th>MES</th>
                            {chartData.map(d=><th key={d.month} style={{color:d.isCurrentMonth?'#22d3ee':undefined}}>{d.month}{d.isProjected?' *':''}</th>)}
                            <th>ANUAL</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td style={{color:'#86efac'}}>💚 Ingresos</td>
                            {chartData.map(d=><td key={d.month} className={d.isProjected?'projected':''} style={{color:'#86efac'}}>{d.income>0?`$${fmt(d.income)}`:'-'}</td>)}
                            <td style={{color:'#86efac',fontWeight:700}}>${fmt(annualInc)}</td>
                        </tr>
                        <tr>
                            <td style={{color:'#93c5fd'}}>🔵 G. Fijos</td>
                            {chartData.map(d=><td key={d.month} className={d.isProjected?'projected':''} style={{color:'#93c5fd'}}>{d.fixed>0?`$${fmt(d.fixed)}`:'-'}</td>)}
                            <td style={{color:'#93c5fd',fontWeight:700}}>${fmt(annualFixed)}</td>
                        </tr>
                        <tr>
                            <td style={{color:'#fdba74'}}>🟠 G. Variables</td>
                            {chartData.map(d=><td key={d.month} className={d.isProjected?'projected':''} style={{color:'#fdba74'}}>{d.variable>0?`$${fmt(d.variable)}`:'-'}</td>)}
                            <td style={{color:'#fdba74',fontWeight:700}}>${fmt(annualVar)}</td>
                        </tr>
                        <tr className="total-row">
                            <td>⚡ Saldo Libre</td>
                            {chartData.map(d=><td key={d.month} style={{color:d.balance>=0?'#86efac':'#fca5a5',fontWeight:600}}>{d.balance>=0?'+':''}{d.balance!==0?`$${fmt(d.balance)}`:'-'}</td>)}
                            <td style={{color:annualBal>=0?'#86efac':'#fca5a5'}}>{annualBal>=0?'+':''}{`$${fmt(annualBal)}`}</td>
                        </tr>
                        <tr className="total-row">
                            <td>📈 Acumulado</td>
                            {chartData.map(d=><td key={d.month} style={{color:'#c084fc',fontWeight:600}}>${fmt(d.cumBalance)}</td>)}
                            <td style={{color:'#c084fc'}}>${fmt(chartData[11]?.cumBalance)}</td>
                        </tr>
                    </tbody>
                </table>
                <p className="text-xs text-slate-500 mt-3">* Meses proyectados usando presupuesto configurado. Los pasados usan datos reales de transacciones.</p>
            </div>
        </div>
    );
}

// ── DEBTS VIEW ────────────────────────────────────────────────────────
function DebtsView({ debts, onSave }) {
    const [strategy, setStrategy] = useState('avalanche');
    const [showForm, setShowForm] = useState(false);
    const [editId, setEditId] = useState(null);
    const emptyForm = {name:'',type:'Tarjeta crédito',balance:'',payment:'',rate:'',notes:''};
    const [form, setForm] = useState(emptyForm);

    const DEBT_TYPES = ['Tarjeta crédito','Préstamo personal','Hipoteca','Prendario (auto)','Familiar/amigo','Consumo','Otro'];

    const sorted = [...debts].sort((a,b)=>{
        if(strategy==='avalanche') return (b.rate||0)-(a.rate||0);
        return (a.balance||0)-(b.balance||0);
    });

    const totalBalance=debts.reduce((s,d)=>s+(d.balance||0),0);
    const totalPayment=debts.reduce((s,d)=>s+(d.payment||0),0);
    const totalInterestAnnual=debts.reduce((s,d)=>s+(d.balance||0)*(d.rate||0)/100,0);

    const handleSubmit = () => {
        if(!form.name||!form.balance) return;
        const debt = {id:editId||Date.now().toString(),...form,balance:parseFloat(form.balance)||0,payment:parseFloat(form.payment)||0,rate:parseFloat(form.rate)||0};
        onSave(editId?debts.map(d=>d.id===editId?debt:d):[...debts,debt]);
        resetForm();
    };
    const handleEdit = (d) => { setEditId(d.id); setForm({name:d.name,type:d.type,balance:String(d.balance),payment:String(d.payment),rate:String(d.rate),notes:d.notes||''}); setShowForm(true); };
    const handleDelete = (id) => { if(window.confirm('¿Eliminar esta deuda?')) onSave(debts.filter(d=>d.id!==id)); };
    const resetForm = () => { setShowForm(false); setEditId(null); setForm(emptyForm); };

    return (
        <div className="space-y-6">
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                <h1 className="text-3xl font-serif font-bold">💳 Deudas</h1>
                <button onClick={()=>{resetForm();setShowForm(true)}} className="btn btn-primary">➕ Agregar</button>
            </div>

            {/* KPIs */}
            <div className="grid grid-cols-1 md-grid-cols-3 gap-4">
                <div className="kpi-card"><div className="text-xs text-slate-500 mb-1">Deuda Total</div><div className="text-2xl font-serif font-bold text-red-300">${fmt(totalBalance)}</div></div>
                <div className="kpi-card"><div className="text-xs text-slate-500 mb-1">Cuota Mensual Total</div><div className="text-2xl font-serif font-bold text-amber-300">${fmt(totalPayment)}</div></div>
                <div className="kpi-card"><div className="text-xs text-slate-500 mb-1">Intereses Anuales Est.</div><div className="text-2xl font-serif font-bold text-red-300">${fmt(totalInterestAnnual)}</div></div>
            </div>

            {showForm && (
                <div className="card">
                    <h3 className="font-semibold mb-4">{editId?'Editar Deuda':'Nueva Deuda'}</h3>
                    <div className="grid grid-cols-1 md-grid-cols-2 gap-4">
                        <div><label className="text-sm text-slate-400 mb-2" style={{display:'block'}}>Nombre / Acreedor</label><input type="text" value={form.name} onChange={e=>setForm({...form,name:e.target.value})} className="input" placeholder="Ej: Tarjeta BBVA" /></div>
                        <div><label className="text-sm text-slate-400 mb-2" style={{display:'block'}}>Tipo</label><select value={form.type} onChange={e=>setForm({...form,type:e.target.value})} className="input">{DEBT_TYPES.map(t=><option key={t} value={t}>{t}</option>)}</select></div>
                        <div><label className="text-sm text-slate-400 mb-2" style={{display:'block'}}>Saldo Actual ($)</label><input type="number" value={form.balance} onChange={e=>setForm({...form,balance:e.target.value})} className="input" /></div>
                        <div><label className="text-sm text-slate-400 mb-2" style={{display:'block'}}>Cuota Mensual ($)</label><input type="number" value={form.payment} onChange={e=>setForm({...form,payment:e.target.value})} className="input" /></div>
                        <div><label className="text-sm text-slate-400 mb-2" style={{display:'block'}}>Tasa Interés Anual (%)</label><input type="number" step="0.1" value={form.rate} onChange={e=>setForm({...form,rate:e.target.value})} className="input" placeholder="Ej: 120" /></div>
                        <div><label className="text-sm text-slate-400 mb-2" style={{display:'block'}}>Notas</label><input type="text" value={form.notes} onChange={e=>setForm({...form,notes:e.target.value})} className="input" /></div>
                    </div>
                    <div style={{display:'flex',gap:'0.75rem',marginTop:'1rem'}}>
                        <button onClick={handleSubmit} className="btn btn-primary">{editId?'✓ Actualizar':'✓ Agregar'}</button>
                        <button onClick={resetForm} className="btn btn-secondary">Cancelar</button>
                    </div>
                </div>
            )}

            {debts.length===0 ? (
                <div className="card" style={{textAlign:'center',padding:'3rem'}}>
                    <div style={{fontSize:'3rem',marginBottom:'1rem'}}>💳</div>
                    <p className="text-slate-400 mb-2">No hay deudas registradas.</p>
                    <p className="text-sm text-slate-500">Registrá tarjetas, préstamos e hipotecas para ver la estrategia de pago óptima.</p>
                </div>
            ) : (
                <div className="card">
                    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'1.25rem',flexWrap:'wrap',gap:'1rem'}}>
                        <div>
                            <h2 className="text-lg font-semibold mb-1">Estrategia de Pago</h2>
                            <p className="text-xs text-slate-500">El orden de prioridad para liquidar deudas antes:</p>
                        </div>
                        <div style={{display:'flex',gap:'0.5rem'}}>
                            <button onClick={()=>setStrategy('avalanche')} className={`strategy-btn${strategy==='avalanche'?' active':''}`}>🌊 Avalancha</button>
                            <button onClick={()=>setStrategy('snowball')} className={`strategy-btn${strategy==='snowball'?' active':''}`}>☃️ Bola de Nieve</button>
                        </div>
                    </div>

                    <div style={{padding:'0.75rem',background:'rgba(6,182,212,0.05)',border:'1px solid rgba(6,182,212,0.15)',borderRadius:'0.5rem',marginBottom:'1.25rem'}}>
                        {strategy==='avalanche'
                            ? <p className="text-xs text-cyan-400">🌊 <strong>Avalancha:</strong> Pagá el mínimo a todas y volcá el extra a la de <strong>MAYOR tasa</strong>. Ahorrás más en intereses totales.</p>
                            : <p className="text-xs text-cyan-400">☃️ <strong>Bola de Nieve:</strong> Pagá el mínimo a todas y volcá el extra a la de <strong>MENOR saldo</strong>. Más motivación al cerrar deudas rápido.</p>
                        }
                    </div>

                    <div className="space-y-4">
                        {sorted.map((d,idx)=>{
                            const months=calcPayoffMonths(d.balance,d.payment,d.rate);
                            const monthlyInterest=(d.balance||0)*(d.rate||0)/100/12;
                            const principalPayment=(d.payment||0)-monthlyInterest;
                            const pctToInterest=d.payment>0?(monthlyInterest/d.payment)*100:0;
                            return (
                                <div key={d.id} style={{padding:'1rem',background:'rgba(15,23,42,0.4)',border:'1px solid rgba(51,65,85,0.5)',borderRadius:'0.75rem'}}>
                                    <div style={{display:'flex',alignItems:'flex-start',gap:'0.75rem'}}>
                                        <div className="debt-rank">{idx+1}</div>
                                        <div style={{flex:1}}>
                                            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:'0.5rem',marginBottom:'0.75rem'}}>
                                                <div>
                                                    <div className="font-semibold">{d.name}</div>
                                                    <span className="badge badge-purple text-xs">{d.type}</span>
                                                </div>
                                                <div style={{display:'flex',gap:'0.5rem'}}>
                                                    <button onClick={()=>handleEdit(d)} className="edit-btn">✏️</button>
                                                    <button onClick={()=>handleDelete(d.id)} className="delete-btn">🗑️</button>
                                                </div>
                                            </div>
                                            <div className="grid grid-cols-1 md-grid-cols-4 gap-3">
                                                <div><div className="text-xs text-slate-500">Saldo</div><div className="font-bold text-red-300">${fmt(d.balance)}</div></div>
                                                <div><div className="text-xs text-slate-500">Cuota/mes</div><div className="font-semibold">${fmt(d.payment)}</div></div>
                                                <div><div className="text-xs text-slate-500">Tasa anual</div><div className="font-semibold text-amber-300">{d.rate||0}%</div></div>
                                                <div>
                                                    <div className="text-xs text-slate-500">Meses restantes</div>
                                                    <div className="font-semibold" style={{color:months===Infinity?'#fca5a5':months?'#86efac':'#64748b'}}>
                                                        {months===null?'—':months===Infinity?'∞ (cuota insuficiente)':months}
                                                    </div>
                                                </div>
                                            </div>
                                            {d.payment>0&&d.rate>0&&(
                                                <div style={{marginTop:'0.75rem'}}>
                                                    <div style={{display:'flex',justifyContent:'space-between',marginBottom:'0.25rem'}}>
                                                        <span className="text-xs text-slate-500">De tu cuota: ${fmt(monthlyInterest)} a intereses / ${fmt(principalPayment)} a capital</span>
                                                        <span className="text-xs text-slate-500">{Math.round(pctToInterest)}% → intereses</span>
                                                    </div>
                                                    <div style={{height:'0.375rem',background:'rgba(15,23,42,0.7)',borderRadius:'9999px',overflow:'hidden'}}>
                                                        <div style={{height:'100%',width:`${Math.min(pctToInterest,100)}%`,background:'#ef4444',borderRadius:'9999px'}} />
                                                    </div>
                                                </div>
                                            )}
                                            {d.notes&&<div className="text-xs text-slate-500 mt-2">{d.notes}</div>}
                                        </div>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            )}
        </div>
    );
}
