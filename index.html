<div id="root"></div>
<script>
// Prevent scroll when interacting with number inputs
document.addEventListener('wheel', function(e) {
    if (document.activeElement && (document.activeElement.type === 'number' || document.activeElement.inputMode === 'decimal')) {
        e.preventDefault();
        document.activeElement.blur();
    }
}, { passive: false });
// Prevent scroll jump on input focus in mobile
document.addEventListener('focus', function(e) {
    if (e.target.tagName === 'INPUT' && (e.target.type === 'number' || e.target.inputMode === 'decimal')) {
        setTimeout(() => { window.scrollTo(window.scrollX, window.scrollY); }, 50);
    }
}, true);
</script>
<script type="text/babel">
const { useState, useEffect, useMemo } = React;

// ── STORAGE ──────────────────────────────────────────────────────────
const storage = {
    get(key) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; } catch(e) { return null; } },
    set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); return true; } catch(e) { return false; } },
    list(prefix) { try { const k = []; for (let i = 0; i < localStorage.length; i++) { const key = localStorage.key(i); if (key.startsWith(prefix)) k.push(key); } return k; } catch(e) { return []; } }
};

// ── ML CATEGORIZER ────────────────────────────────────────────────────
class MLCategorizer {
    constructor() { this.patterns = {}; this.history = []; }
    train(transaction, category) {
        const key = this.extractFeatures(transaction);
        if (!this.patterns[key]) this.patterns[key] = {};
        this.patterns[key][category] = (this.patterns[key][category] || 0) + 1;
        this.history.push({ transaction, category, timestamp: Date.now() });
        if (this.history.length > 1000) this.history = this.history.slice(-1000);
        storage.set('ml-model', { patterns: this.patterns, history: this.history.slice(-100) });
    }
    extractFeatures(transaction) {
        const desc = transaction.description.toLowerCase();
        const words = desc.split(/\s+/).filter(w => w.length > 3);
        const amount = Math.round(transaction.amount / 10) * 10;
        const day = new Date(transaction.date).getDay();
        return `${words.slice(0, 2).join('_')}_${amount}_${day}`;
    }
    predict(transaction) {
        const key = this.extractFeatures(transaction);
        const matches = this.patterns[key];
        if (!matches) {
            const desc = transaction.description.toLowerCase();
            for (const hist of this.history.slice(-50)) {
                if (hist.transaction.description.toLowerCase().includes(desc.slice(0, 5))) return { category: hist.category, confidence: 0.6 };
            }
            return { category: 'other', confidence: 0.0 };
        }
        const total = Object.values(matches).reduce((a, b) => a + b, 0);
        const best = Object.entries(matches).sort((a, b) => b[1] - a[1])[0];
        return { category: best[0], confidence: best[1] / total };
    }
    load() { const m = storage.get('ml-model'); if (m) { this.patterns = m.patterns || {}; this.history = m.history || []; } }
}

// ── PREDICTION ENGINE (FIXED ALERTS) ─────────────────────────────────
class PredictionEngine {
    constructor(transactions, categories) { this.transactions = transactions; this.categories = categories || []; }
    getCatName(catId) {
        const c = this.categories.find(c => c.id === catId);
        return c ? `${c.icon} ${c.name}` : catId;
    }
    generateAlerts(budgets, currentMonth) {
        const alerts = [];
        const now = new Date();
        const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
        const progressPct = now.getDate() / daysInMonth;
        Object.entries(budgets).forEach(([category, limit]) => {
            if (!limit || limit <= 0) return; // Skip categories without budget
            const spent = this.transactions.filter(t => t.category === category && t.date.startsWith(currentMonth)).reduce((s, t) => s + t.amount, 0);
            const spentPct = spent / limit;
            const catName = this.getCatName(category);
            if (spentPct > 1.0) {
                alerts.push({ type: 'danger', category, message: `Excediste el presupuesto de ${catName} en $${fmt(spent - limit)}`, severity: 'high' });
            } else if (spentPct > 0.9) {
                alerts.push({ type: 'warning', category, message: `${catName} al ${Math.round(spentPct * 100)}% del presupuesto`, severity: 'medium' });
            } else if (spentPct > progressPct + 0.15) {
                alerts.push({ type: 'info', category, message: `${catName}: vas ${Math.round((spentPct - progressPct) * 100)}% por encima del ritmo`, severity: 'low' });
            }
            // ✅ No alert if under budget = alert disappears automatically
        });
        return alerts.sort((a, b) => ({ high: 3, medium: 2, low: 1 }[b.severity] - { high: 3, medium: 2, low: 1 }[a.severity]));
    }
}

// ── SMART ANALYTICS ENGINE ───────────────────────────────────────────
class SmartAnalytics {
    constructor(transactions, categories, budgets, incomes, fixedExpenses, debts, emergencyFund, currentMonth) {
        this.tx = transactions;
        this.cats = categories;
        this.budgets = budgets;
        this.incomes = incomes;
        this.fixed = fixedExpenses;
        this.debts = debts;
        this.ef = emergencyFund;
        this.cm = currentMonth;
        this.now = new Date();
        this.monthNum = this.now.getMonth() + 1;
    }

    // ── Financial Health Score (0-100) ──
    healthScore() {
        const scores = [];
        const incomeFromTx = this.tx.filter(t => t.date.startsWith(this.cm) && t.category === 'income').reduce((s,t)=>s+t.amount,0);
        const totalIncome = (this.incomes.length > 0 ? calcMonthlyIncome(this.incomes, this.monthNum) : 0) + incomeFromTx;
        const monthlyFixed = calcMonthlyFixed(this.fixed);
        const thisMonthTx = this.tx.filter(t => t.date.startsWith(this.cm));
        const totalSpent = thisMonthTx.filter(t => isVariableTx(t)).reduce((s,t)=>s+t.amount,0);

        // 1. Budget adherence (25 pts)
        const totalBudget = Object.values(this.budgets).reduce((s,b)=>s+b,0);
        if (totalBudget > 0) {
            const ratio = Math.min(totalSpent / totalBudget, 2);
            scores.push({ name: 'Presupuesto', score: Math.round(Math.max(0, (1 - Math.max(0, ratio - 0.7) / 0.6)) * 25), max: 25, icon: '🎯' });
        } else {
            scores.push({ name: 'Presupuesto', score: 0, max: 25, icon: '🎯', note: 'Configurá presupuestos' });
        }

        // 2. Savings rate (25 pts)
        if (totalIncome > 0) {
            const savingsRate = Math.max(0, (totalIncome - totalSpent - monthlyFixed) / totalIncome);
            scores.push({ name: 'Tasa de ahorro', score: Math.round(Math.min(savingsRate / 0.2, 1) * 25), max: 25, icon: '💰' });
        } else {
            scores.push({ name: 'Tasa de ahorro', score: 0, max: 25, icon: '💰', note: 'Configurá ingresos' });
        }

        // 3. Emergency fund (25 pts)
        const efTotal = (this.ef.housing||0)+(this.ef.utilities||0)+(this.ef.food||0)+(this.ef.transport||0)+(this.ef.health||0)+(this.ef.other||0);
        const efTarget = efTotal * (this.ef.targetMonths || 6);
        if (efTarget > 0) {
            const efPct = Math.min((this.ef.currentBalance||0) / efTarget, 1);
            scores.push({ name: 'Fondo emergencia', score: Math.round(efPct * 25), max: 25, icon: '🚨' });
        } else {
            scores.push({ name: 'Fondo emergencia', score: 0, max: 25, icon: '🚨', note: 'Configurá fondo' });
        }

        // 4. Debt management (25 pts)
        const totalDebt = this.debts.reduce((s,d)=>s+(d.balance||0),0);
        if (this.debts.length === 0) {
            scores.push({ name: 'Sin deudas', score: 25, max: 25, icon: '✅' });
        } else if (totalIncome > 0) {
            const dti = this.debts.reduce((s,d)=>s+(d.payment||0),0) / totalIncome;
            scores.push({ name: 'Deuda/Ingreso', score: Math.round(Math.max(0, 1 - dti / 0.4) * 25), max: 25, icon: '💳' });
        } else {
            scores.push({ name: 'Deudas', score: totalDebt > 0 ? 5 : 25, max: 25, icon: '💳' });
        }

        const total = scores.reduce((s,x) => s + x.score, 0);
        const label = total >= 80 ? 'Excelente' : total >= 60 ? 'Bueno' : total >= 40 ? 'Regular' : 'Necesita atención';
        const color = total >= 80 ? '#22c55e' : total >= 60 ? '#3b82f6' : total >= 40 ? '#f59e0b' : '#ef4444';
        return { total, scores, label, color };
    }

    // ── Anomaly Detection (Z-score) ──
    detectAnomalies() {
        const anomalies = [];
        const catGroups = {};
        this.tx.forEach(t => {
            if (['income','savings'].includes(t.category)) return;
            if (!catGroups[t.category]) catGroups[t.category] = [];
            catGroups[t.category].push(t);
        });
        Object.entries(catGroups).forEach(([catId, txs]) => {
            if (txs.length < 3) return; // Need at least 3 for stats
            const amounts = txs.map(t => t.amount);
            const mean = amounts.reduce((s,a)=>s+a,0) / amounts.length;
            const variance = amounts.reduce((s,a)=>s+Math.pow(a-mean,2),0) / amounts.length;
            const stdDev = Math.sqrt(variance);
            if (stdDev === 0) return;
            // Check only this month's transactions
            txs.filter(t => t.date.startsWith(this.cm)).forEach(t => {
                const zScore = (t.amount - mean) / stdDev;
                if (zScore > 2) {
                    const cat = this.cats.find(c=>c.id===catId);
                    anomalies.push({
                        tx: t,
                        zScore: Math.round(zScore * 10) / 10,
                        mean: Math.round(mean),
                        catName: cat ? `${cat.icon} ${cat.name}` : catId,
                        pctAbove: Math.round(((t.amount - mean) / mean) * 100)
                    });
                }
            });
        });
        return anomalies.sort((a,b) => b.zScore - a.zScore);
    }

    // ── Spending Prediction (end of month) ──
    predictMonthEnd() {
        const thisMonthTx = this.tx.filter(t => t.date.startsWith(this.cm) && isVariableTx(t));
        const totalSpent = thisMonthTx.reduce((s,t)=>s+t.amount,0);
        const dayOfMonth = this.now.getDate();
        const daysInMonth = new Date(this.now.getFullYear(), this.now.getMonth()+1, 0).getDate();
        if (dayOfMonth < 2) return null;
        const dailyAvg = totalSpent / dayOfMonth;
        const projected = Math.round(dailyAvg * daysInMonth);
        const totalBudget = Object.values(this.budgets).reduce((s,b)=>s+b,0);
        return { projected, dailyAvg: Math.round(dailyAvg), totalBudget, willExceed: totalBudget > 0 && projected > totalBudget, excess: totalBudget > 0 ? projected - totalBudget : 0 };
    }

    // ── Smart Insights ──
    generateInsights() {
        const insights = [];
        const thisMonthTx = this.tx.filter(t => t.date.startsWith(this.cm) && isVariableTx(t));
        const incomeFromTx = this.tx.filter(t => t.date.startsWith(this.cm) && t.category === 'income').reduce((s,t)=>s+t.amount,0);
        const totalIncome = (this.incomes.length > 0 ? calcMonthlyIncome(this.incomes, this.monthNum) : 0) + incomeFromTx;
        const monthlyFixed = calcMonthlyFixed(this.fixed);

        // Top spending category
        const catSpending = {};
        thisMonthTx.forEach(t => { catSpending[t.category] = (catSpending[t.category]||0) + t.amount; });
        const topCat = Object.entries(catSpending).sort((a,b)=>b[1]-a[1])[0];
        if (topCat) {
            const cat = this.cats.find(c=>c.id===topCat[0]);
            const name = cat ? `${cat.icon} ${cat.name}` : topCat[0];
            insights.push({ icon: '📊', text: `Tu mayor gasto este mes es ${name}: $${fmt(topCat[1])}`, type: 'info' });
        }

        // Daily average trend
        const prediction = this.predictMonthEnd();
        if (prediction && prediction.willExceed) {
            insights.push({ icon: '⚠️', text: `A este ritmo ($${fmt(prediction.dailyAvg)}/día), vas a gastar ~$${fmt(prediction.projected)} este mes, $${fmt(prediction.excess)} por encima del presupuesto`, type: 'warning' });
        } else if (prediction && prediction.totalBudget > 0) {
            const margin = prediction.totalBudget - prediction.projected;
            insights.push({ icon: '✅', text: `A este ritmo, terminarás el mes con $${fmt(margin)} de margen sobre tu presupuesto`, type: 'success' });
        }

        // Fixed expenses ratio
        if (totalIncome > 0 && monthlyFixed > 0) {
            const fixedRatio = (monthlyFixed / totalIncome) * 100;
            if (fixedRatio > 60) {
                insights.push({ icon: '🔴', text: `Tus gastos fijos representan el ${Math.round(fixedRatio)}% de tu ingreso — es alto, idealmente debería ser <50%`, type: 'danger' });
            } else if (fixedRatio > 45) {
                insights.push({ icon: '🟡', text: `Gastos fijos al ${Math.round(fixedRatio)}% del ingreso — estás en el límite recomendado`, type: 'warning' });
            }
        }

        // Savings suggestion
        if (totalIncome > 0) {
            const variableSpent = thisMonthTx.reduce((s,t)=>s+t.amount,0);
            const freeBalance = totalIncome - monthlyFixed - variableSpent;
            if (freeBalance > 0) {
                insights.push({ icon: '💡', text: `Saldo libre estimado: $${fmt(freeBalance)} — considerá destinar una parte al ahorro o fondo de emergencia`, type: 'tip' });
            }
        }

        // Anomalies summary
        const anomalies = this.detectAnomalies();
        if (anomalies.length > 0) {
            insights.push({ icon: '🔍', text: `Se detectaron ${anomalies.length} gasto(s) inusuales este mes — revisá la sección de anomalías`, type: 'info' });
        }

        // Debt interest burn
        const totalInterest = this.debts.reduce((s,d)=>s+(d.balance||0)*(d.rate||0)/100/12,0);
        if (totalInterest > 0) {
            insights.push({ icon: '🔥', text: `Estás pagando ~$${fmt(totalInterest)}/mes solo en intereses de deudas`, type: 'warning' });
        }

        return insights;
    }
}

// ── KEYWORD CATEGORIZER ──────────────────────────────────────────────
const KEYWORD_DICT = {
    food: ['comida','almuerzo','cena','desayuno','supermercado','super','mercado','carniceria','verduleria','panaderia','rappi','pedidosya','uber eats','ubereats','mcdonalds','burger','pizza','restaurante','cafe','cafeteria','bar','sushi','heladeria','helado','facturas','medialunas','fiambreria','rotiseria','kiosco','devoto','tienda inglesa','disco','tata','geant','macro','ta-ta'],
    transport: ['nafta','combustible','estacionamiento','parking','uber','cabify','taxi','remis','peaje','ancap','shell','axion','ypf','patente','vtv','garage','cochera','bus','boleto','stm','bondi','subte','tren'],
    housing: ['alquiler','expensas','mudanza','inmobiliaria','contribucion','contribución','saneamiento'],
    entertainment: ['netflix','spotify','disney','hbo','amazon prime','youtube','cine','teatro','evento','entrada','concierto','juego','play','steam','xbox','nintendo','ps5','playstation'],
    shopping: ['ropa','zapatos','zapatillas','shopping','zara','nike','adidas','mercadolibre','amazon','tienda','mueble','decoracion','electrodomestico','celular','iphone','samsung'],
    health: ['farmacia','medico','médico','salud','medicamento','pastilla','prepaga','mutualista','hospital','clinica','clínica','dentista','odontologo','oftalmólogo','veterinaria','vet'],
    utilities: ['luz','agua','gas','internet','telefono','teléfono','celular plan','antel','movistar','claro','ute','ose','cable'],
    savings: ['ahorro','plazo fijo','inversion','inversión','fondo','deposito','depósito']
};

class SmartCategorizer extends MLCategorizer {
    constructor() { super(); }
    predict(transaction) {
        // 1. Try keyword dictionary first
        const desc = transaction.description.toLowerCase().trim();
        for (const [catId, keywords] of Object.entries(KEYWORD_DICT)) {
            for (const kw of keywords) {
                if (desc.includes(kw)) return { category: catId, confidence: 0.85 };
            }
        }
        // 2. Fall back to ML pattern matching
        return super.predict(transaction);
    }
}

// ── HELPERS ───────────────────────────────────────────────────────────
const fmt = (n) => { const v = n || 0; return v % 1 === 0 ? Math.round(v).toLocaleString('es-AR') : v.toLocaleString('es-AR', {minimumFractionDigits:2, maximumFractionDigits:2}); };
const fmtDec = (n) => (n || 0).toFixed(1);

function calcMonthlyIncome(incomes, monthNum) {
    return incomes.reduce((sum, inc) => {
        const amt = inc.amount || 0;
        if (inc.frequency === 'monthly') return sum + amt;
        if (inc.frequency === 'annual') return sum + amt / 12;
        if (inc.frequency === 'biannual') { const sm = inc.seasonalMonths || [6, 12]; return sm.includes(monthNum) ? sum + amt : sum; }
        return sum;
    }, 0);
}

function calcMonthlyFixed(fixedExpenses) {
    // Sólo mensuales + anuales prorrateo (NO incluye specific-month)
    return fixedExpenses.reduce((sum, exp) => {
        const amt = exp.amount || 0;
        if (exp.frequency === 'monthly') return sum + amt;
        if (exp.frequency === 'annual') return sum + amt / 12;
        return sum;
    }, 0);
}

function calcFixedForMonth(fixedExpenses, monthNum) {
    // Mensuales + anuales prorrateo + gastos del mes específico elegido
    return fixedExpenses.reduce((sum, exp) => {
        const amt = exp.amount || 0;
        if (exp.frequency === 'monthly') return sum + amt;
        if (exp.frequency === 'annual') return sum + amt / 12;
        if (exp.frequency === 'specific-month' && exp.paymentMonth === monthNum) return sum + amt;
        return sum;
    }, 0);
}

function calcPayoffMonths(balance, payment, annualRate) {
    if (!balance || !payment || payment <= 0) return null;
    if (!annualRate || annualRate === 0) return Math.ceil(balance / payment);
    const r = annualRate / 100 / 12;
    const interest = r * balance;
    if (payment <= interest) return Infinity;
    return Math.ceil(-Math.log(1 - (r * balance) / payment) / Math.log(1 + r));
}

const MONTHS_SHORT = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const NEEDS_CATS = ['food', 'housing', 'utilities', 'health', 'transport'];
const WANTS_CATS = ['entertainment', 'shopping', 'other'];

// Helper: is this a variable (non-fixed) spending transaction?
const isVariableTx = (t) => !['income','savings'].includes(t.category) && !t.fixedExpenseId;
const isSpendingTx = (t) => !['income','savings'].includes(t.category);

// ── MAIN APP ──────────────────────────────────────────────────────────
function FinanceApp() {
    const [view, setView] = useState('dashboard');
    const [transactions, setTransactions] = useState([]);
    const [categories, setCategories] = useState([]);
    const [budgets, setBudgets] = useState({});
    const [goals, setGoals] = useState([]);
    const [mlCategorizer] = useState(() => new SmartCategorizer());
    const [loading, setLoading] = useState(true);
    const [incomes, setIncomes] = useState([]);
    const [fixedExpenses, setFixedExpenses] = useState([]);
    const [debts, setDebts] = useState([]);
    const [emergencyFund, setEmergencyFund] = useState({ housing: 0, utilities: 0, food: 0, transport: 0, health: 0, other: 0, targetMonths: 6, currentBalance: 0, monthlyDeposit: 0 });

    const currentMonth = useMemo(() => { const n = new Date(); return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}`; }, []);

    useEffect(() => {
        setLoading(true);
        let cats = storage.get('categories');
        if (!cats) {
            cats = [
                { id: 'food', name: 'Alimentación', icon: '🍔', color: '#10b981' },
                { id: 'transport', name: 'Transporte', icon: '🚗', color: '#3b82f6' },
                { id: 'housing', name: 'Vivienda', icon: '🏠', color: '#8b5cf6' },
                { id: 'entertainment', name: 'Entretenimiento', icon: '🎬', color: '#f59e0b' },
                { id: 'shopping', name: 'Compras', icon: '🛍️', color: '#ec4899' },
                { id: 'health', name: 'Salud', icon: '⚕️', color: '#06b6d4' },
                { id: 'utilities', name: 'Servicios', icon: '⚡', color: '#6366f1' },
                { id: 'income', name: 'Ingresos', icon: '💰', color: '#22c55e' },
                { id: 'savings', name: 'Ahorros', icon: '🏦', color: '#14b8a6' },
                { id: 'other', name: 'Otros', icon: '📦', color: '#64748b' }
            ];
            storage.set('categories', cats);
        }
        setCategories(cats);
        const txKeys = storage.list('transactions:');
        const allTx = [];
        for (const key of txKeys) { const m = storage.get(key); if (m) allTx.push(...m); }
        setTransactions(allTx.sort((a,b) => new Date(b.date)-new Date(a.date)));
        setBudgets(storage.get(`budgets:${currentMonth}`) || {});
        setGoals(storage.get('goals') || []);
        mlCategorizer.load();
        setIncomes(storage.get('incomes') || []);
        setFixedExpenses(storage.get('fixed-expenses') || []);
        setDebts(storage.get('debts') || []);
        setEmergencyFund(storage.get('emergency-fund') || { housing:0, utilities:0, food:0, transport:0, health:0, other:0, targetMonths:6, currentBalance:0, monthlyDeposit:0 });
        setLoading(false);
    }, [currentMonth, mlCategorizer]);

    const addTransaction = (transaction) => {
        const newTx = { id: Date.now().toString(), date: new Date().toISOString().split('T')[0], ...transaction };
        if (!newTx.category || newTx.category === 'Sin categorizar') {
            const pred = mlCategorizer.predict(newTx);
            newTx.category = pred.confidence > 0.5 ? pred.category : 'other';
            if (pred.confidence > 0.5) newTx.autoCategorized = true;
        }
        const updated = [newTx, ...transactions];
        setTransactions(updated);
        const month = newTx.date.substring(0, 7);
        storage.set(`transactions:${month}`, updated.filter(t => t.date.startsWith(month)));
        if (newTx.category !== 'Sin categorizar') mlCategorizer.train(newTx, newTx.category);
    };

    const deleteTransaction = (txId) => {
        const tx = transactions.find(t => t.id === txId);
        if (!tx) return;
        const updated = transactions.filter(t => t.id !== txId);
        setTransactions(updated);
        storage.set(`transactions:${tx.date.substring(0,7)}`, updated.filter(t => t.date.startsWith(tx.date.substring(0,7))));
    };

    const updateTransaction = (txId, newData) => {
        const oldTx = transactions.find(t => t.id === txId);
        if (!oldTx) return;
        const updatedTx = {...oldTx, ...newData};
        let updated = transactions.map(t => t.id === txId ? updatedTx : t);
        updated = updated.sort((a,b) => new Date(b.date)-new Date(a.date));
        setTransactions(updated);
        // Save old month
        const oldMonth = oldTx.date.substring(0,7);
        storage.set(`transactions:${oldMonth}`, updated.filter(t => t.date.startsWith(oldMonth)));
        // Save new month if different
        const newMonth = updatedTx.date.substring(0,7);
        if (newMonth !== oldMonth) {
            storage.set(`transactions:${newMonth}`, updated.filter(t => t.date.startsWith(newMonth)));
        }
        if (updatedTx.category) mlCategorizer.train(updatedTx, updatedTx.category);
    };

    const addCategory = (cat) => {
        const updated = [...categories, cat];
        setCategories(updated);
        storage.set('categories', updated);
    };

    const updateBudget = (category, amount) => { const u = {...budgets,[category]:amount}; setBudgets(u); storage.set(`budgets:${currentMonth}`,u); };
    const addGoal = (goal) => { const u = [...goals,{id:Date.now().toString(),...goal,progress:0}]; setGoals(u); storage.set('goals',u); };
    const updateGoal = (goalId, amount) => { const u = goals.map(g => g.id===goalId ? {...g,progress:g.progress+amount} : g); setGoals(u); storage.set('goals',u); };
    const deleteGoal = (goalId) => { const u = goals.filter(g => g.id !== goalId); setGoals(u); storage.set('goals', u); };

    const saveIncomes = (u) => { setIncomes(u); storage.set('incomes', u); };
    const saveFixed = (u) => { setFixedExpenses(u); storage.set('fixed-expenses', u); };
    const saveDebts = (u) => { setDebts(u); storage.set('debts', u); };
    const saveEF = (u) => { setEmergencyFund(u); storage.set('emergency-fund', u); };

    const importJSON = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            try {
                const data = JSON.parse(ev.target.result);
                if (data.categories) { setCategories(data.categories); storage.set('categories', data.categories); }
                if (data.transactions) {
                    setTransactions(data.transactions);
                    const months = {};
                    data.transactions.forEach(t => { const m = t.date.substring(0,7); if (!months[m]) months[m] = []; months[m].push(t); });
                    Object.entries(months).forEach(([m, txs]) => storage.set(`transactions:${m}`, txs));
                }
                if (data.budgets) { setBudgets(data.budgets); storage.set(`budgets:${currentMonth}`, data.budgets); }
                if (data.goals) { setGoals(data.goals); storage.set('goals', data.goals); }
                if (data.incomes) { setIncomes(data.incomes); storage.set('incomes', data.incomes); }
                if (data.fixedExpenses) { setFixedExpenses(data.fixedExpenses); storage.set('fixed-expenses', data.fixedExpenses); }
                if (data.debts) { setDebts(data.debts); storage.set('debts', data.debts); }
                if (data.emergencyFund) { setEmergencyFund(data.emergencyFund); storage.set('emergency-fund', data.emergencyFund); }
                alert('✅ Datos importados correctamente');
            } catch(err) { alert('❌ Error al importar: ' + err.message); }
        };
        reader.readAsText(file);
        e.target.value = '';
    };

    const exportJSON = () => {
        const data = { transactions, categories, budgets, goals, incomes, fixedExpenses, debts, emergencyFund, exportDate: new Date().toISOString() };
        const blob = new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href=url; a.download=`finanzas-${currentMonth}.json`; a.click();
    };

    const exportXLSX = () => {
        if (typeof XLSX === 'undefined') { alert('Librería Excel no disponible. Verificá tu conexión.'); return; }
        const wb = XLSX.utils.book_new();
        const cats = categories;

        // Transacciones
        const txRows = transactions.length ? transactions.map(t => ({
            'Fecha': t.date, 'Descripción': t.description,
            'Categoría': cats.find(c=>c.id===t.category)?.name || t.category,
            'Monto ($)': t.amount
        })) : [{'Info':'Sin transacciones'}];
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(txRows), 'Transacciones');

        // Ingresos
        const incRows = incomes.length ? incomes.map(i => ({
            'Fuente': i.name, 'Monto ($)': i.amount,
            'Frecuencia': i.frequency==='monthly'?'Mensual':i.frequency==='biannual'?'Semestral':'Anual',
            'Tipo': i.type==='fixed'?'Fijo':'Variable',
            'Equiv. Mensual ($)': i.frequency==='monthly'?i.amount:i.frequency==='annual'?i.amount/12:i.amount/6,
            'Notas': i.notes||''
        })) : [{'Info':'Sin ingresos'}];
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(incRows), 'Ingresos');

        // Gastos Fijos
        const fixRows = fixedExpenses.length ? fixedExpenses.map(e => ({
            'Concepto': e.name, 'Categoría': e.category,
            'Monto ($)': e.amount,
            'Frecuencia': e.frequency==='monthly'?'Mensual':e.frequency==='annual'?'Anual (prorrateo)':`Anual — mes ${MONTHS_SHORT[(e.paymentMonth||1)-1]}`,
            'Mensual Prorrateo ($)': e.frequency==='monthly'?e.amount:e.frequency==='annual'?e.amount/12:'(mes específico)',
            'Notas': e.notes||''
        })) : [{'Info':'Sin gastos fijos'}];
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(fixRows), 'Gastos Fijos');

        // Flujo Mensual
        const year = new Date().getFullYear();
        const totalBudget = Object.values(budgets).reduce((s,b)=>s+b,0);
        let cumBal = 0;
        const flowRows = Array.from({length:12},(_,i)=>{
            const mn = i+1;
            const ms = `${year}-${String(mn).padStart(2,'0')}`;
            const inc = (incomes.length>0?calcMonthlyIncome(incomes,mn):0) + transactions.filter(t=>t.date.startsWith(ms)&&t.category==='income').reduce((s,t)=>s+t.amount,0);
            const vari = transactions.filter(t=>t.date.startsWith(ms)&&isVariableTx(t)).reduce((s,t)=>s+t.amount,0)||totalBudget;
            const sav = transactions.filter(t=>t.date.startsWith(ms)&&t.category==='savings').reduce((s,t)=>s+t.amount,0);
            const fixedMn = calcFixedForMonth(fixedExpenses, mn);
            const bal = inc - fixedMn - vari - sav;
            cumBal += bal;
            return { 'Mes':MONTHS_SHORT[i], 'Ingresos ($)':Math.round(inc), 'Gastos Fijos ($)':Math.round(fixedMn), 'Gastos Variables ($)':Math.round(vari), 'Ahorro ($)':Math.round(sav), 'Saldo Libre ($)':Math.round(bal), 'Balance Acumulado ($)':Math.round(cumBal) };
        });
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(flowRows), 'Flujo Mensual');

        // Deudas
        const debtRows = debts.length ? debts.map(d => ({
            'Deuda': d.name, 'Tipo': d.type, 'Saldo ($)': d.balance,
            'Cuota Mensual ($)': d.payment, 'Tasa Anual (%)': d.rate,
            'Meses para cancelar': calcPayoffMonths(d.balance,d.payment,d.rate)||'-',
            'Notas': d.notes||''
        })) : [{'Info':'Sin deudas'}];
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(debtRows), 'Deudas');

        // Metas
        const goalRows = goals.length ? goals.map(g => ({
            'Meta': g.name, 'Objetivo ($)': g.target, 'Progreso ($)': g.progress,
            '% Completado': `${Math.round((g.progress/g.target)*100)}%`, 'Fecha Límite': g.deadline
        })) : [{'Info':'Sin metas'}];
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(goalRows), 'Metas');

        // Fondo Emergencia
        const efTotal = (emergencyFund.housing||0)+(emergencyFund.utilities||0)+(emergencyFund.food||0)+(emergencyFund.transport||0)+(emergencyFund.health||0)+(emergencyFund.other||0);
        const efMeta = efTotal*(emergencyFund.targetMonths||6);
        const efRows = [
            {'Concepto':'Vivienda (mensual)','Monto ($)':emergencyFund.housing||0},
            {'Concepto':'Servicios (mensual)','Monto ($)':emergencyFund.utilities||0},
            {'Concepto':'Alimentación (mensual)','Monto ($)':emergencyFund.food||0},
            {'Concepto':'Transporte (mensual)','Monto ($)':emergencyFund.transport||0},
            {'Concepto':'Salud (mensual)','Monto ($)':emergencyFund.health||0},
            {'Concepto':'Otros esenciales (mensual)','Monto ($)':emergencyFund.other||0},
            {'Concepto':'TOTAL ESENCIALES MENSUALES','Monto ($)':efTotal},
            {'Concepto':'Meses de cobertura objetivo','Monto ($)':emergencyFund.targetMonths||6},
            {'Concepto':'META DEL FONDO ($)','Monto ($)':efMeta},
            {'Concepto':'Saldo actual ($)','Monto ($)':emergencyFund.currentBalance||0},
            {'Concepto':'% completado','Monto ($)':efMeta>0?`${((emergencyFund.currentBalance||0)/efMeta*100).toFixed(1)}%`:'0%'},
        ];
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(efRows), 'Fondo Emergencia');

        XLSX.writeFile(wb, `finanzas-pro-${currentMonth}.xlsx`);
    };

    if (loading) return (
        <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center'}}>
            <div className="text-2xl font-serif text-cyan-400">Cargando finanzas...</div>
        </div>
    );

    return (
        <div>
            <Header view={view} setView={setView} onExportJSON={exportJSON} onExportXLSX={exportXLSX} onImportJSON={importJSON} />
            <main className="container py-8">
                {view==='dashboard' && <Dashboard transactions={transactions} categories={categories} budgets={budgets} currentMonth={currentMonth} incomes={incomes} fixedExpenses={fixedExpenses} debts={debts} goals={goals} emergencyFund={emergencyFund} />}
                {view==='transactions' && <TransactionsView transactions={transactions} categories={categories} fixedExpenses={fixedExpenses} budgets={budgets} onAdd={addTransaction} onDelete={deleteTransaction} onEdit={updateTransaction} onAddCategory={addCategory} />}
                {view==='budget' && <BudgetView budgets={budgets} categories={categories} transactions={transactions} currentMonth={currentMonth} onUpdate={updateBudget} onAddCategory={addCategory} />}
                {view==='goals' && <GoalsView goals={goals} onAdd={addGoal} onUpdateGoal={updateGoal} onDeleteGoal={deleteGoal} />}
                {view==='incomes' && <IncomesView incomes={incomes} onSave={saveIncomes} />}
                {view==='fixed-expenses' && <FixedExpensesView fixedExpenses={fixedExpenses} onSave={saveFixed} />}
                {view==='cashflow' && <CashFlowView incomes={incomes} fixedExpenses={fixedExpenses} transactions={transactions} budgets={budgets} currentMonth={currentMonth} />}
                {view==='debts' && <DebtsView debts={debts} onSave={saveDebts} />}
                {view==='emergency' && <EmergencyFundView fund={emergencyFund} onSave={saveEF} />}
                {view==='simulator' && <SimulatorView incomes={incomes} fixedExpenses={fixedExpenses} budgets={budgets} debts={debts} transactions={transactions} categories={categories} currentMonth={currentMonth} goals={goals} emergencyFund={emergencyFund} />}
            </main>
        </div>
    );
}

// ── HEADER ────────────────────────────────────────────────────────────
function Header({ view, setView, onExportJSON, onExportXLSX, onImportJSON }) {
    const navBtn = (v, icon, label) => (
        <button onClick={() => setView(v)} className={view===v?'nav-btn active':'nav-btn'}>{icon} {label}</button>
    );
    const fileInputRef = React.useRef(null);
    return (
        <header className="header">
